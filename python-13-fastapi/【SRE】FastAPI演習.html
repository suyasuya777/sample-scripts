<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【SRE】FastAPI 演習</title>
<style>
:root{
  --bg:#E8ECF0; --panel:#FFFFFF; --ink:#1B2733; --sub:#5A6878; --line:#CDD5DD;
  --accent:#05877A; --accent-soft:#DDF1EE;
  --r0:#C0453A; --r1:#C98718; --r2:#2F6DB0; --r3:#1E8A57;
  --r0-soft:#F7E3E1; --r3-soft:#DFF1E7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
code{font-family:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:.88em;
  background:#EEF2F5;border:1px solid #DCE3E9;border-radius:4px;padding:0 .3em;word-break:break-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:8px 0 16px;border-bottom:2px solid var(--ink);margin-bottom:24px}
h1{margin:0;font-size:1.45rem;line-height:1.3;letter-spacing:.02em}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--sub);letter-spacing:0}
nav{display:flex;gap:4px}
nav button{background:none;border:1px solid transparent;border-radius:6px;padding:6px 14px;color:var(--sub)}
nav button[aria-current="page"]{border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--panel)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:1.05rem;margin:0 0 12px}
.muted{color:var(--sub);font-size:.88rem}

/* 分布バー：ジャンルごとのランク内訳 */
.genres{list-style:none;margin:0;padding:0}
.genres li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;
  padding:10px 0;border-bottom:1px solid #E6EBF0}
.genres li:last-child{border-bottom:none}
.genres input{width:18px;height:18px;accent-color:var(--accent)}
.gname{font-weight:600}
.gname .num{display:inline-block;min-width:2.2em;color:var(--sub);font-weight:400}
.dist{grid-column:2;display:flex;height:10px;border-radius:5px;overflow:hidden;background:#E6EBF0}
.dist span{display:block;height:100%}
.gmeta{grid-column:2;font-size:.8rem;color:var(--sub)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--sub);margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg label{padding:8px 16px;cursor:pointer;border-left:1px solid var(--ink)}
.seg label:first-child{border-left:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:#fff}
.btn{border:1px solid var(--ink);background:var(--panel);border-radius:8px;padding:9px 18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.small{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.section{margin-top:18px}

/* 出題画面 */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:.88rem;color:var(--sub)}
.progress{height:4px;background:#D5DCE3;border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.meter{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.meter .bars{display:inline-flex;gap:3px}
.meter .bars b{width:14px;height:8px;border-radius:2px;background:#D5DCE3}
.qtext{font-size:1.08rem;font-weight:600;margin:0 0 18px;white-space:pre-wrap}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{width:100%;text-align:left;display:grid;grid-template-columns:2em 1fr;gap:8px;align-items:start;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-weight:700;color:var(--sub)}
.opt:disabled{cursor:default}
.opt.correct{border:2px solid var(--r3);background:var(--r3-soft)}
.opt.wrong{border:2px solid var(--r0);background:var(--r0-soft)}
.feedback{margin-top:18px;border-left:4px solid var(--r3);padding:4px 0 4px 14px}
.feedback.ng{border-left-color:var(--r0)}
.verdict{font-weight:700;font-size:1.05rem;margin:0}
.rankmove{font-size:.9rem;color:var(--sub);margin:0 0 8px}
.expl{margin:0 0 8px}
.ref{font-size:.85rem;color:var(--sub);margin:0}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

/* 結果画面 */
.complete{border:2px solid var(--r3);background:var(--r3-soft);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.complete p{margin:0}
.complete .big{font-size:1.6rem;font-weight:800;color:var(--r3);letter-spacing:.04em}
.score{font-size:2.2rem;font-weight:800;line-height:1.2;margin:0}
.missed{margin:12px 0 0;padding-left:1.2em}
.missed li{margin:4px 0}

table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid #E6EBF0;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-weight:600;color:var(--sub);border-bottom:1px solid var(--ink)}
tfoot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:none}
.tscroll{overflow-x:auto}
textarea{width:100%;min-height:120px;font-family:Menlo,Consolas,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (max-width:520px){ .wrap{padding:14px 12px 48px} .panel{padding:16px} .score{font-size:1.8rem} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FastAPI 演習<small>SRE 視点版スキルマップ 7章</small></h1>
    <nav aria-label="画面切り替え">
      <button id="navQuiz" aria-current="page">演習</button>
      <button id="navStats">学習成績</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   ジャンル
   ===================================================================== */
const GENRES = [
  {no:"01", name:"ライフサイクル", dir:"01_lifecycle"},
  {no:"02", name:"外向き通信", dir:"02_outbound"},
  {no:"03", name:"観測可能性", dir:"03_observability"},
  {no:"04", name:"失敗の表現", dir:"04_failure"},
  {no:"05", name:"非同期処理の落とし穴", dir:"05_async_pitfalls"},
  {no:"06", name:"コンテナ化と実行環境", dir:"06_runtime"},
  {no:"07", name:"統合アプリ", dir:"07_integrated"},
];
const RANKS = ["ミス","ジャブ","ヒット","コンボ"];

/* =====================================================================
   問題  c: 正解 / w: 誤答3つ / e: 解説 / r: 参照
   ===================================================================== */
const Q = [
/* ---------------- 01 lifecycle ---------------- */
{id:"01-01",g:0,q:"graceful shutdown の4段階として、正しい順序はどれか。",
 c:"readiness を 503 にする → LB が外すのを待つ → 処理中リクエストの完了を待つ → リソースを閉じる",
 w:["処理中リクエストの完了を待つ → readiness を 503 にする → LB が外すのを待つ → リソースを閉じる",
    "readiness を 503 にする → リソースを閉じる → LB が外すのを待つ → 処理中リクエストの完了を待つ",
    "LB が外すのを待つ → readiness を 503 にする → リソースを閉じる → 処理中リクエストの完了を待つ"],
 e:"先に readiness を落として LB に「もう振らないで」と伝え、実際に外れるまで待ってから処理中を待ち、最後に接続プールなどを閉じる。受け口やリソースを先に閉じると、LB がまだ振ってくるリクエストが 502 になる。",
 r:"01_lifecycle/graceful_shutdown/graceful_shutdown.py"},
{id:"01-02",g:0,q:"「SIGTERM を受けたら即座にプロセスを閉じる」実装で、デプロイのたびに 502 が出る主な理由はどれか。",
 c:"SIGTERM の時点ではまだターゲットとして登録され、新規リクエストが届くから",
 w:["SIGTERM が ALB にも伝わり、ALB 自身が一時的に 502 を返すから",
    "SIGTERM を受けると uvicorn が /readyz に 200 を返し続けるから",
    "SIGTERM を受けたタスクには、ECS が新しい IP を割り当て直すから"],
 e:"SIGTERM はタスク側だけの出来事で、LB から見ればまだ健全なターゲット。先に readiness を落とし、外れるまで待つ必要がある。",
 r:"01_lifecycle/graceful_shutdown/graceful_shutdown.py"},
{id:"01-03",g:0,q:"lifespan の起動処理で、外部 API や DB への疎通確認を行わない理由として最も適切なものはどれか。",
 c:"依存先の障害中に起動失敗と再起動のループに入り、復旧時も自動で戻りにくいから",
 w:["lifespan の yield より前では await が使えず、疎通確認を書けないから",
    "起動時に接続した DB コネクションは、リクエスト処理で再利用できないから",
    "疎通確認の結果は app.state に保存できず、readiness から参照できないから"],
 e:"原則は「起動は通す、readiness で落とす」。起動は成功させて readiness を 503 にしておけば、LB から外れたまま待機し、依存先の復旧と同時に自動で復帰できる。",
 r:"01_lifecycle/lifespan_basics/lifespan_basics.py"},
{id:"01-04",g:0,q:"/livez と /readyz の使い分けとして正しいものはどれか。",
 c:"LB が振り分け判断に使うのは /readyz、オーケストレータが再起動判断に使うのは /livez",
 w:["LB が振り分け判断に使うのは /livez、オーケストレータが再起動判断に使うのは /readyz",
    "どちらも LB が使い、/livez は HTTP、/readyz は HTTPS 用に分ける",
    "/livez は依存先の状態を見て、/readyz はプロセス生存だけを見る"],
 e:"/livez はプロセス生存のみで依存先は一切見ない。依存先を見ると、DB 障害でタスクが再起動され続けることになる。/readyz は依存先とシャットダウン状態を見る。",
 r:"01_lifecycle/health_endpoints/health_endpoints.py"},
{id:"01-05",g:0,q:"readiness に DB 疎通を含めた構成で DB が落ちた。起きることとして教材が挙げているものはどれか。",

 r:"01_lifecycle/health_endpoints/health_endpoints.py"},
{id:"01-06",g:0,q:"readiness に依存先のチェックを含めるかどうかの判断基準として、教材の立場に合うものはどれか。",
 c:"その依存なしでサービスが成立するかで決め、縮退できるなら含めない",
 w:["依存先の SLA が自サービスの SLO より高ければ、含めてよい",

 r:"01_lifecycle/health_endpoints/health_endpoints.py"},
{id:"01-07",g:0,q:"次の設定で、シャットダウンの検算として確認すべき関係はどれか。\nヘルスチェック 10秒×2回、登録解除遅延 30秒、アプリのドレイン待機 20秒＋処理中待機 30秒、ECS stopTimeout 90秒",

 e:"SIGTERM から SIGKILL までの猶予が stopTimeout。アプリのシャットダウン所要時間がこれを超えると、処理の途中で強制終了される。",
 r:"01_lifecycle/README.md"},
{id:"01-08",g:0,q:"アプリのシャットダウン所要時間が ECS の stopTimeout より長いと、何が起きるか。",
 c:"stopTimeout 経過時点で SIGKILL され、処理中のリクエストが切れる",
 w:["ECS が stopTimeout を自動で延長し、処理中のリクエストの完了まで待つ",
    "SIGTERM が再送され、アプリはシャットダウン処理を最初からやり直す",
    "タスクは DRAINING のまま残り、手動で停止するまで課金が続く"],
 e:"逆転していると、コード上は丁寧に待っていても最後は強制終了になる。デプロイ時 5xx の原因候補として、この逆転は必ず検算する。",
 r:"01_lifecycle/README.md"},
{id:"01-09",g:0,q:"Fargate で設定できる stopTimeout の最大値はどれか。",
 c:"120秒", w:["30秒","60秒","300秒"],
 e:"Fargate の stopTimeout は最大 120秒。ドレイン待機と処理中待機の合計はこの範囲に収める必要がある。",
 r:"01_lifecycle/README.md"},
{id:"01-10",g:0,q:"graceful_shutdown.py の処理中カウント用ミドルウェアが、/livez と /readyz を数えない理由として最も適切なものはどれか。",
 c:"ヘルスチェックは常に届くので、数えると処理中が 0 になりにくく、③の待機が上限まで伸びるから",
 w:["ヘルスチェックは lifespan の外で処理され、アプリのミドルウェアを通らないから",

 r:"01_lifecycle/graceful_shutdown/graceful_shutdown.py"},
{id:"01-11",g:0,q:"uvicorn の --timeout-graceful-shutdown を、アプリ側で処理中リクエストを待つ時間より短く設定すると、どうなるか。",

    "SIGTERM を受け付けなくなり、ECS の stopTimeout に達するまで何も起きない",
    "処理中リクエストは別のワーカーへ引き継がれて完走する"],
 e:"待ち時間は、アプリ・uvicorn・ECS の stopTimeout がすべて噛み合って初めて成立する。どれか1つが短いと、そこで切れる。",
 r:"01_lifecycle/graceful_shutdown/graceful_shutdown.py"},

/* ---------------- 02 outbound ---------------- */
{id:"02-01",g:1,q:"リクエストごとに `async with httpx.AsyncClient()` でクライアントを作って捨てる実装の問題点として、教材が挙げる3つの組み合わせはどれか。",
 c:"TLS ハンドシェイクでのレイテンシ増、エフェメラルポート枯渇、SNAT ポート枯渇",

{id:"02-09",g:1,q:"ALB のアイドルタイムアウトとアプリ（uvicorn）の Keep-Alive タイムアウトの関係として、502 を避けるために正しいものはどれか。",

 w:["アプリの Keep-Alive タイムアウトを、ALB のアイドルタイムアウトより短くする",
    "両者を同じ値にそろえ、同時に接続が閉じられるようにする",
    "両者は独立した設定なので、関係を気にする必要はない"],
 e:"ALB はターゲットとの接続を使い回す。アプリ側が先にアイドル接続を閉じると、ALB がその接続でリクエストを送った瞬間に 502 になる。uvicorn の既定は5秒、ALB の既定は60秒なので、既定のままだと逆転している。注意：timeout_layers.py の記入表は uvicorn の --timeout-keep-alive を ALB より内側（短い側）に置いているが、Keep-Alive はこの一般則の例外で、逆向きが正しい。",

{id:"02-10",g:1,q:"timeout_layers.py を記入表の初期値のまま実行すると、何が出力されるか。\n（クライアント60 / ALB 50 / uvicorn 45 / アプリ30 / 外部API 5 / DB 10）",

 w:["「逆転なし」の1行",

 e:"check_layers は隣り合う行を上から順に比べるだけ。外部 API と DB は入れ子ではなく、アプリから並列に呼ぶ兄弟なので、本来見るべきは「アプリ30秒 ＞ 外部API5秒」と「アプリ30秒 ＞ DB10秒」。実値で埋めるときは、並べ順と入れ子関係を分けて考える。",
 r:"02_outbound/timeout_layers/timeout_layers.py"},
{id:"02-11",g:1,q:"retry_backoff.py でリトライ対象になるものの組み合わせはどれか。",
 c:"接続失敗・接続/読み取りタイムアウト・429・500/502/503/504",
 w:["接続失敗・接続タイムアウト・400・404・500/502/503/504",
    "読み取りタイムアウト・401・403・429・Retry-After 付きの 4xx",
    "すべての例外とすべての 4xx・5xx"],
 e:"4xx はリクエスト内容が原因なので、何度送っても結果は変わらない。例外は 429（Retry-After に従う）と 408。",
 r:"02_outbound/retry_backoff/retry_backoff.py"},
{id:"02-12",g:1,q:"400 / 401 / 403 / 404 をリトライしてはいけない理由として正しいものはどれか。",
 c:"原因がリクエストの内容にあり、同じリクエストを何度送っても結果が変わらないから",
 w:["4xx は相手が過負荷のときに返るため、リトライすると復旧を妨げるから",
    "4xx の応答には Retry-After が付かないため、待ち時間を決められないから",
    "4xx は TCP 接続が切断されたことを示し、同じ接続を再利用できないから"],
 e:"リトライが効くのは「相手が一時的に不調」な場合だけ。4xx の中でも 429 と 408 は一時的な状況を示すので例外になる。",
 r:"02_outbound/retry_backoff/retry_backoff.py"},
{id:"02-13",g:1,q:"3層構成で、各層が `MAX_ATTEMPTS = 3`（総試行3回）でリトライする。最下層に届く最悪時のリクエスト数はいくつか。",
 c:"27", w:["9","64","81"],
 e:"1層あたり3回 × 3層 = 3×3×3 = 27（教材の amplification([3,3,3])）。「初回＋リトライ3回」と数えると1層4回なので 4×4×4 = 64 になる。「3回リトライ」がどちらを指すか、先に数え方をそろえるのが検算の第一歩。",
 r:"02_outbound/retry_backoff/retry_backoff.py"},
{id:"02-14",g:1,q:"retry_backoff.py の `backoff_delay(attempt=2)` が返す値はどれか。\n（BASE_DELAY=0.5、MAX_DELAY=8.0、フルジッタ）",

 e:"capped = min(8.0, 0.5 × 2²) = 2.0。フルジッタは `random.uniform(0, capped)` なので 0〜2.0秒。",
 r:"02_outbound/retry_backoff/retry_backoff.py"},
{id:"02-15",g:1,q:"指数バックオフにジッタを加える目的として正しいものはどれか。",
 c:"多数のクライアントの再試行時刻を散らし、リトライの波が揃うのを防ぐ",

    "リトライ回数を確率的に減らし、総リクエスト数を半分にする",
    "サーバ側のログで、リトライされたリクエストを識別できるようにする"],
 e:"同じ時刻に失敗したクライアントが同じ間隔で再試行すると、波がそろって相手に同時に押し寄せる。乱数で時刻をばらけさせる。",
 r:"02_outbound/retry_backoff/retry_backoff.py"},
{id:"02-16",g:1,q:"retry_backoff.py の `get_with_retry` で、1回目が 429 を返し `Retry-After: 30` が付いていた。この実装はどう動くか。（TOTAL_BUDGET=10.0）",
 c:"待機30秒が時間予算10秒を超えるため、待たずにリトライを打ち切って例外を送出する",
 w:["30秒待ってから2回目を送る",
    "Retry-After を無視し、バックオフの値だけ待って2回目を送る",
    "429 はリトライ対象外なので、HTTPStatusError をそのまま送出する"],
 e:"delay = max(バックオフ, 30) = 30。spent 0 + 30 ＞ 10 なので break し、`retry exhausted` の RuntimeError になる。予算は総試行回数だけでなく、総所要時間にも上限を置くためのもの。",
 r:"02_outbound/retry_backoff/retry_backoff.py"},

{id:"02-20",g:1,q:"idempotency_key.py に、保存済みのキーと同じ Idempotency-Key で、ボディだけ異なる POST が届いた。返るものはどれか。",

{id:"02-21",g:1,q:"idempotency_key.py の実処理を「await を伴う DB 書き込み」に置き換えた。初回の処理中に、同じキーで再送が届くとどうなるか。",

/* ---------------- 05 async pitfalls ---------------- */
{id:"05-01",g:4,q:"`async def` のエンドポイント内で `time.sleep(3)` を呼ぶと、何が起きるか。",
 c:"イベントループが3秒止まり、同じワーカーの無関係なリクエストまで待たされる",
 w:["FastAPI が自動でスレッドへ逃がすので、他のリクエストには影響しない",
    "そのリクエストだけがタイムアウトし、500 が返る",
    "time.sleep は async def の中では無視され、即座に応答が返る"],
 e:"イベントループは1スレッド。await しない処理の間、他のリクエストは一切進まない。requests、同期 DB ドライバ、重い CPU 処理も同じ。",
 r:"05_async_pitfalls/blocking_event_loop/blocking_event_loop.py"},
{id:"05-02",g:4,q:"イベントループのブロッキングによる障害の見え方として、教材の説明に合うものはどれか。",
 c:"エラーも CPU 上昇もなく処理時間だけが伸び、遅い API と原因の API が別物になる",
 w:["遅いエンドポイントで 500 が多発し、アプリログに例外とスタックトレースが残る",
    "CPU 使用率が 100% に張り付き、メモリも増え続けてタスクが OOM で再起動される",
    "ALB が 502 を返し、ヘルスチェックも失敗してターゲットが unhealthy として外される"],
 e:"見分け方は、遅くなった時刻に同じタスクへ届いた別のリクエストを調べること。重い同期処理が走っていれば、そこが犯人。",
 r:"05_async_pitfalls/blocking_event_loop/blocking_event_loop.py"},
{id:"05-03",g:4,q:"次のうち、イベントループを止めてしまう書き方はどれか。",
 c:"`async def` の中で `requests.get()` を呼ぶ",
 w:["`async def` の中で `await asyncio.to_thread(time.sleep, 3)` を呼ぶ",
    "`def` のエンドポイントの中で `time.sleep(3)` を呼ぶ",
    "`async def` の中で `await client.get()`（httpx.AsyncClient）を呼ぶ"],
 e:"requests は同期ライブラリ。async def の中で呼ぶと、イベントループを止めるうえスレッドプールにも逃がされない、最悪の組み合わせになる。",
 r:"05_async_pitfalls/sync_vs_async/sync_vs_async.py"},
{id:"05-04",g:4,q:"psycopg2 のような同期ライブラリを使うエンドポイントの書き方として、教材の基準に合うものはどれか。",
 c:"`def` で書き、FastAPI にスレッドプールで実行させる",
 w:["`async def` で書き、そのまま呼び出す",
    "`async def` で書き、呼び出しの前に `await asyncio.sleep(0)` を入れる",
    "どちらで書いても FastAPI が自動で判別するので、違いはない"],
 e:"非同期ライブラリ（httpx, asyncpg）は async def、同期ライブラリ（requests, psycopg2）は def、CPU 負荷の高い処理は def か別プロセス。",
 r:"05_async_pitfalls/sync_vs_async/sync_vs_async.py"},
{id:"05-05",g:4,q:"`def` で書いた重い処理が多く、スレッドプールが枯渇したときの症状はどれか。",
 c:"後続が待ち行列に入り、エラーは出ずにレイテンシだけが伸びる",
 w:["新しいスレッドが無制限に作られ、メモリ不足でタスクが落ちる",
    "スレッドを取れないリクエストに即座に 503 が返る",
    "FastAPI が自動でイベントループ上に切り替えて実行する"],
 e:"FastAPI（anyio）のスレッドプールは既定で 40 程度。上限を上げる前に「なぜそんなに同期処理があるのか」を考える。増やすほどメモリと下流への同時接続も増える。",
 r:"05_async_pitfalls/sync_vs_async/sync_vs_async.py"},
{id:"05-06",g:4,q:"BackgroundTasks に載せた処理の性質として正しいものはどれか。",
 c:"レスポンス後に同じプロセスで動き、デプロイ等で失われても再実行されない",
 w:["別のワーカープロセスで実行され、失敗すると自動でリトライされる",
    "SQS に自動で投入され、タスクが落ちても別タスクが引き継ぐ",
    "レスポンス返却前に実行され、完了するまでクライアントは待たされる"],
 e:"ローリング更新のたびに数件ずつ消えるので障害として気づきにくく、数か月後に「データが合わない」形で表面化する。",
 r:"05_async_pitfalls/background_task_loss/background_task_loss.py"},
{id:"05-07",g:4,q:"BackgroundTasks に載せてよい処理はどれか。",
 c:"キャッシュの温め直し", w:["決済の確定","在庫の引当","外部システムへの連携"],
 e:"失われても困らない処理（アクセスログの追記、キャッシュの温め直し）は載せてよい。通知メールは △。決済・在庫・外部連携はキューへ逃がす。",
 r:"05_async_pitfalls/background_task_loss/background_task_loss.py"},
{id:"05-08",g:4,q:"失われては困る処理を確実に実行するため、教材が示す transactional outbox の流れとして正しいものはどれか。",
 c:"同じトランザクションで outbox テーブルに書く → 別プロセスが SQS へ送る → ワーカーが冪等に処理する",
 w:["BackgroundTasks で SQS へ送る → 失敗したらログに出す → 運用者が手動で再実行する",
    "SQS へ送る → 成功したら DB に書く → 失敗したら BackgroundTasks で再送する",
    "DB に書く → レスポンスを返す → 同じリクエストの BackgroundTasks で外部 API を呼ぶ"],
 e:"DB の更新とメッセージ送信を同じトランザクションにできないので、まず DB に「送るべきもの」として書き、送信は別プロセスに任せる。送信は重複し得るので、受け側は冪等にする。",
 r:"05_async_pitfalls/background_task_loss/background_task_loss.py"},
{id:"05-09",g:4,q:"pool_sizing.py の条件で、タスク数の上限はいくつか。\nワーカー1、1ワーカーあたりの DB プール10、DB の max_connections 200、管理用の予約 10",
 c:"19", w:["20","18","30"],
 e:"利用可能 = 200 − 10 = 190。1タスクあたり 1 × 10 = 10。190 ÷ 10 = 19。タスクを30に増やすと使用見込み300で超過する。プールを5に絞れば38まで立てられる。",
 r:"05_async_pitfalls/pool_sizing/pool_sizing.py"},
{id:"05-10",g:4,q:"負荷が高いので ECS タスク数を増やしたところ、全体のエラー率がかえって上がった。pool_sizing の観点で最初に疑うものはどれか。",
 c:"総接続数が DB の max_connections を超え、接続を取れないタスクが出た",
 w:["タスクを増やしたことで ALB のアイドルタイムアウトが自動で短くなり、接続が切れた",
    "タスクが増えるとイベントループがタスク間で共有され、1つのブロッキングが全体に波及した",
    "タスクを増やすと httpx の max_connections が自動で減らされた"],
 e:"接続数はスケールアウトの天井になる。RDS の max_connections は SHOW max_connections で実値を確認する。RDS Proxy を挟むとアプリ側と DB 側の接続数を分離できる。",
 r:"05_async_pitfalls/pool_sizing/pool_sizing.py"},

/* =====================================================================
   保存（Claude の保存領域があれば使い、なければブラウザのローカル領域）
   ===================================================================== */
const KEY = "sre-fastapi-quiz-v1";
const Store = {
  async load(){
    if (window.storage && typeof window.storage.get === "function") {
      try { const r = await window.storage.get(KEY, false); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    try { const v = window.localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; }
  },
  async save(d){
    const s = JSON.stringify(d);
    if (window.storage && typeof window.storage.set === "function") {
      try { await window.storage.set(KEY, s, false); return true; } catch(e){ return false; }
    }
    try { window.localStorage.setItem(KEY, s); return true; } catch(e){ return false; }
  }
};

/* =====================================================================
   状態
   ===================================================================== */
let DATA = {version:1, records:{}};
const rec = id => DATA.records[id] || (DATA.records[id] = {s:0, n:0, c:0, w:0, t:0});
const rankOf = id => (DATA.records[id] ? DATA.records[id].s : 0);

let view = "setup";
let setup = {genres: GENRES.map(()=>true), pattern:"nocombo"};
let session = null;

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

function genreCounts(g){
  const qs = Q.filter(q=>q.g===g);
  const c = [0,0,0,0];
  qs.forEach(q=>c[rankOf(q.id)]++);
  return {total: qs.length, c};
}
function distBar(c, total){
  const cols = ["var(--r0)","var(--r1)","var(--r2)","var(--r3)"];
  return `<div class="dist" aria-hidden="true">${c.map((n,i)=> n?`<span style="width:${n/total*100}%;background:${cols[i]}"></span>`:"").join("")}</div>`;
}

/* =====================================================================
   画面：出題設定
   ===================================================================== */
function renderSetup(){
  const items = GENRES.map((g,i)=>{
    const {total,c} = genreCounts(i);
    return `<li>
      <input type="checkbox" id="g${i}" ${setup.genres[i]?"checked":""} data-g="${i}">
      <label for="g${i}" class="gname"><span class="num">${g.no}</span>${esc(g.name)}</label>
      ${distBar(c,total)}
      <div class="gmeta">${total}問　コンボ ${c[3]}　残り ${total-c[3]}</div>
    </li>`;
  }).join("");
  const sel = Q.filter(q=>setup.genres[q.g]);
  const n = setup.pattern==="all" ? sel.length : sel.filter(q=>rankOf(q.id)<3).length;
  $app.innerHTML = `
  <section class="panel">
    <h2>ジャンル</h2>
    <div class="row"><button class="btn small" id="allOn">すべて選ぶ</button><button class="btn small" id="allOff">すべて外す</button></div>
    <ul class="genres section">${items}</ul>
    <div class="legend">${RANKS.map((r,i)=>`<span><i style="background:var(--r${i})"></i>${r}</span>`).join("")}</div>
  </section>
  <section class="panel section">
    <h2>出題パターン</h2>
    <div class="seg" role="radiogroup" aria-label="出題パターン">
      <label><input type="radio" name="pat" value="nocombo" ${setup.pattern==="nocombo"?"checked":""}>コンボを除く</label>
      <label><input type="radio" name="pat" value="all" ${setup.pattern==="all"?"checked":""}>全て</label>
    </div>
    <p class="muted">正解が3回続くとコンボ。1回でも間違えるとミスに戻ります。選択肢の並びは毎回入れ替わります。</p>
    <div class="row section">
      <button class="btn primary" id="start" ${n?"":"disabled"}>${n}問を解く</button>
      ${n===0 && sel.length ? `<span class="muted">選んだジャンルはすべてコンボです</span>` : ""}
    </div>
  </section>`;
  $app.querySelectorAll("input[type=checkbox]").forEach(el=>el.onchange=()=>{ setup.genres[+el.dataset.g]=el.checked; renderSetup(); });
  $app.querySelectorAll("input[name=pat]").forEach(el=>el.onchange=()=>{ setup.pattern=el.value; renderSetup(); });
  document.getElementById("allOn").onclick = ()=>{ setup.genres=setup.genres.map(()=>true); renderSetup(); };
  document.getElementById("allOff").onclick = ()=>{ setup.genres=setup.genres.map(()=>false); renderSetup(); };
  document.getElementById("start").onclick = startSession;
}

function startSession(){
  let qs = Q.filter(q=>setup.genres[q.g]);
  if (setup.pattern==="nocombo") qs = qs.filter(q=>rankOf(q.id)<3);
  if (!qs.length) return;
  session = {queue: shuffle(qs), i:0, correct:0, missed:[], answered:false, order:null, picked:null};
  view = "quiz"; render();
}

/* =====================================================================
   画面：出題
   ===================================================================== */
function meter(s){
  const cols = ["var(--r0)","var(--r1)","var(--r2)","var(--r3)"];
  return `<span class="meter" style="color:${cols[s]}"><span class="bars">${[1,2,3].map(k=>`<b style="${k<=s?`background:${cols[s]}`:""}"></b>`).join("")}</span>${RANKS[s]}</span>`;
}

function renderQuiz(){
  const q = session.queue[session.i];
  if (!session.order) session.order = shuffle([0,1,2,3]);
  const opts = [q.c, ...q.w];
  const g = GENRES[q.g];
  const total = session.queue.length;
  const r = rankOf(q.id);
  const optHtml = session.order.map((oi,pos)=>{
    let cls = "opt";
    if (session.answered){
      if (oi===0) cls += " correct";
      else if (pos===session.picked) cls += " wrong";
    }
    return `<li><button class="${cls}" data-pos="${pos}" ${session.answered?"disabled":""}><span class="k">${pos+1}</span><span>${fmt(opts[oi])}</span></button></li>`;
  }).join("");

  let fb = "";
  if (session.answered){
    const ok = session.order[session.picked]===0;
    const before = session.before, after = rankOf(q.id);
    fb = `<div class="feedback ${ok?"":"ng"}">
      <p class="verdict">${ok?"正解":"不正解"}</p>
      <p class="rankmove">${RANKS[before]} から ${RANKS[after]} へ</p>
      <p class="expl">${fmt(q.e)}</p>
      <p class="ref">参照：<code>${esc(q.r)}</code></p>
    </div>`;
  }

  $app.innerHTML = `
  <section class="panel">
    <div class="qhead"><span>${session.i+1} / ${total}　${g.no} ${esc(g.name)}</span>${meter(session.answered?rankOf(q.id):r)}</div>
    <div class="progress"><div style="width:${(session.i+(session.answered?1:0))/total*100}%"></div></div>
    <p class="qtext">${fmt(q.q)}</p>
    <ul class="opts">${optHtml}</ul>
    ${fb}
    <div class="actions">
      <button class="btn small" id="quit">中断して設定へ戻る</button>
      ${session.answered?`<button class="btn primary" id="next">${session.i+1<total?"次の問題":"結果を見る"}</button>`:""}
    </div>
  </section>`;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.pos));
  document.getElementById("quit").onclick = ()=>{ session=null; view="setup"; render(); };
  const nx = document.getElementById("next");
  if (nx){ nx.onclick = next; nx.focus(); }
}

async function answer(pos){
  if (session.answered) return;
  const q = session.queue[session.i];
  const r = rec(q.id);
  session.before = r.s;
  const ok = session.order[pos]===0;
  r.n++; r.t = Date.now();
  if (ok){ r.c++; r.s = Math.min(3, r.s+1); session.correct++; }
  else { r.w++; r.s = 0; session.missed.push(q); }
  session.answered = true; session.picked = pos;
  renderQuiz();
  const saved = await Store.save(DATA);
  if (!saved) toast("記録を保存できませんでした。学習成績から JSON を書き出してください");
}

function next(){
  session.i++; session.answered=false; session.order=null; session.picked=null;
  if (session.i >= session.queue.length){ view="result"; }
  render();
}

/* =====================================================================
   画面：結果
   ===================================================================== */
function renderResult(){
  const total = session.queue.length;
  const sel = Q.filter(q=>setup.genres[q.g]);
  const remain = sel.filter(q=>rankOf(q.id)<3).length;
  const complete = remain===0;
  $app.innerHTML = `
  <section class="panel">
    ${complete?`<div class="complete"><p class="big">コンプリート</p><p>選んだジャンル ${sel.length}問がすべてコンボになりました。</p></div>`:""}
    <h2>今回の結果</h2>
    <p class="score">${session.correct} / ${total}</p>
    <p class="muted">選んだジャンルでコンボ以外の問題：残り ${remain}問</p>
    ${session.missed.length?`<h2 class="section">落とした問題</h2><ol class="missed">${session.missed.map(q=>`<li><code>${q.id}</code> ${fmt(q.q.split("\n")[0])}</li>`).join("")}</ol>`:""}
    <div class="actions">
      <button class="btn" id="back">設定へ戻る</button>
      ${remain?`<button class="btn primary" id="again">残り ${remain}問を解く（コンボを除く）</button>`:""}
    </div>
  </section>`;
  document.getElementById("back").onclick = ()=>{ session=null; view="setup"; render(); };
  const ag = document.getElementById("again");
  if (ag) ag.onclick = ()=>{ setup.pattern="nocombo"; startSession(); };
}

/* =====================================================================
   画面：学習成績
   ===================================================================== */
function renderStats(){
  let T = {total:0,c:[0,0,0,0],w:0,n:0,ok:0};
  const rows = GENRES.map((g,i)=>{
    const qs = Q.filter(q=>q.g===i);
    const c=[0,0,0,0]; let w=0,n=0,ok=0;
    qs.forEach(q=>{ const r=DATA.records[q.id]; c[r?r.s:0]++; if(r){w+=r.w;n+=r.n;ok+=r.c;} });
    T.total+=qs.length; c.forEach((v,k)=>T.c[k]+=v); T.w+=w; T.n+=n; T.ok+=ok;
    return `<tr><td>${g.no} ${esc(g.name)}</td><td>${qs.length}</td><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>${w}</td><td>${n?Math.round(ok/n*100)+"%":"-"}</td></tr>`;
  }).join("");
  $app.innerHTML = `
  <section class="panel">
    <h2>ジャンル別</h2>
    <div class="tscroll"><table>
      <thead><tr><th>ジャンル</th><th>問題</th><th>ミス</th><th>ジャブ</th><th>ヒット</th><th>コンボ</th><th>累計誤答</th><th>正答率</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>合計</td><td>${T.total}</td><td>${T.c[0]}</td><td>${T.c[1]}</td><td>${T.c[2]}</td><td>${T.c[3]}</td><td>${T.w}</td><td>${T.n?Math.round(T.ok/T.n*100)+"%":"-"}</td></tr></tfoot>
    </table></div>
    <p class="muted">累計回答 ${T.n}回。ミスには未回答の問題も含みます。</p>
  </section>
  <section class="panel section">
    <h2>履歴の書き出しと読み込み</h2>
    <p class="muted">履歴はこのブラウザにしか残りません。区切りごとに書き出して保管してください。</p>
    <div class="row">
      <button class="btn primary" id="exp">JSON を書き出す</button>
      <label class="btn" for="imp" style="display:inline-block">JSON を読み込む</label>
      <input type="file" id="imp" accept="application/json,.json" class="hidden">
      <button class="btn" id="reset">履歴を消去する</button>
    </div>
    <div id="expArea" class="section hidden">
      <p class="muted">ダウンロードが始まらない場合は、下の内容をコピーして保存してください。</p>
      <textarea id="expText" readonly></textarea>
    </div>
  </section>`;
  document.getElementById("exp").onclick = exportJson;
  document.getElementById("imp").onchange = importJson;
  document.getElementById("reset").onclick = async ()=>{
    if (!confirm("すべての回答履歴を消去します。書き出していない履歴は戻せません。消去しますか？")) return;
    DATA = {version:1, records:{}}; await Store.save(DATA); toast("履歴を消去しました"); renderStats();
  };
}

function exportJson(){
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const payload = JSON.stringify({app:"sre-fastapi-quiz", exported_at:d.toISOString(), ...DATA}, null, 2);
  const area = document.getElementById("expArea"), ta = document.getElementById("expText");
  ta.value = payload; area.classList.remove("hidden");
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload],{type:"application/json"}));
    a.download = `fastapi-quiz-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    toast("JSON を書き出しました");
  }catch(e){ toast("下の内容をコピーして保存してください"); }
}

function importJson(ev){
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = async ()=>{
    try{
      const d = JSON.parse(rd.result);
      if (!d || typeof d.records!=="object") throw new Error("records がありません");
      const ids = new Set(Q.map(q=>q.id)); const records = {};
      for (const [k,v] of Object.entries(d.records)){
        if (!ids.has(k) || typeof v!=="object") continue;
        records[k] = {s:Math.max(0,Math.min(3,+v.s||0)), n:+v.n||0, c:+v.c||0, w:+v.w||0, t:+v.t||0};
      }
      if (!confirm(`${Object.keys(records).length}問ぶんの履歴で、現在の履歴を置き換えます。よろしいですか？`)) return;
      DATA = {version:1, records}; await Store.save(DATA); toast("履歴を読み込みました"); renderStats();
    }catch(e){ toast("読み込めませんでした。この演習で書き出した JSON を選んでください"); }
  };
  rd.readAsText(f);
}

/* =====================================================================
   切り替えとキー操作
   ===================================================================== */
function render(){
  const inStats = view==="stats";
  document.getElementById("navQuiz").setAttribute("aria-current", inStats?"false":"page");
  document.getElementById("navStats").setAttribute("aria-current", inStats?"page":"false");
  if (view==="setup") renderSetup();
  else if (view==="quiz") renderQuiz();
  else if (view==="result") renderResult();
  else renderStats();
}
document.getElementById("navQuiz").onclick = ()=>{ view = session ? (session.i>=session.queue.length?"result":"quiz") : "setup"; render(); };
document.getElementById("navStats").onclick = ()=>{ view="stats"; render(); };
document.addEventListener("keydown", e=>{
  if (view!=="quiz" || !session || e.target.tagName==="TEXTAREA") return;
  if (!session.answered && ["1","2","3","4"].includes(e.key)) { answer(+e.key-1); }
  else if (session.answered && e.key==="Enter" && document.activeElement?.id!=="next") { e.preventDefault(); next(); }
});

(async ()=>{
  const d = await Store.load();
  if (d && d.records) DATA = {version:1, records:d.records};
  render();
})();
</script>
</body>
</html>
