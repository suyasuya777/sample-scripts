worker_processes 1;
events { worker_connections 1024; }

http {
    # ALB アクセスログに寄せた形式。
    # 末尾の request_time / upstream_response_time は ALB の
    # request_processing_time + target_processing_time + response_processing_time に相当する位置づけ。
    log_format alb_like '$remote_addr - [$time_local] "$request" '
                        'status=$status upstream_status=$upstream_status '
                        'req_time=$request_time upstream_time=$upstream_response_time '
                        'xff="$http_x_forwarded_for" trace="$http_x_amzn_trace_id" '
                        'req_id=$request_id';
    access_log /dev/stdout alb_like;
    error_log  /dev/stderr warn;

    # ALB のアイドルタイムアウト既定値（60秒）に合わせている。
    # アプリ側（uvicorn）の Keep-Alive がこれより短いと 502 が出る、の再現に使う値。
    keepalive_timeout 60s;

    upstream app {
        server app:8000;
        # 上流への Keep-Alive。ここを 0 にすると毎回張り直しになる
        keepalive 32;
    }

    server {
        listen 80;

        # ヘルスチェック（ALB のターゲットヘルスチェック相当）
        location = /lb-health {
            proxy_pass http://app/readyz;
            access_log off;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # ALB と同じく、受け取った XFF の末尾に接続元を足して転送する。
            # curl -H 'X-Forwarded-For: 203.0.113.9' で複数値のケースを作れる。
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Host $host;

            # X-Amzn-Trace-Id の模擬。ALB は未付与なら自分で採番する
            proxy_set_header X-Amzn-Trace-Id "Root=1-00000000-$request_id";

            # ALB のターゲット応答待ち（既定 60秒）の代役
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
