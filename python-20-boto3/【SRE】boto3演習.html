<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRE boto3 演習</title>
<style>
:root{--ink:#191d24;--sub:#5d6670;--paper:#fcfbf8;--shell:#1c242f;
--line:#ded9ce;--line2:#eeeae1;
--miss:#b0332a;--jab:#3d6aa6;--hit:#12796a;--combo:#a97a12;
--act:#12796a;--act-d:#0d5c50;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--shell);color:var(--ink);
font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{padding:20px 18px 56px}
.bar{background:var(--shell);color:#eef1f4;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.bar .back{background:none;border:1px solid #47535f;border-radius:3px;padding:4px 11px;font-size:13px;color:#cdd5dc}
.bar .back:hover{background:#2b3642}
.bar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
.hero{padding:44px 18px 28px;background:var(--shell);color:#f2f4f6}
.hero .k{font-size:13px;color:#8fa0ae;margin:0 0 10px}
.hero h1{margin:0;font-size:27px;line-height:1.35;font-weight:700}
.hero p{margin:14px 0 0;color:#a9b6c1;font-size:14px}
.menu{display:grid;gap:14px;padding:24px 18px 40px}
.menu button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--act);border-radius:3px;padding:20px}
.menu button:hover{border-color:var(--act);background:#f4faf8}
.menu b{display:block;font-size:19px;font-weight:700}
.menu span{display:block;color:var(--sub);font-size:13.5px;margin-top:4px}
h2.sec{font-size:13px;color:var(--sub);margin:26px 0 10px;font-weight:600}
h2.sec:first-child{margin-top:4px}
.glist{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.glist button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:12px 14px}
.glist button:last-child{border-bottom:0}
.glist button:hover{background:#f2f7f6}
.glist button[aria-pressed="true"]{background:#e7f2f0;box-shadow:inset 4px 0 0 var(--act)}
.glist .nm{flex:1;font-size:15px}
.glist .ct{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:11px 8px;font-size:14.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--act);color:#fff;font-weight:600}
.hint{font-size:13px;color:var(--sub);margin:8px 2px 0}
.start{margin-top:26px;width:100%;background:var(--act);color:#fff;border:0;border-radius:3px;padding:15px;font-size:16.5px;font-weight:700}
.start:hover{background:var(--act-d)}
.start:disabled{background:#b8bfc4;cursor:not-allowed}
.qhead{background:#fff;border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.qhead .g{font-size:14px;font-weight:700}
.qhead .n{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.qhead .n b{color:var(--ink);font-size:16px}
.tal{display:flex;width:100%;margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);gap:6px}
.tal span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:2px;background:#f7f5f0;border:1px solid var(--line2)}
.tal em{font-style:normal;font-size:11px;color:var(--sub);letter-spacing:.03em}
.tal b{font-size:16px;font-variant-numeric:tabular-nums;line-height:1.2}
.tal .t-miss b{color:var(--miss)}.tal .t-jab b{color:var(--jab)}
.tal .t-hit b{color:var(--hit)}.tal .t-combo b{color:var(--combo)}
.meta{margin:22px 2px 8px;font-size:12.5px;color:var(--sub);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:2px;color:#fff;letter-spacing:.04em}
.c-miss{background:var(--miss)}.c-jab{background:var(--jab)}
.c-hit{background:var(--hit)}.c-combo{background:var(--combo)}
.stem{font-size:16.5px;line-height:1.9}
.choices{display:grid;gap:9px;margin-top:20px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:3px;padding:13px 14px;font-size:15.5px;line-height:1.65}
.ch:hover:not(:disabled){border-color:var(--act);background:#f4faf8}
.ch:disabled{cursor:default;opacity:.72}
.ch .kana{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--sub);background:#f7f5f0}
.ch.ok{border-color:var(--hit);background:#e9f5f2;opacity:1}
.ch.ok .kana{background:var(--hit);border-color:var(--hit);color:#fff}
.ch.ng{border-color:var(--miss);background:#fbeceb;opacity:1}
.ch.ng .kana{background:var(--miss);border-color:var(--miss);color:#fff}
.verdict{margin-top:24px;border:1px solid var(--line);border-radius:3px;background:#fff;border-left-width:5px;padding:16px}
.verdict.ok{border-left-color:var(--hit)}
.verdict.ng{border-left-color:var(--miss)}
.verdict .v{font-size:18px;font-weight:700;margin:0 0 6px}
.verdict.ok .v{color:var(--hit)}
.verdict.ng .v{color:var(--miss)}
.verdict .rk{font-size:13px;color:var(--sub);margin:0 0 14px}
.verdict h3{font-size:15px;margin:14px 0 6px}
.exp{font-size:15px;line-height:1.9;margin:0}
.next{margin-top:22px;width:100%;background:var(--act);color:#fff;border:0;border-radius:3px;padding:14px;font-size:16px;font-weight:700}
.next:hover{background:var(--act-d)}
table.score{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.score th,table.score td{border:1px solid var(--line);padding:8px 6px;text-align:right;font-variant-numeric:tabular-nums}
table.score th:first-child,table.score td:first-child{text-align:left}
table.score thead th{background:var(--shell);color:#fff;font-size:12.5px;font-weight:600}
table.score tbody tr:nth-child(even){background:#f7f9fb}
table.score tfoot td{background:#eef3f7;font-weight:700}
.s-miss{color:var(--miss)}.s-jab{color:var(--jab)}
.s-hit{color:var(--hit)}.s-combo{color:var(--combo)}
.tools{margin-top:26px;border:1px solid var(--line);border-radius:3px;background:#fff;padding:16px}
.tools h3{font-size:14px;margin:0 0 10px}
select{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:3px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px 14px;font-size:14px}
.btn:hover{background:#f2f7f6}
.btn.danger{border-color:var(--miss);color:var(--miss)}
.btn.danger:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.note{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.7}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:26px;font-weight:700;color:var(--combo)}
</style></head>
<body><div id="app"></div>
<script>
const D = {"groups":[{"id":"k1","name":"第1部 1. Session・client・resource"},{"id":"k2","name":"第1部 2. レスポンス構造とフィルタ"},{"id":"k3","name":"第1部 3. paginator と日時の扱い"},{"id":"k4","name":"第1部 4. waiter"},{"id":"k5","name":"第1部 5. エラーハンドリングとリトライ"},{"id":"e1","name":"第2部 1. EC2"},{"id":"e2","name":"第2部 2. ECS"},{"id":"e3","name":"第2部 3. ELB・Auto Scaling"},{"id":"e4","name":"第2部 4. S3"},{"id":"e5","name":"第2部 5. IAM"},{"id":"e6","name":"第2部 6. パラメータ・シークレット管理"},{"id":"e7","name":"第2部 7. CloudWatch"},{"id":"e8","name":"第2部 8. CloudWatch Logs"},{"id":"e9","name":"第2部 9. Athena"},{"id":"e10","name":"第2部 10. Lambda"},{"id":"e11","name":"第2部 11. SQS・SNS"},{"id":"e12","name":"第2部 12. SES"},{"id":"e13","name":"第2部 13. RDS・Aurora"},{"id":"e14","name":"第2部 14. VPC・EKS"},{"id":"e15","name":"第2部 15. SSM 運用操作"},{"id":"e16","name":"第2部 16. Cost Explorer"},{"id":"e17","name":"第2部 17. STS・クロスアカウント"}],"qs":[{"i":"k1#1-1","g":"k1","n":"1-1","t":"client と resource","s":"boto3.client() と boto3.resource() の違いとして正しいものはどれか。","c":["client はAWS APIと1対1で対応する低レベルインタフェースで、resource はオブジェクト指向の高レベル抽象である","client は同期、resource は非同期で動作する","resource のほうが新しいAPIに早く対応する","resource はすべてのAWSサービスで利用できる"],"a":"ア","et":"迷ったら client を選ぶ","eb":"client は AWS の API 操作と1対1に対応し、レスポンスも API が返す生のdictである。resource は Bucket や Instance といったオブジェクトとして扱える高レベル抽象だが、対応しているのは s3・ec2・dynamodb・sqs・sns・iam など一部のサービスに限られ、新しいAPIへの追随も client のほうが早い。サンプル集が全編 client で書かれているのはこのためである。レスポンス構造をそのまま読める client に慣れておくと、AWS CLI やドキュメントとの対応も取りやすい。"},{"i":"k1#1-2","g":"k1","n":"1-2","t":"認証情報の探索順序","s":"boto3 が認証情報を探す順序として、最も早く評価されるものはどれか。","c":["EC2 インスタンスメタデータ（IMDS）","client() や Session() に直接渡された引数","環境変数（AWS_ACCESS_KEY_ID 等）","~/.aws/credentials の共有認証情報ファイル"],"a":"イ","et":"明示指定が最優先、メタデータが最後","eb":"評価順は、コードで明示的に渡した引数、環境変数、~/.aws/credentials、~/.aws/config、ECSのコンテナ認証情報、EC2インスタンスメタデータ（IMDS）の順である。ローカルでは動くのに ECS 上で権限エラーになる、あるいはその逆という現象は、どの段階の認証情報が使われているかが環境ごとに違うことが原因になる。切り分けの第一手は get_caller_identity で実効アイデンティティを確認することである。"},{"i":"k1#1-3","g":"k1","n":"1-3","t":"リージョンの決まり方","s":"client にリージョンを指定しなかった場合、boto3 がリージョンを決める方法として正しいものはどれか。","c":["リージョン未指定の場合は必ず例外になる","常に us-east-1 が使われる","環境変数 AWS_DEFAULT_REGION / AWS_REGION や ~/.aws/config のプロファイル設定から決まる","実行中のインスタンスのAZから自動判定される"],"a":"ウ","et":"未設定なら NoRegionError になる","eb":"client(region_name=...) の明示指定が最優先で、なければ環境変数 AWS_DEFAULT_REGION（または AWS_REGION）、次に ~/.aws/config のプロファイル設定が使われる。どこにも設定がなければ NoRegionError が送出され、暗黙に us-east-1 になるわけではない。学習環境では export AWS_DEFAULT_REGION=ap-northeast-1 を先に入れておくと、リージョン指定漏れによる想定外のリージョンへの作成を防げる。"},{"i":"k1#1-4","g":"k1","n":"1-4","t":"グローバルサービスのエンドポイント","s":"Cost Explorer のクライアントを boto3.client('ce', region_name='us-east-1') と固定している理由はどれか。","c":["課金データが us-east-1 のリソースしか含まないため","東京リージョンでは Cost Explorer が利用できないため","us-east-1 のほうが API 料金が安いため","Cost Explorer のAPIエンドポイントが us-east-1 にしか存在しないため"],"a":"エ","et":"グローバルサービスはエンドポイントが固定","eb":"Cost Explorer はグローバルサービスで、APIエンドポイントが us-east-1 に固定されている。取得できるコストは全リージョン分であり、リージョンを絞っているわけではない。同様に IAM、STS（グローバルエンドポイント）、CloudFront、Route 53 もグローバル扱いで、リージョン指定の意味が他サービスと異なる。ap-northeast-1 を指定すると EndpointConnectionError になるため、この固定は必須である。"},{"i":"k1#1-5","g":"k1","n":"1-5","t":"リージョンごとの client 生成","s":"全リージョンの EC2 インスタンスを棚卸しするスクリプトが、リージョンごとに client を作り直している理由はどれか。","c":["EC2 の API エンドポイントがリージョンごとに分かれており、1つの client は1リージョンしか見えないため","paginator がリージョンをまたげないため","認証情報がリージョンごとに異なるため","client が1つあたり1接続しか張れないため"],"a":"ア","et":"リージョンサービスは横断できない","eb":"EC2 のようなリージョナルサービスは、エンドポイント自体がリージョンごとに分かれている。したがって describe_instances は接続先リージョンの結果しか返さず、全リージョン棚卸しには describe_regions で有効リージョンを取得し、それぞれに client を作って回すという二段構えが必要になる。この形はサンプル集の複数スクリプトに共通して現れる基本パターンである。"},{"i":"k1#1-6","g":"k1","n":"1-6","t":"自アカウントIDの取得","s":"スクリプト内で自分のAWSアカウントIDを動的に取得する方法はどれか。","c":["環境変数 AWS_ACCOUNT_ID を読む","boto3.client('sts').get_caller_identity()['Account']","boto3.client('iam').get_account_id()","boto3.Session().account_id"],"a":"イ","et":"棚卸しスクリプトの定番の1行","eb":"get_caller_identity は Account、Arn、UserId の3つを返し、追加の権限をほぼ必要とせずに呼べる。自社AMIやスナップショットを Owners=[account_id] で絞り込む場面、IAMロールの信頼先が外部アカウントかを判定する場面などで、アカウントIDをハードコードせずに済ませられる。assume_role の前後で呼べば、どのアカウントの権限で動いているかの切り分けにもそのまま使える。"},{"i":"k1#1-7","g":"k1","n":"1-7","t":"同一サービスの複数API世代","s":"SES のサプレッションリスト操作で boto3.client('sesv2') を使っている理由として正しいものはどれか。","c":["sesv2 は東京リージョンでのみ利用できるため","sesv2 のほうがレスポンスが速いため","サプレッションリスト関連のAPIが SESv2 にのみ存在し、旧 ses クライアントからは呼べないため","ses クライアントは非推奨で全機能が廃止されたため"],"a":"ウ","et":"サービス名が違えば別クライアント","eb":"boto3 では ses と sesv2 が別のクライアントとして提供され、利用できる操作が異なる。送信統計や検証ステータスは ses、アカウントレベルのサプレッションリストは sesv2 というように、同じ SES を扱いながら呼び分けが必要になる。1つのスクリプトで両方の client を作ることもある。同様に elb（Classic）と elbv2（ALB/NLB）、logs と logs の Insights のように、名前が近い別クライアントは取り違えやすい。"},{"i":"k2#2-1","g":"k2","n":"2-1","t":"Reservations の二段ネスト","s":"describe_instances のレスポンスが Reservations → Instances という二段構造になっている理由はどれか。","c":["1回の起動リクエスト（予約）単位でインスタンスがまとめられているため","インスタンスタイプごとに分類されているため","ページングの単位が Reservations であるため","アベイラビリティゾーンごとにグループ化されているため"],"a":"ア","et":"一度に複数台起動した単位がReservation","eb":"Reservation は EC2 の起動リクエスト単位である。run_instances で一度に3台起動すれば1つの Reservation に3つの Instances が入り、1台ずつ3回起動すれば Reservation が3つになる。したがってインスタンスを列挙するには for reservation in page['Reservations'] → for i in reservation['Instances'] と二重ループが必要で、これを忘れると一部のインスタンスを取りこぼす。ページングの単位ではない点にも注意する。"},{"i":"k2#2-2","g":"k2","n":"2-2","t":"Tags の取り出し","s":"EC2 のレスポンスから Name タグの値を取り出すコードとして適切なものはどれか。","c":["i['Tags']['Name']","next((t['Value'] for t in i.get('Tags', []) if t['Key'] == 'Name'), '-')","i['Name']","i['Tags'].get('Name', '-')"],"a":"イ","et":"Tagsはdictではなくlist","eb":"AWS のレスポンスでタグは {'Key': ..., 'Value': ...} のリストとして返るため、辞書アクセスはできず走査して探す必要がある。さらにタグが1つも付いていないリソースには Tags キー自体が存在しないので、i.get('Tags', []) と既定値を置かないと KeyError になる。見つからない場合の既定値まで含めて next(..., '-') で書くのが定型である。boto3 のレスポンスは「キーがないこともある」が基本であり、[] より .get() を優先する姿勢がそのまま安全性につながる。"},{"i":"k2#2-3","g":"k2","n":"2-3","t":"Filters の書式","s":"describe_regions で「オプトイン不要またはオプトイン済み」のリージョンだけを取得する Filters の書き方として正しいものはどれか。","c":["Filter='opt-in-status in (opted-in)'","Filters={'opt-in-status': ['opt-in-not-required', 'opted-in']}","Filters=[{'Name': 'opt-in-status', 'Values': ['opt-in-not-required', 'opted-in']}]","Filters=['opt-in-status=opted-in']"],"a":"ウ","et":"Name と Values のdictのリスト","eb":"EC2 系の Filters は [{'Name': 条件名, 'Values': [値, ...]}] という形のリストで指定し、Values は必ずリストにする。複数の要素を並べれば AND 条件、1つの Values 内に複数値を書けば OR 条件として働く。数値やbool値も文字列で渡す必要がある点（'Values': ['true']）はつまずきやすい。サーバ側で絞り込むため、全件取得してからPythonでフィルタするより転送量とAPI負荷の両面で有利になる。"},{"i":"k2#2-4","g":"k2","n":"2-4","t":"list_* と describe_* の二段構え","s":"ECS や ELB で list_services / list_clusters と describe_services を組み合わせる理由はどれか。","c":["list_* にはページングがないため","describe_* は ARN を受け付けないため","list_* は読み取り権限が不要なため","list_* は ARN しか返さず、名前・状態・カウントなどの詳細は describe_* でしか取得できないため"],"a":"エ","et":"ARNを集めてから詳細を引く","eb":"list_clusters や list_services が返すのは ARN の配列だけで、desiredCount や status といった中身は含まれない。そのため ARN を集めてから describe_* に渡して詳細を取得する二段構えになる。この形は ECS に限らず、ELBv2、Lambda のバージョン、SES の検証ステータスなど多くのサービスで共通する。describe_* には一度に渡せる件数の上限があることが多く、分割処理とセットで覚える必要がある。"},{"i":"k2#2-5","g":"k2","n":"2-5","t":"IpPermissions の入れ子","s":"セキュリティグループのインバウンドルールで、0.0.0.0/0 の許可を検出するために参照すべき構造はどれか。","c":["IpPermissions → IpRanges → CidrIp","IpPermissionsEgress → IpRanges → CidrIp","GroupRules → Cidr","IpPermissions → UserIdGroupPairs → GroupId"],"a":"ア","et":"CIDR許可とSG参照許可は別の配列","eb":"1つのルール（IpPermissions の要素）の中で、CIDR による許可は IpRanges の CidrIp、IPv6 は Ipv6Ranges の CidrIpv6、別のセキュリティグループを送信元にした許可は UserIdGroupPairs、プレフィックスリストは PrefixListIds と、許可の種類ごとに別の配列に入る。全開放を検出するときに IpRanges しか見ないと IPv6 の ::/0 を見落とす。また IpPermissions はインバウンド、IpPermissionsEgress はアウトバウンドで別のキーである。"},{"i":"k3#3-1","g":"k3","n":"3-1","t":"1000件の壁","s":"list_objects_v2 を paginator なしで1回だけ呼んだとき、1200個のオブジェクトが入ったバケットで起きることはどれか。","c":["1000件で打ち切られ、IsTruncated が true になる","エラーになる","オブジェクトサイズの合計が1000MBを超えた時点で打ち切られる","1200件すべてが返る"],"a":"ア","et":"エラーにならず静かに欠ける","eb":"S3 の list_objects_v2 は1回の応答で最大1000件しか返さず、続きがある場合は IsTruncated が true、NextContinuationToken に続きの位置が入る。エラーにならず正常終了するため、件数の少ない開発環境では気づかず、本番で初めて集計が合わないという形で顕在化する。paginator を使えばこのトークンの引き回しを自動でやってくれる。上限値はAPIごとに異なる（IAM の list_users は100件など）ため、件数上限は暗記せず常に paginator を使うのが安全である。"},{"i":"k3#3-2","g":"k3","n":"3-2","t":"paginator の型","s":"paginator を使って全件取得する定型として正しいものはどれか。","c":["for page in client.paginate('list_objects_v2', Bucket=B):","paginator = client.get_paginator('list_objects_v2') のあと for page in paginator.paginate(Bucket=B):","client.list_objects_v2(Bucket=B, Paginate=True)","for page in client.get_paginator('list_objects_v2')(Bucket=B):"],"a":"イ","et":"get_paginator してから paginate","eb":"get_paginator に渡すのは API のメソッド名（スネークケース）で、返ってきた paginator の paginate() に元のAPIと同じ引数を渡す。paginate() が返すのはページのイテレータであり、各ページは元のAPIのレスポンスと同じ構造をしている。つまりページの中身の取り出し方は paginator を使わない場合と変わらない。取得件数を絞りたい場合は PaginationConfig={'MaxItems': N, 'PageSize': M} を渡せる。"},{"i":"k3#3-3","g":"k3","n":"3-3","t":"空のレスポンス","s":"オブジェクトが1つもないバケットに対して list_objects_v2 のページを処理するとき、page['Contents'] と書くと起きることはどれか。","c":["ページ自体が生成されない","空リストが返る","Contents キー自体が存在せず KeyError になる","None が返る"],"a":"ウ","et":"件数ゼロはキーごと消える","eb":"AWS のレスポンスは、該当する要素がゼロ件のときにキー自体を含めないことが多い。したがって page.get('Contents', []) と書く必要がある。同じパターンは SQS の list_queues の QueueUrls、EC2 の Tags、ECS の taskArns など随所にある。逆に Reservations のようにゼロ件でも空リストで返るキーもあり、規則性は薄い。実装時は .get() に既定値を添えるのを既定の書き方にしておくと、空の環境で落ちる事故を防げる。"},{"i":"k3#3-4","g":"k3","n":"3-4","t":"paginator がない API","s":"すべての一覧系APIに paginator があるわけではない。paginator が存在しない API に対して全件取得する方法として正しいものはどれか。","c":["client.can_paginate() が False の場合は取得を諦める","リージョンを分けて呼び出すことで件数を減らす","paginator がない API は必ず全件を1回で返すので、そのまま呼べばよい","レスポンスの NextToken / Marker を次の呼び出しに渡すループを自分で書く"],"a":"エ","et":"can_paginate で有無を確認できる","eb":"paginator は botocore が定義を持っているAPIにだけ用意されており、ない場合はレスポンスの NextToken（サービスによっては Marker、NextMarker）を次の呼び出しに渡すループを自分で書く。paginator の有無は client.can_paginate('メソッド名') で確認できる。サンプル集でも SQS の list_queues や SES の list_identities のように paginator を使っていない箇所があるが、これらは件数が増えれば取りこぼす可能性があるという読み方をすべきである。"},{"i":"k3#3-5","g":"k3","n":"3-5","t":"日時が文字列で返るケース","s":"describe_images で返る CreationDate の扱いとして正しいものはどれか。","c":["ISO8601 形式の文字列なので、datetime に変換してから比較する必要がある","エポック秒の整数である","ローカルタイムゾーンの datetime である","datetime オブジェクトなのでそのまま比較できる"],"a":"ア","et":"APIによって型が揃っていない","eb":"boto3 の多くのAPIは日時を tz-aware な datetime で返すが、describe_images の CreationDate は例外的に文字列（'2024-01-01T00:00:00.000Z'）で返る。そのため fromisoformat に渡す前に末尾の Z を +00:00 へ置き換える処理が必要になる。一方で describe_snapshots の StartTime や IAM の CreateDate は datetime である。型が揃っていないので、新しいAPIを使うときはまず1件 print して実際の型を確かめるのが確実である。"},{"i":"k3#3-6","g":"k3","n":"3-6","t":"naive datetime との比較","s":"API が返した日時と datetime.now() を直接比較すると TypeError になる理由はどれか。","c":["API の日時が文字列だから","API の日時がタイムゾーン付き（aware）で、datetime.now() がタイムゾーンなし（naive）だから","datetime 同士は減算できないから","タイムゾーンが JST と UTC で異なるから"],"a":"イ","et":"now(timezone.utc) を使う","eb":"Python では aware と naive の datetime を比較・減算できず TypeError になる。boto3 が返す日時は UTC の aware な datetime なので、比較相手も datetime.now(timezone.utc) にする。JST に直したいなら astimezone で変換する。「90日以上前のAMI」「90日間未使用のアクセスキー」といった判定は棚卸しスクリプトの定番であり、この比較でつまずくと最初の1行目から進めない。"},{"i":"k3#3-7","g":"k3","n":"3-7","t":"エポックの単位の違い","s":"CloudWatch Logs の filter_log_events と Logs Insights の start_query で、時刻指定の単位はそれぞれどうなっているか。","c":["どちらもエポック秒","どちらもエポックミリ秒","filter_log_events はエポックミリ秒、start_query はエポック秒","filter_log_events はエポック秒、start_query はエポックミリ秒"],"a":"ウ","et":"同じサービス内で単位が違う","eb":"filter_log_events の startTime / endTime と、返ってくるイベントの timestamp はエポックミリ秒である。一方 Logs Insights の start_query の startTime / endTime はエポック秒で指定する。同じ logs クライアント内で単位が食い違っており、ミリ秒のつもりで秒を渡すと1970年付近を検索してしまい「該当ログなし」という結果だけが返る。エラーにならないため、検索結果がゼロのときは真っ先に疑うべき箇所になる。"},{"i":"k4#4-1","g":"k4","n":"4-1","t":"waiter の役割","s":"waiter が行っていることの説明として正しいものはどれか。","c":["describe 系APIを一定間隔で呼び、目的の状態になるまでポーリングする","API 呼び出しを同期モードに切り替える","CloudWatch のイベントを購読する","AWS からの完了通知（プッシュ）を待ち受ける"],"a":"ア","et":"中身はポーリングのラッパー","eb":"waiter は describe 系APIを一定間隔で呼び、レスポンスが所定の条件を満たすまで待つポーリングのラッパーである。プッシュ通知ではないので、待っている間もAPI呼び出しは発生している。多くのAWS操作は API が成功を返した時点ではまだ完了しておらず、stop_instances が返っても数十秒は stopping のままである。この非同期性を吸収するのが waiter の役割であり、自分で while ループを書く手間と条件漏れを省ける。"},{"i":"k4#4-2","g":"k4","n":"4-2","t":"WaiterConfig","s":"WaiterConfig={'Delay': 15, 'MaxAttempts': 40} を指定したとき、待機の上限時間はおよそどれか。","c":["15分（900秒）","10分（600秒）","40分","40秒"],"a":"イ","et":"Delay × MaxAttempts が上限","eb":"Delay はポーリング間隔（秒）、MaxAttempts は最大試行回数であり、上限待機時間はおよそ両者の積になる。15×40 で約600秒である。既定値は waiter ごとに定義されており、instance_stopped や services_stable は Delay 15・MaxAttempts 40 が既定になっている。デプロイが既定の上限を超える環境では MaxAttempts を増やす必要があるが、無制限にはできないため、待ち時間そのものが長すぎないかを先に疑うべき場面も多い。"},{"i":"k4#4-3","g":"k4","n":"4-3","t":"waiter のタイムアウト","s":"waiter が MaxAttempts に達しても条件を満たさなかった場合の挙動はどれか。","c":["最後のレスポンスを返す","None を返して正常終了する","WaiterError 例外が送出される","無限に待ち続ける"],"a":"ウ","et":"戻り値ではなく例外で失敗を知る","eb":"待機が上限に達すると botocore.exceptions.WaiterError が送出される。waiter.wait() は成功時に戻り値を持たないため、成否は例外の有無でしか判別できない。したがって try / except WaiterError で囲まないと、スクリプトがその場で停止する。ここで重要なのは、例外が出た時点で操作そのものが失敗したとは限らないことで、単に想定より時間がかかっているだけの場合もある。例外を捕まえた後に describe で実際の状態を確認する流れにしておくと誤判定を避けられる。"},{"i":"k4#4-4","g":"k4","n":"4-4","t":"services_stable","s":"ECS の services_stable waiter が「安定」と判定する条件として正しいものはどれか。","c":["ALB のヘルスチェックがすべて healthy になったこと","タスク定義のリビジョンが更新されたこと","タスクが1つでも RUNNING になったこと","desiredCount と runningCount が一致し、進行中のデプロイが残っていないこと"],"a":"エ","et":"デプロイ完了の判定に使う","eb":"services_stable は、サービスの desiredCount と runningCount が一致し、deployments が1つだけ（進行中の入れ替えがない）状態になるまで待つ。forceNewDeployment や新リビジョンのデプロイ後にこれを通すことで、デプロイ完了を確実に検知できる。逆にヘルスチェックの結果そのものを直接見ているわけではないため、安定した後に別途ターゲットの healthy 状態を確認する意味はある。所要時間は minimumHealthyPercent と maximumPercent の設定に大きく左右される。"},{"i":"k4#4-5","g":"k4","n":"4-5","t":"waiter がない操作","s":"Aurora のフェイルオーバーで waiter を使わず、自分でポーリングして writer の入れ替わりを確認している理由として最も適切なものはどれか。","c":["確認したいのはクラスターの状態ではなく「writer が別インスタンスに替わったこと」であり、既存の waiter の条件では表せないため","waiter は書き込み系APIの後には使えないため","フェイルオーバーは同期APIであり待つ必要がないため","Aurora には waiter が一切用意されていないため"],"a":"ア","et":"待ちたい条件が waiter の条件と一致しない","eb":"フェイルオーバー直後はクラスターの Status が一瞬 available のままに見えることがあり、状態だけを見ていると切り替わる前に完了と判定してしまう。確認すべきは DBClusterMembers の IsClusterWriter が実行前と別のインスタンスになったことであり、これは既存の waiter の条件には含まれない。このように「用意された waiter の判定条件が自分の確認したいことと一致しない」場面では、describe を自分でポーリングして実行前後を比較する形に落とす。上限時間と打ち切り処理を必ず添えるのが前提になる。"},{"i":"k4#4-6","g":"k4","n":"4-6","t":"操作ごとの waiter 名","s":"Lambda の設定変更（update_function_configuration）の反映を待つ waiter はどれか。","c":["function_active","function_updated","function_exists","function_published"],"a":"イ","et":"設定変更にも反映待ちがある","eb":"Lambda の設定変更は即座には反映されず、LastUpdateStatus が InProgress の間は次の更新を受け付けずエラーになる。function_updated waiter はこの更新完了を待つ。関数の新規作成直後には function_active、存在確認には function_exists と、用途ごとに別の waiter が定義されている。連続して設定変更を行うスクリプトでは、間に waiter を挟まないと ResourceConflictException で失敗するため、書き込みを連ねる処理では待機の挿入が前提になる。"},{"i":"k5#5-1","g":"k5","n":"5-1","t":"ClientError の分岐","s":"AWS API のエラーコードで処理を分岐させるとき、参照すべき場所はどれか。","c":["e.response['Error']['Code']","e.args[0]","e.status_code","str(e) を正規表現で解析する"],"a":"ア","et":"Code と Message は別の場所","eb":"botocore.exceptions.ClientError の response には Error（Code と Message）、ResponseMetadata（HTTPStatusCode、RequestId）が入る。分岐に使うのは安定した識別子である Code で、AccessDenied、InvalidInstanceID.NotFound、ThrottlingException などの文字列が入る。Message は人間向けの説明文であり、文言が変わりうるため分岐条件にすべきではない。障害調査でAWSサポートに問い合わせる際は ResponseMetadata の RequestId を添えると特定が速い。"},{"i":"k5#5-2","g":"k5","n":"5-2","t":"サービス固有の例外クラス","s":"s3.exceptions.NoSuchBucketPolicy のようなサービス固有の例外クラスについて、正しい説明はどれか。","c":["ClientError とは無関係の独立した例外である","ClientError のサブクラスであり、client オブジェクトから動的に生成される","boto3 をインポートした時点で静的に定義されている","リージョンごとに異なるクラスになる"],"a":"イ","et":"client 変数経由でしか参照できない","eb":"サービス固有の例外は ClientError のサブクラスとして、client オブジェクトの exceptions 属性から動的に提供される。したがって except s3.exceptions.NoSuchBucketPolicy のように client 変数を経由して書く必要があり、モジュールから直接 import することはできない。「ポリシーが未設定」「設定が存在しない」といった正常系に近い状態がこれらの例外で返ってくることが多く、棚卸しスクリプトでは except で捕まえて「未設定」と記録する扱いが定石になる。"},{"i":"k5#5-3","g":"k5","n":"5-3","t":"既に存在する場合のエラー","s":"Athena のワークグループ作成で、既に同名のものが存在する場合の扱いとして適切なものはどれか。","c":["例外は発生しないので何も書かなくてよい","エラーコードを見ずに全ての ClientError を無視する","InvalidRequestException を捕まえて「既存のためスキップ」とし、それ以外は再送出する","作成前に必ず delete_work_group を実行する"],"a":"ウ","et":"想定内のエラーだけを握りつぶす","eb":"冪等でない作成系APIは、既存リソースに対して何らかの例外を返す。Athena のワークグループでは InvalidRequestException、S3 では BucketAlreadyOwnedByYou、SSM の put_parameter では ParameterAlreadyExists といった具合にサービスごとにコードが異なる。ここで重要なのは、想定内のエラーコードだけを握りつぶし、それ以外は raise で再送出することである。ClientError をまとめて無視すると、権限不足やスロットリングまで隠れてしまい、後段で原因不明の失敗として現れる。"},{"i":"k5#5-4","g":"k5","n":"5-4","t":"部分失敗の集約","s":"複数アカウントを横断して同じ調査を回すスクリプトで、1つのアカウントが AccessDenied になったときの設計として適切なものはどれか。","c":["エラーを無視して何も記録しない","無限にリトライする","例外を送出してスクリプト全体を停止する","そのアカウントのエラーを記録して次のアカウントへ進み、最後に調査できなかったアカウントを一覧で報告する"],"a":"エ","et":"「調べられなかった」を結果に残す","eb":"横断調査で1アカウントの失敗が全体を止めると、他の正常なアカウントの結果まで得られなくなる。一方でエラーを黙って捨てると「そのアカウントには問題がなかった」と誤読される危険がある。したがってアカウントごとに例外を捕まえて errors に記録し、最後の集約レポートで調査できなかった対象を明示するのが正しい形になる。この「成功した結果」と「調べられなかった対象」を分けて出す設計は、インシデント調査ツール全般に共通する原則である。"},{"i":"k5#5-5","g":"k5","n":"5-5","t":"SDK 既定のリトライ","s":"boto3 のリトライ挙動について正しいものはどれか。","c":["既定でスロットリングや一時的なエラーに対する自動リトライが行われ、Config(retries={...}) で回数やモードを変更できる","すべてのエラーを無限にリトライする","リトライは client ごとではなくリージョンごとに設定する","リトライ機能はないので必ず自分で実装する必要がある"],"a":"ア","et":"既定で動いていることを知っておく","eb":"botocore は ThrottlingException や5xx など一時的なエラーに対し、指数バックオフ付きの自動リトライを既定で行う。Config(retries={'max_attempts': N, 'mode': 'standard'}) で回数とモードを変更でき、mode には legacy / standard / adaptive がある。既定で動いているため、自分でもリトライを書くと回数が掛け算で増える点に注意が必要である。一方 ClientError が最終的に送出された時点では既にリトライ済みであり、そこからさらに即座に再実行しても成功しにくい。"},{"i":"k5#5-6","g":"k5","n":"5-6","t":"Full Jitter","s":"指数バックオフにジッタ（ゆらぎ）を加える目的として正しいものはどれか。","c":["平均待機時間を短くするため","同時に失敗した多数のクライアントが同じタイミングで再送するのを防ぐため","リトライ回数の上限をなくすため","エラーコードの判定を不要にするため"],"a":"イ","et":"再送の波を平らにする","eb":"指数バックオフだけでは、同時に失敗したクライアントが全員同じ間隔で再送するため、負荷の波がそのまま維持されて回復を妨げる。待機時間を random(0, min(maxDelay, base × 2^attempt)) のように乱数で散らす Full Jitter が基本形である。加えて回数上限を必ず設け、上限に達したら諦めて上位にエラーを返す。無限リトライはリトライストームの温床であり、元の原因が解消しても障害が終わらないという状態を生む。"},{"i":"k5#5-7","g":"k5","n":"5-7","t":"権限不足が現れる段階","s":"非同期で実行されるAPI（SSM の send_command など）で権限が不足していた場合、エラーが現れる場所として注意すべきことはどれか。","c":["waiter が必ず検知する","必ず呼び出し時に ClientError として返る","呼び出し自体は成功し、個別の実行結果を取得したときに失敗として現れることがある","CloudTrail にしか記録されない"],"a":"ウ","et":"呼び出しの成功は実行の成功ではない","eb":"send_command は CommandId を返した時点で「受理された」だけであり、対象インスタンス側での実行結果は get_command_invocation で別途取得する。Lambda の非同期実行（InvocationType='Event'）も同様で、202 が返っても関数内部の失敗は分からない。これらは呼び出し側の戻り値だけを見ていると成功に見えるため、実行結果のステータスを必ず確認する設計にする必要がある。呼び出しの成功と実行の成功を区別することが、非同期APIを扱う際の基本姿勢になる。"},{"i":"e1#1-1","g":"e1","n":"1-1","t":"未使用EIPの判定","s":"describe_addresses の結果から未使用の Elastic IP を判定する条件として正しいものはどれか。","c":["InstanceId と NetworkInterfaceId のどちらも含まれないこと","AssociationId が存在すること","Domain が 'standard' であること","PublicIp が空であること"],"a":"ア","et":"ENIに付いていれば使用中","eb":"EIP は EC2 インスタンスに直接関連付ける場合と、ENI（ネットワークインタフェース）に関連付ける場合がある。NAT Gateway や ALB に紐づく EIP は InstanceId を持たず NetworkInterfaceId だけを持つため、InstanceId の有無だけで判定すると使用中の EIP を未使用と誤判定する。未使用 EIP は時間課金が発生し続けるコスト削減の定番対象だが、解放すると同じIPは取り戻せないため、検出と解放は分けて運用する。"},{"i":"e1#1-2","g":"e1","n":"1-2","t":"孤立スナップショットの検出","s":"孤立スナップショット（どのAMIからも参照されていないもの）を検出する手順として正しいものはどれか。","c":["describe_snapshots の Description が空のものを抽出する","自社AMIの BlockDeviceMappings から使用中のスナップショットIDを集め、全スナップショットとの差分を取る","StartTime が90日以上前のものを抽出する","State が completed 以外のものを抽出する"],"a":"イ","et":"AMI側から使用中を集めて差分","eb":"スナップショット自身には「どのAMIから参照されているか」の情報がないため、describe_images で自社AMIを取得し、各AMIの BlockDeviceMappings の Ebs.SnapshotId を集合として集めたうえで、全スナップショットとの差分を取る必要がある。OwnerIds / Owners に自アカウントIDを指定しないとパブリックなAMIやスナップショットまで対象に入り、結果が膨大になる点にも注意する。削除は取り返しがつかないため、検出と削除は必ず分ける。"},{"i":"e1#1-3","g":"e1","n":"1-3","t":"インスタンスタイプ変更の手順","s":"起動中のインスタンスに対して modify_instance_attribute でタイプを変更しようとするとどうなるか。","c":["変更は成功するがタイプは変わらない","次回起動時に反映される","IncorrectInstanceState エラーになる","自動的に停止・変更・起動が行われる"],"a":"ウ","et":"停止→変更→起動の三点セット","eb":"インスタンスタイプの変更は stopped 状態でしか行えず、running のまま投げると IncorrectInstanceState が返る。そのため stop_instances → instance_stopped waiter → modify_instance_attribute → start_instances → instance_running waiter という順序になる。停止と起動にはそれぞれ待ち時間が発生し、パブリックIPを自動割り当てにしている場合は停止・起動でIPが変わる点にも注意が必要である。作業時間は waiter の実測から見積もる。"},{"i":"e1#1-4","g":"e1","n":"1-4","t":"冪等性","s":"既に stopped 状態のインスタンスに対して stop_instances を投げたときの挙動として正しいものはどれか。","c":["インスタンスが起動する","何も返らずタイムアウトする","エラーになる","正常に応答が返り、CurrentState と PreviousState がいずれも stopped になる"],"a":"エ","et":"状態遷移系は概ね冪等","eb":"stop_instances や start_instances は目的の状態を宣言する形のAPIであり、既にその状態であってもエラーにはならず、CurrentState と PreviousState を含む応答が返る。この冪等性のおかげでリトライが安全になる。一方 create_db_snapshot や register_task_definition のように呼ぶたびに新しいリソースが作られるAPIは冪等でなく、同じ処理を二度走らせると二重に作られる。書き込み系を扱うときは、そのAPIが宣言型か生成型かを最初に確認する。"},{"i":"e1#1-5","g":"e1","n":"1-5","t":"全開放ルールの検出","s":"セキュリティグループの全開放ルールを検出するスクリプトで、FromPort が存在しないルールがある。この場合に考えられるものはどれか。","c":["IpProtocol が -1（すべてのプロトコル）で、ポート範囲の概念がない","アウトバウンドルールである","IPv6 のルールである","ルールが無効化されている"],"a":"ア","et":"全プロトコル許可はポートを持たない","eb":"IpProtocol が -1 の場合はすべてのプロトコル・すべてのポートを意味するため、FromPort / ToPort が応答に含まれない。したがって rule['FromPort'] と書くと KeyError になり、rule.get('FromPort', 'ALL') のように既定値を置く必要がある。全プロトコル・全開放は最も危険な設定であり、ポート番号で絞り込む検出ロジックを書いていると、この最も危険なルールだけを取りこぼすという逆転が起きる。"},{"i":"e1#1-6","g":"e1","n":"1-6","t":"オプトインリージョン","s":"describe_regions で opt-in-status を 'opt-in-not-required' と 'opted-in' に絞る理由はどれか。","c":["リージョン数を減らして実行を速くするため","有効化していないリージョンに対してAPIを呼ぶと認証・接続エラーになるため","課金対象のリージョンだけを取得するため","日本国内のリージョンだけを取得するため"],"a":"イ","et":"全リージョン走査の前処理","eb":"一部のリージョンは既定で無効（opt-in が必要）であり、有効化していない状態でAPIを呼ぶと認証エラーや接続エラーになる。全リージョン走査の前処理としてこのフィルタを掛けることで、無効リージョンでの例外を避けられる。リージョンは追加されることがあるため、リストをハードコードせず動的に取得する形にしておくと、新リージョン追加時にスクリプトの修正が要らない。棚卸しの網羅性という点でも動的取得が望ましい。"},{"i":"e2#2-1","g":"e2","n":"2-1","t":"describe_services の上限","s":"describe_services に一度に渡せるサービスの数について正しいものはどれか。","c":["最大10件であり、それ以上は分割して呼ぶ必要がある","最大100件である","クラスターあたり1件のみ","上限はない"],"a":"ア","et":"10件ずつスライスして回す","eb":"describe_services は一度に最大10件までしか指定できないため、list_services で得た ARN を10件ずつスライスして複数回呼ぶ必要がある。サービス数が10以下の環境では気づかないまま動いてしまい、増えた時点で InvalidParameterException になるという形で顕在化する。同様の件数上限は describe_tasks（100件）、SES の検証ステータス取得（100件）などにもあり、一覧取得と詳細取得を組み合わせるときは常に上限を確認する。"},{"i":"e2#2-2","g":"e2","n":"2-2","t":"desired と running の乖離","s":"ECS サービスで desiredCount=4、runningCount=2、pendingCount=2 という状態から読み取れることはどれか。","c":["サービスが停止している","2つのタスクが起動処理中であり、まだ RUNNING になっていない","2つのタスクがヘルスチェックに失敗している","タスク定義が壊れている"],"a":"イ","et":"pending は起動処理中","eb":"pendingCount は起動処理中のタスク数であり、イメージのプル、ENI の割り当て、コンテナの起動などが進行中であることを示す。スケールアウト直後やデプロイ中は一時的に乖離が出るのが正常であり、それ自体は異常ではない。問題になるのは pending のまま滞留するケースで、サブネットのIP枯渇、イメージのプル失敗、キャパシティ不足などが原因になる。原因はアプリログではなくサービスイベント（describe_services の events）に出る。"},{"i":"e2#2-3","g":"e2","n":"2-3","t":"forceNewDeployment","s":"update_service に forceNewDeployment=True を指定したときに起きることはどれか。","c":["すべてのタスクが同時に停止してから起動する","サービスが削除されて再作成される","タスク定義を変えずに、現在のタスクを新しいタスクに順次入れ替える","タスク定義の新リビジョンが自動的に登録される"],"a":"ウ","et":"設定反映・イメージ再取得の定番","eb":"forceNewDeployment はタスク定義を変更せずに新しいデプロイを開始し、既存タスクを順次入れ替える。latest タグのイメージを更新した後の反映、パラメータストアから読む設定の再読み込み、原因不明の不調に対する再起動などで使う。入れ替えはローリングで行われるため、minimumHealthyPercent と maximumPercent の設定次第で所要時間もリクエスト断の有無も変わる。完了確認は services_stable waiter を通すのが定型である。"},{"i":"e2#2-4","g":"e2","n":"2-4","t":"タスクのIPアドレス","s":"awsvpc モードの ECS タスクのプライベートIPを describe_tasks の結果から取得する場所はどれか。","c":["task['containers'][0]['networkInterfaces'][0]['ipv6Address']","task['taskArn'] から導出する","task['privateIpAddress']","task['attachments'] の details から name が 'privateIPv4Address' の項目を探す"],"a":"エ","et":"ENIの情報は attachments 側","eb":"awsvpc モードではタスクごとに ENI が割り当てられ、その情報は attachments の中に name / value の組のリストとして入る。privateIPv4Address のほか networkInterfaceId や subnetId もここから取れる。構造が深く、name で探す形になるため素直に辿れないのが特徴である。タスクのIPが分かると、ALB のアクセスログの target_ip やフローログと突き合わせて、どのタスクが問題を起こしていたかを特定できる。"},{"i":"e2#2-5","g":"e2","n":"2-5","t":"タスク定義のリビジョン","s":"register_task_definition を実行したときの挙動として正しいものはどれか。","c":["リビジョン番号が1つ増えた新しいタスク定義が作られ、旧リビジョンはそのまま残る","サービスが自動的に新リビジョンへ更新される","同じ内容なら新リビジョンは作られない","既存のリビジョンが上書きされる"],"a":"ア","et":"登録とデプロイは別の操作","eb":"register_task_definition は常に新しいリビジョンを作り、内容が同一でも番号が増える。旧リビジョンは明示的に登録解除するまで残り続けるため、ロールバック先として使える。重要なのは、登録しただけではサービスは切り替わらないことで、実際に反映するには update_service で taskDefinition を指定する必要がある。この分離があるため「登録→検証→切替」という手順が成立する一方、登録したのに反映されないという勘違いも起きやすい。"},{"i":"e2#2-6","g":"e2","n":"2-6","t":"stopTimeout の取得","s":"タスク定義からコンテナの stopTimeout を取り出すために辿る構造はどれか。","c":["task → containers → stopTimeout","taskDefinition → containerDefinitions → stopTimeout","taskDefinition → stopTimeout","service → deploymentConfiguration → stopTimeout"],"a":"イ","et":"コンテナ単位の設定","eb":"stopTimeout はコンテナ定義ごとの設定であり、describe_task_definition のレスポンスの containerDefinitions の各要素に入る。未設定の場合はキー自体が存在せず、Fargate では既定30秒・最大120秒が適用される。SIGTERM を送ってからこの時間が過ぎると SIGKILL で強制終了されるため、アプリのドレイン待機と処理中待機の合計がこの値を超えていると、graceful shutdown が途中で打ち切られる。設定値の噛み合わせを検算する際の重要な入力になる。"},{"i":"e3#3-1","g":"e3","n":"3-1","t":"ターゲットの状態","s":"describe_target_health が返す State のうち、登録解除の処理中であることを示すものはどれか。","c":["draining","unhealthy","initial","unused"],"a":"ア","et":"draining は切り離し中","eb":"draining は登録解除が進行中で、既存の接続の完了を待っている状態である。unused はターゲットグループに登録されているがロードバランサにアタッチされていない、またはAZが有効化されていない状態、initial はヘルスチェックの初回判定中を示す。デプロイ中に draining が並ぶのは正常な挙動だが、この状態が登録解除遅延の設定時間より長く残り続ける場合は、長時間接続やアプリ側の処理が終わっていない可能性がある。"},{"i":"e3#3-2","g":"e3","n":"3-2","t":"unhealthy の理由","s":"unhealthy なターゲットについて、原因の切り分けに直接使える情報はどれか。","c":["ターゲットの AvailabilityZone","TargetHealth の Reason と Description","ターゲットグループの Protocol と Port","ロードバランサの Scheme"],"a":"イ","et":"Reason で応答の有無を判別する","eb":"TargetHealth の Reason には Target.ResponseCodeMismatch（応答はあるが期待するコードでない）、Target.Timeout（応答がない）、Target.FailedHealthChecks、Elb.InternalError などが入り、Description に補足が入る。ResponseCodeMismatch ならアプリは動いているがヘルスチェックのパスや期待コードの設定が合っていない、Timeout ならアプリが応答していないかセキュリティグループで塞がれている、と調査先が分かれる。この一次分岐をAPIから取れるかどうかで初動の速さが変わる。"},{"i":"e3#3-3","g":"e3","n":"3-3","t":"ASG の LifecycleState","s":"Auto Scaling グループのインスタンスについて、LifecycleState と HealthStatus の関係として正しいものはどれか。","c":["HealthStatus は ELB のヘルスチェックのみを反映する","LifecycleState が InService なら HealthStatus は必ず Healthy である","LifecycleState は起動・終了の進行段階、HealthStatus はヘルスチェック結果であり、InService かつ Unhealthy という状態がありうる","HealthStatus は LifecycleState の別名である"],"a":"ウ","et":"二軸で見ないと状態を誤読する","eb":"LifecycleState は Pending / InService / Terminating といった進行段階を表し、HealthStatus は Healthy / Unhealthy というヘルスチェック結果を表す。InService かつ Unhealthy は、まさに置き換えが始まる直前の状態であり、この2軸を分けて数えないと台数の実態を誤読する。また ASG のヘルスチェックタイプを EC2 のみにしていると、アプリが落ちていてもインスタンスは Healthy のままになるため、ELB ヘルスチェックの有効化も併せて確認する。"},{"i":"e3#3-4","g":"e3","n":"3-4","t":"起動設定と起動テンプレート","s":"ASG の棚卸しで LaunchConfigurationName が設定されているグループを見つけたときの解釈として適切なものはどれか。","c":["スポットインスタンスを使っている","起動テンプレートより高速に起動する","最新の推奨構成である","旧世代の起動設定を使っており、起動テンプレートへの移行対象である"],"a":"エ","et":"起動設定は非推奨","eb":"起動設定（Launch Configuration）は旧世代の仕組みで、バージョン管理ができず、新しいインスタンスタイプや機能に対応しないなどの制約がある。現在は起動テンプレート（Launch Template）が推奨で、バージョンを持てるため段階的な変更とロールバックが可能になる。棚卸しスクリプトで LaunchConfigurationName の有無を見ることで、移行対象を機械的に洗い出せる。移行はASGの再作成を伴わないが、既存インスタンスには遡って適用されない点に注意する。"},{"i":"e4#4-1","g":"e4","n":"4-1","t":"バケットのリージョン","s":"get_bucket_location が返す LocationConstraint が None だった場合、そのバケットのリージョンはどれか。","c":["us-east-1","呼び出し元のリージョン","ap-northeast-1","リージョン未設定"],"a":"ア","et":"歴史的経緯による例外","eb":"us-east-1 は S3 の最初のリージョンであり、LocationConstraint が空（None）で返るという歴史的な仕様が残っている。そのため loc['LocationConstraint'] or 'us-east-1' という書き方で補う必要がある。バケット名はグローバルに一意だが、リージョンをまたいだアクセスには追加のレイテンシと転送料金が発生するため、棚卸しではリージョンを併記できると構成の問題に気づきやすい。"},{"i":"e4#4-2","g":"e4","n":"4-2","t":"パブリックアクセスブロックの4項目","s":"S3 のパブリックアクセスブロック設定として存在しない項目はどれか。","c":["BlockPublicPolicy","BlockCrossAccountAccess","BlockPublicAcls","IgnorePublicAcls"],"a":"イ","et":"ACL系2つとポリシー系2つ","eb":"設定は BlockPublicAcls（新規のパブリックACLを拒否）、IgnorePublicAcls（既存のパブリックACLを無視）、BlockPublicPolicy（パブリックなバケットポリシーの設定を拒否）、RestrictPublicBuckets（パブリックポリシーを持つバケットへのアクセスを制限）の4つである。ACL系とポリシー系それぞれに「新規を拒否」と「既存を無効化」の2段があると整理すると覚えやすい。クロスアカウントアクセスの制御はバケットポリシー側の役割であり、この設定には含まれない。"},{"i":"e4#4-3","g":"e4","n":"4-3","t":"設定なしと設定不完全","s":"get_public_access_block が NoSuchPublicAccessBlockConfiguration を返したときの意味はどれか。","c":["権限が不足している","バケットが存在しない","ブロック設定そのものが一度も設定されていない","4項目すべてが false に設定されている"],"a":"ウ","et":"未設定は例外で返ってくる","eb":"パブリックアクセスブロックが未設定のバケットでは、false が並んだ応答ではなく NoSuchPublicAccessBlockConfiguration という例外が返る。監査スクリプトではこれを捕まえて「ブロック設定なし」として記録する必要があり、捕まえ損ねるとそこでスクリプトが止まって残りのバケットを検査できない。なおアカウント単位のブロック設定（S3 Control）が別に存在し、そちらが有効ならバケット側が未設定でもパブリックにはならないため、判定には両方の確認が要る。"},{"i":"e4#4-4","g":"e4","n":"4-4","t":"ポリシーの渡し方","s":"put_bucket_policy にポリシーを渡すときの形式として正しいものはどれか。","c":["YAML 文字列を渡す","S3 上のポリシーファイルのURLを渡す","Python の dict をそのまま渡す","json.dumps した文字列を渡す"],"a":"エ","et":"取得時はjson.loadsが要る","eb":"バケットポリシーは JSON 文字列として渡す必要があり、dict を直接渡すと ParamValidationError になる。逆に get_bucket_policy が返す Policy も文字列なので、扱うには json.loads が要る。同じ「文字列として渡す JSON」は CloudWatch ダッシュボードの DashboardBody、Secrets Manager の SecretString にも見られる共通パターンである。なお IAM の信頼ポリシーのように、取得時は dict に展開されて返るものもあり、方向によって型が違う点に注意する。"},{"i":"e4#4-5","g":"e4","n":"4-5","t":"ライフサイクルの構成要素","s":"未完了のマルチパートアップロードを自動削除するライフサイクル設定はどれか。","c":["AbortIncompleteMultipartUpload の DaysAfterInitiation","NoncurrentVersionExpiration の NoncurrentDays","Expiration の Days","Transitions の StorageClass"],"a":"ア","et":"見えないのに課金される領域","eb":"マルチパートアップロードが途中で失敗すると、アップロード済みのパートがバケットに残り続け、オブジェクト一覧には現れないまま課金される。AbortIncompleteMultipartUpload を設定しておけば一定日数で自動的に破棄される。ライフサイクルには他に、ストレージクラス移行の Transitions、オブジェクト削除の Expiration、バージョニング有効時の旧バージョン向け NoncurrentVersionExpiration があり、それぞれ Filter で対象プレフィックスを絞る。"},{"i":"e4#4-6","g":"e4","n":"4-6","t":"署名付きURLの生成","s":"generate_presigned_url の挙動として正しいものはどれか。","c":["AWS にリクエストを送ってURLを発行する","手元で署名を計算するだけでAPI呼び出しは発生しない","対象オブジェクトが存在しないとエラーになる","生成時に権限がなくてもURLは常に有効になる"],"a":"イ","et":"オフラインで作られるので存在確認はしない","eb":"署名付きURLは、実行中の認証情報を使ってローカルで署名を計算するだけであり、AWS への通信は発生しない。そのため存在しないキーに対しても発行でき、アクセスして初めて 404 が返る。URLの権限は署名に使った認証情報の権限を引き継ぐため、一時認証情報で発行した場合はその有効期限が切れた時点で ExpiresIn の残りに関わらず使えなくなる。署名バージョンは s3v4 を明示するのが確実である。"},{"i":"e4#4-7","g":"e4","n":"4-7","t":"upload_file と put_object","s":"upload_file と put_object の違いとして正しいものはどれか。","c":["upload_file はメモリ上のバイト列しか受け付けない","両者は完全に同じ動作をする","upload_file は大きいファイルを自動的にマルチパートに分割し、並列アップロードと進捗コールバックに対応する","put_object のほうが大きいファイルに向いている"],"a":"ウ","et":"転送はマネージド、単発は低レベル","eb":"upload_file は boto3 が提供するマネージドな転送処理で、閾値（既定8MB）を超えるファイルを自動でマルチパートに分割し、並列アップロードと再試行、Callback による進捗通知に対応する。put_object は API と1対1の低レベル操作で、一度に送るため大きなファイルには向かない。逆にメモリ上のバイト列やストリームをそのまま送りたい場合は put_object（あるいは upload_fileobj）が適する。5GBを超えるオブジェクトは put_object では扱えない。"},{"i":"e5#5-1","g":"e5","n":"5-1","t":"ポリシーのアタッチ先","s":"AdministratorAccess が誰に付与されているかを一度に調べるAPIはどれか。","c":["list_entities_for_policy にポリシーARNを渡す","get_policy にポリシーARNを渡す","simulate_principal_policy を実行する","list_attached_user_policies を全ユーザーに対して実行する"],"a":"ア","et":"ポリシー側から引くと1回で済む","eb":"list_entities_for_policy はポリシーARNを起点に、アタッチされているユーザー（PolicyUsers）、ロール（PolicyRoles）、グループ（PolicyGroups）を一度に返す。ユーザー側から総当たりする方式に比べてAPI呼び出し回数が桁違いに少なく、権限の棚卸しではこちらが基本形になる。ただし取得できるのは管理ポリシーのアタッチ関係だけで、インラインポリシーで同等の権限を持つエンティティは検出されない点に注意が必要である。"},{"i":"e5#5-2","g":"e5","n":"5-2","t":"未使用キーの判定","s":"get_access_key_last_used のレスポンスで AccessKeyLastUsed に LastUsedDate が含まれない場合の意味はどれか。","c":["取得権限が不足している","そのキーは作成以来一度も使われていない","直近90日間使われていない","キーが無効化されている"],"a":"イ","et":"キーの有無ではなく使用実績で判断する","eb":"一度も使われていないキーでは LastUsedDate 自体が返らないため、.get() で受けて未使用として扱う必要がある。使用実績がある場合は最終使用日時に加えて Region と ServiceName も返り、どこで何に使われたキーかの手がかりになる。棚卸しでは「作成から一定日数が経過」と「最終使用から一定日数が経過」を別の指標として見る。前者はローテーション漏れ、後者は不要キーの検出にあたる。"},{"i":"e5#5-3","g":"e5","n":"5-3","t":"インラインポリシー","s":"IAM のインラインポリシーを棚卸しする必要がある理由として最も適切なものはどれか。","c":["インラインポリシーはCloudTrailに記録されないため","インラインポリシーは管理ポリシーより権限が強いため","エンティティに直接埋め込まれており、ポリシー一覧からは見えず権限の全体像から漏れるため","インラインポリシーは自動的に失効するため"],"a":"ウ","et":"横断的な把握ができない","eb":"インラインポリシーはユーザーやロールに直接埋め込まれるため、list_policies には現れず、ポリシー起点で権限を調べても見つからない。したがってエンティティを全件走査し、list_role_policies / list_user_policies で1つずつ確認する必要がある。再利用も差分管理もできず、同じ内容が複数箇所に散らばりやすいため、管理ポリシーへ集約するのが定石である。棚卸しはその移行対象を洗い出す作業になる。"},{"i":"e5#5-4","g":"e5","n":"5-4","t":"信頼ポリシーの形","s":"IAM ロールの一覧から外部アカウントへの信頼を検出するために参照するフィールドはどれか。","c":["role['Arn'] のアカウントID部分","role['MaxSessionDuration']","role['Path']","role['AssumeRolePolicyDocument'] の Statement の Principal"],"a":"エ","et":"ARNは自分側、Principalは相手側","eb":"AssumeRolePolicyDocument が信頼ポリシーであり、その Statement の Principal に「誰がこのロールを引き受けられるか」が書かれている。Principal.AWS は文字列のことも配列のこともあるため、両方に対応する正規化が必要になる。AWS サービスからの引き受けは Principal.Service（ec2.amazonaws.com など）、OIDC 連携は Principal.Federated に入る。role['Arn'] はロール自身の所属アカウントであり、信頼先とは別物である。"},{"i":"e5#5-5","g":"e5","n":"5-5","t":"ポリシードキュメントの型","s":"list_roles が返す AssumeRolePolicyDocument の型として正しいものはどれか。","c":["boto3 がデコードした dict","バイト列","YAML 文字列","URLエンコードされた文字列のまま"],"a":"ア","et":"CLIとboto3で見え方が違う","eb":"IAM のポリシードキュメントは API 上は URL エンコードされた文字列で返るが、boto3 は受信時にデコードして dict として返すため、json.loads を挟まずそのまま Statement を辿れる。AWS CLI では文字列のまま出力されることがあり、同じAPIでも見え方が異なる。一方、S3 のバケットポリシーや Secrets Manager の値は文字列のまま返るため json.loads が必要で、サービスごとに扱いが揃っていない点に注意する。"},{"i":"e5#5-6","g":"e5","n":"5-6","t":"キーの無効化","s":"update_access_key で Status を 'Inactive' にしたキーを使って API を呼ぶとどうなるか。","c":["警告付きで成功する","InvalidClientTokenId など認証段階のエラーになる","AccessDenied になる","自動的に有効化される"],"a":"イ","et":"認可ではなく認証で弾かれる","eb":"無効化されたキーは認証段階で拒否されるため、権限不足を意味する AccessDenied ではなく InvalidClientTokenId のような認証エラーになる。この違いは切り分けで重要で、AccessDenied なら権限設計の問題、認証エラーならキーそのものや認証情報の指定の問題と、調査先が完全に分かれる。棚卸しで不要キーを処分する際は、いきなり削除せず Inactive にして一定期間様子を見る二段階にすると、影響のある削除を避けられる。"},{"i":"e6#6-1","g":"e6","n":"6-1","t":"Overwrite の既定","s":"既に存在するパラメータ名に対して Overwrite を指定せず put_parameter を実行するとどうなるか。","c":["ParameterAlreadyExists エラーになる","新しいバージョンが作られる","何も起きず正常終了する","上書きされる"],"a":"ア","et":"事故防止の既定値","eb":"Overwrite の既定は False であり、既存の名前に対しては ParameterAlreadyExists が返る。意図しない上書きを防ぐための設計だが、設定投入スクリプトでは Overwrite=True を明示するのが普通になる。なお Overwrite=True で上書きしても以前の値が消えるわけではなく、パラメータはバージョンを持ち、get_parameter で名前に :バージョン番号 を付けて過去の値を参照できる。ラベル機能と組み合わせれば切り戻しも可能である。"},{"i":"e6#6-2","g":"e6","n":"6-2","t":"WithDecryption","s":"SecureString 型のパラメータを WithDecryption=False で取得したときの挙動として正しいものはどれか。","c":["エラーになる","暗号化されたままの値が返る","空文字が返る","自動的に復号される"],"a":"イ","et":"復号にはKMSの権限も要る","eb":"WithDecryption を省略または False にすると、SecureString は暗号化された文字列のまま返る。エラーにならないため、値が使えないことに気づくのは接続に失敗した後になりやすい。復号には SSM の権限に加えて、暗号化に使った KMS キーに対する kms:Decrypt の権限が必要であり、IAM で SSM だけ許可していると AccessDenied になる。この二重の権限構造は Secrets Manager でも同じで、暗号化されたリソースへのアクセス障害では常に鍵側を疑う。"},{"i":"e6#6-3","g":"e6","n":"6-3","t":"シークレットの取得","s":"get_secret_value が返す SecretString の扱いとして正しいものはどれか。","c":["キーごとに個別のAPIで取得する","dict として返るのでそのままキーアクセスできる","文字列として返るため、JSON として保存している場合は json.loads が必要","常にバイト列で返る"],"a":"ウ","et":"バイナリなら SecretBinary 側","eb":"SecretString はあくまで文字列であり、複数の値をまとめて入れている場合は JSON として保存したうえで json.loads で展開する。バイナリを保存した場合は SecretString ではなく SecretBinary キーが入るため、どちらが存在するかの分岐が必要になる。取得のたびに API 呼び出しと課金が発生するので、アプリでは TTL 付きのキャッシュと、認証エラー時の再取得を組み合わせるのが実務的な形になる。"},{"i":"e6#6-4","g":"e6","n":"6-4","t":"ローテーションの有無","s":"list_secrets の結果で LastRotatedDate が存在しないシークレットから読み取れることはどれか。","c":["暗号化されていない","アクセスされていない","削除予定である","自動ローテーションが実行された実績がない"],"a":"エ","et":"手動更新は LastChangedDate に出る","eb":"LastRotatedDate はローテーションが実行された日時であり、一度も実行されていなければキー自体が存在しない。手動で put_secret_value した場合は LastChangedDate だけが更新されるため、この2つを並べて見ると「変更はされているが自動ローテーションは動いていない」といった状態が読み取れる。棚卸しでは、ローテーション設定の有無（RotationEnabled）と実績の両方を確認しないと、設定だけして失敗し続けているケースを見落とす。"},{"i":"e7#7-1","g":"e7","n":"7-1","t":"Dimensions の指定ミス","s":"get_metric_statistics で Dimensions の値を1文字間違えた場合の挙動はどれか。","c":["エラーにならず Datapoints が空のリストで返る","全インスタンスの合計値が返る","最も近い名前のディメンションが使われる","ValidationError になる"],"a":"ア","et":"空配列＝正常値ゼロ、ではない","eb":"CloudWatch のメトリクスはディメンションの組み合わせごとに別系列として管理されており、存在しない組み合わせを指定しても「該当なし」として空の Datapoints が返るだけでエラーにならない。そのため、値が取れないときに「メトリクスが出ていない」のか「指定が間違っている」のかを区別できない。まず list_metrics で実際に存在するディメンションの組み合わせを確認するのが確実な切り分けになる。監視スクリプトでは空配列を異常として扱う設計が必要である。"},{"i":"e7#7-2","g":"e7","n":"7-2","t":"Period と Statistics","s":"get_metric_statistics の Period=300、Statistics=['Average','Maximum'] が意味するものはどれか。","c":["直近300秒分のデータを平均と最大で返す","5分ごとに区切った各区間について、その区間内の平均値と最大値を返す","300個のデータポイントを返す","5分間隔でポーリングを繰り返す"],"a":"イ","et":"集計粒度であって取得範囲ではない","eb":"Period は集計の粒度（秒）であり、指定した期間を Period ごとに区切って、それぞれの区間の統計値を返す。粒度を粗くすると短時間のスパイクが平均に埋もれ、細かくするとデータポイントが増えて上限（1回1440点）に当たる。Average だけを見ていると一部インスタンスの張り付きを見逃すため、Maximum と併せて取得するのが基本になる。なお細かい粒度のデータは保持期間が短く、期間を遡るほど粗い粒度しか残らない。"},{"i":"e7#7-3","g":"e7","n":"7-3","t":"カスタムメトリクス","s":"put_metric_data でカスタムメトリクスを送信したあと、すぐに get_metric_statistics で取得できないことがある理由はどれか。","c":["同じリージョンからしか取得できないため","名前空間の作成に時間がかかるため","送信した値が集計されて参照可能になるまでに時間差があるため","カスタムメトリクスは1時間に1回しか送信できないため"],"a":"ウ","et":"送信の成功と可視化は別","eb":"put_metric_data が成功しても、その値が統計として参照できるまでには時間差がある。カスタムメトリクスの名前空間は事前作成が不要で、送信時に自動的に作られる。注意点として、put_metric_data はリクエスト数に応じた課金があるため、ループ内で1件ずつ送るのではなく MetricData に複数件まとめて送る設計にする。またディメンションの組み合わせごとに別のメトリクスとして課金されるため、カーディナリティの高い値をディメンションに入れると急激にコストが増える。"},{"i":"e7#7-4","g":"e7","n":"7-4","t":"EvaluationPeriods","s":"Period=300、EvaluationPeriods=2 のアラームが ALARM になるまでに必要な時間はおよそどれか。","c":["2分","15分","5分","10分"],"a":"エ","et":"検知時間＝Period×EvaluationPeriods","eb":"Period が評価の区間長、EvaluationPeriods がその区間をいくつ連続で評価するかであり、閾値超過が2区間続いて初めて ALARM になる。したがって検知までに最短でも約10分かかる。区間を短くすれば検知は速くなるが、一時的なスパイクで誤検知しやすくなる。この計算ができると「アラートが遅い」という相談に対して、設定値から説明し、検知時間と誤検知率のどちらを取るかという議論に持ち込める。"},{"i":"e7#7-5","g":"e7","n":"7-5","t":"TreatMissingData","s":"TreatMissingData='breaching' を指定したアラームで、データが届かなくなったときの挙動はどれか。","c":["欠損を閾値超過として扱い ALARM になる","直前の状態を維持する","OK になる","INSUFFICIENT_DATA のままになる"],"a":"ア","et":"沈黙を異常とみなすかどうか","eb":"TreatMissingData には missing（既定・欠損を無視して直前の状態を維持）、breaching（異常として扱う）、notBreaching（正常として扱う）、ignore（状態を変えない）がある。監視対象そのものが停止したときに沈黙してしまうと、最も重大な障害でアラートが鳴らないことになるため、生存確認の性格を持つアラームでは breaching を選ぶ。一方で定期バッチのように本来データが出ない時間帯があるメトリクスに breaching を使うと誤検知が続く。"},{"i":"e7#7-6","g":"e7","n":"7-6","t":"ダッシュボードの構造","s":"put_dashboard に渡す DashboardBody の形式として正しいものはどれか。","c":["widgets 配列を含む dict","widgets 配列を含む JSON 文字列","ウィジェットのリストそのもの","CloudFormation テンプレート"],"a":"イ","et":"JSON文字列としてやり取りする","eb":"DashboardBody は widgets 配列を持つ JSON を文字列化して渡す。取得側の get_dashboard も文字列で返すため、編集するには json.loads → 変更 → json.dumps という往復が必要になる。ダッシュボードが構造化されたJSONであることを利用すれば、サービス一覧から機械的にウィジェットを生成して監視画面を自動構築できる。存在しないダッシュボード名で get_dashboard を呼ぶと DashboardNotFoundError になるため、新規作成との分岐に使える。"},{"i":"e8#8-1","g":"e8","n":"8-1","t":"保持期間未設定の検出","s":"describe_log_groups の結果で retentionInDays キーが存在しないロググループの意味はどれか。","c":["保持期間が無期限であり、ログが永久に蓄積され課金が増え続ける","ロググループが空である","保持期間が既定の30日である","保持期間が0日である"],"a":"ア","et":"既定は無期限","eb":"CloudWatch Logs の保持期間は既定で無期限であり、設定していないロググループはキー自体が返らない。ログは保存量に応じて課金されるため、放置すると増え続ける。put_retention_policy で一括設定できるが、監査要件や障害調査の必要期間を無視して一律に短くすると、いざというときにログが残っていないという事態になる。直近は CloudWatch Logs、それ以降は S3 へエクスポートして安価に長期保管する二段構えが実務的である。"},{"i":"e8#8-2","g":"e8","n":"8-2","t":"ログストリームの並べ替え","s":"直近のログを出しているストリームを特定するための describe_log_streams の指定はどれか。","c":["orderBy='LogStreamName', descending=True","orderBy='LastEventTime', descending=True","filterPattern='*'","startFromHead=True"],"a":"イ","et":"名前順では最新が先頭に来ない","eb":"ストリーム名は ECS のタスクIDなどが入るため名前順では時系列にならず、最新のストリームを探すには orderBy='LastEventTime' と descending=True を組み合わせる。ロググループにストリームが数千ある環境では、この指定の有無で調査の速さが大きく変わる。なお LastEventTime での並べ替えを指定した場合は logStreamNamePrefix を併用できないという制約があるため、名前で絞りたい場合と最新順で見たい場合は使い分けることになる。"},{"i":"e8#8-3","g":"e8","n":"8-3","t":"filterPattern の性質","s":"filter_log_events の filterPattern について正しいものはどれか。","c":["ワイルドカードは使えない","正規表現として解釈される","CloudWatch Logs 独自の構文であり、単純な文字列指定は大文字小文字を区別する部分一致になる","SQL の LIKE と同じ構文である"],"a":"ウ","et":"正規表現のつもりで書くと合わない","eb":"filterPattern は CloudWatch Logs 独自のフィルタ構文で、正規表現ではない。ERROR のような単純な指定は大文字小文字を区別する用語検索になり、複数語を並べるとAND、?を付けるとORになる。JSON形式のログには {$.level = \"ERROR\"} のようなプロパティ指定が使える。正規表現で柔軟に検索したい場合は Logs Insights の filter @message like /pattern/ を使うことになり、用途に応じた使い分けが必要になる。"},{"i":"e8#8-4","g":"e8","n":"8-4","t":"Insights の非同期パターン","s":"Logs Insights のクエリ実行で start_query のあとに必要な処理はどれか。","c":["waiter で完了を待つ","start_query の戻り値に結果が含まれるので不要","stop_query を呼んでから結果を取得する","get_query_results を status が Complete になるまでポーリングする"],"a":"エ","et":"Running のまま返ることがある","eb":"start_query が返すのは queryId だけで、結果は get_query_results を繰り返し呼んで取得する。status には Scheduled、Running、Complete、Failed、Cancelled、Timeout があり、Complete 以外で抜ける条件を書いておかないと無限ループになる。またクエリ実行中でも get_query_results は部分的な結果を返すことがあるため、status を確認せずに結果だけ見ると件数が足りないまま処理を進めてしまう。この非同期パターンは Athena とまったく同じ形である。"},{"i":"e8#8-5","g":"e8","n":"8-5","t":"filter_log_events との使い分け","s":"filter_log_events と Logs Insights の使い分けとして適切なものはどれか。","c":["件数の集計や統計が必要なら Insights、生ログをそのまま追いたいなら filter_log_events","Insights のほうが常に安価なので Insights を使う","filter_log_events は複数ロググループを横断できるので大規模調査に向く","両者は同じ構文なので入れ替え可能"],"a":"ア","et":"集計か、生ログ追跡か","eb":"filter_log_events は条件に合うログイベントをそのまま返すため、特定リクエストの前後を時系列で追う用途に向く。Insights は stats による集計、bin による時間バケット、複数ロググループの横断検索ができ、スキャン量に応じた課金がある。5xx の件数推移を出す、レイテンシの分布を見るといった分析は Insights、あるトレースIDの足取りを追うのは filter_log_events、と役割が分かれる。"},{"i":"e8#8-6","g":"e8","n":"8-6","t":"タイムスタンプの変換","s":"filter_log_events が返すイベントの timestamp を日時に変換する方法として正しいものはどれか。","c":["datetime.fromtimestamp(event['timestamp'], tz=timezone.utc)","datetime.fromtimestamp(event['timestamp'] / 1000, tz=timezone.utc)","datetime.fromisoformat(event['timestamp'])","そのまま datetime として使える"],"a":"イ","et":"1000で割るのを忘れると5万年後","eb":"CloudWatch Logs のイベントの timestamp はエポックミリ秒の整数であるため、1000で割ってから変換する。割り忘れると数万年後の日時になり、表示を見ればすぐ気づくが、範囲指定に使うと単に0件になるだけで気づきにくい。なおイベントには timestamp（ログに記録された時刻）と ingestionTime（CloudWatch が受け取った時刻）の2つがあり、両者が大きくずれている場合はログ転送の遅延を示す。"},{"i":"e9#9-1","g":"e9","n":"9-1","t":"実行中の状態","s":"Athena のクエリ実行状態のうち、まだ完了していないことを示す組み合わせはどれか。","c":["QUEUED と RUNNING","SUCCEEDED と RUNNING","FAILED と CANCELLED","PENDING と PROCESSING"],"a":"ア","et":"完了ステートを列挙せず、実行中を列挙する","eb":"状態は QUEUED、RUNNING、SUCCEEDED、FAILED、CANCELLED の5つで、実行中は QUEUED と RUNNING の2つである。ポーリングループの抜け方として、実行中の集合に含まれなくなったら抜けるという書き方にしておくと、将来ステートが増えても無限ループにならない。抜けた後に SUCCEEDED かどうかを別途判定し、失敗時は StateChangeReason に理由が入る。この形は Logs Insights のポーリングとまったく同じ構造である。"},{"i":"e9#9-2","g":"e9","n":"9-2","t":"スキャン量","s":"Athena の課金と直結するため運用上確認すべき、クエリ実行結果に含まれる統計値はどれか。","c":["EngineExecutionTimeInMillis","DataScannedInBytes","TotalExecutionTimeInMillis","ResultRows"],"a":"イ","et":"返った行数ではなく読んだ量で課金","eb":"Athena はスキャンしたデータ量に対して課金されるため、実行時間や結果行数ではなく DataScannedInBytes が費用に直結する。LIMIT を付けても対象パーティションを絞らなければスキャン量は減らない点が重要で、パーティション（ALB ログなら day）の WHERE 指定と、列指向フォーマットの採用が費用削減の主要な手段になる。実行のたびにこの値を出力しておくと、クエリの書き方による差が定量的に見える。"},{"i":"e9#9-3","g":"e9","n":"9-3","t":"Partition Projection","s":"Partition Projection を有効にしたテーブルの利点として正しいものはどれか。","c":["クエリ結果がキャッシュされる","スキャン量が自動的にゼロになる","ADD PARTITION や Glue Crawler なしで、追記され続けるログをそのままクエリできる","データが自動的に Parquet 形式に変換される"],"a":"ウ","et":"パーティション管理の運用が消える","eb":"通常、S3 に日付ごとのプレフィックスでログが増えていくたびにパーティションを登録する必要がある。Partition Projection は TBLPROPERTIES でパーティションの範囲と形式を宣言しておき、クエリ時にAthenaが位置を計算する方式で、この登録作業そのものが不要になる。前提として projection の形式と storage.location.template が実際のS3のパス構造と完全に一致している必要があり、ずれると該当データが見つからず結果が0件になる。"},{"i":"e9#9-4","g":"e9","n":"9-4","t":"結果の先頭行","s":"SELECT クエリに対する get_query_results の結果を処理するとき、注意すべき点はどれか。","c":["結果は常に1ページに収まる","NULL のセルは空文字列で返る","行の順序は保証されない","最初のページの先頭行が列名のヘッダー行なのでスキップする"],"a":"エ","et":"ヘッダーを1行目のデータと誤読しやすい","eb":"SELECT の結果では最初のページの先頭行に列名が入るため、そのまま処理すると列名がデータとして1件混入する。列名自体は ResultSetMetadata の ColumnInfo からも取得できる。また NULL のセルは VarCharValue キー自体が存在しないため、cell.get('VarCharValue') で受ける必要がある。件数が多い場合はページングされるので、paginator で全件を回収する形にしておく。"},{"i":"e9#9-5","g":"e9","n":"9-5","t":"ワークグループによる制御","s":"ワークグループに BytesScannedCutoffPerQuery を設定する目的として正しいものはどれか。","c":["上限を超えるスキャン量のクエリを自動的にキャンセルし、想定外の高額クエリを防ぐ","結果の行数を制限する","同時実行数を制限する","クエリの実行時間を短縮する"],"a":"ア","et":"事故を金額ではなく量で止める","eb":"BytesScannedCutoffPerQuery を設定すると、上限を超えた時点でクエリが自動キャンセルされ、パーティション指定を忘れた全件スキャンのような事故を未然に止められる。併せて EnforceWorkGroupConfiguration を有効にすると、クライアント側で出力先などを上書きできなくなり、結果の保存先を統制できる。障害調査用のワークグループを分けておけば、定番クエリを名前付きクエリとして登録し、コストも用途ごとに追跡できる。"},{"i":"e10#10-1","g":"e10","n":"10-1","t":"InvocationType","s":"InvocationType='Event' で invoke したときの挙動として正しいものはどれか。","c":["キューに入れた時点で HTTP 202 が返り、関数の実行結果は戻り値から分からない","権限の検証だけが行われ実行されない","同期実行より高速に結果が返る","関数の戻り値を待って受け取る"],"a":"ア","et":"202は受理、成功ではない","eb":"Event は非同期呼び出しで、Lambda が実行をキューに入れた時点で 202 を返す。関数内部で例外が起きても呼び出し側には伝わらないため、結果は CloudWatch メトリクス（Errors）やログ、あるいは送信先（Destinations）やDLQで確認する設計にする。RequestResponse は同期で戻り値を受け取り、DryRun はパラメータと権限の検証だけを行い関数を実行しない。用途に応じて3つを使い分ける。"},{"i":"e10#10-2","g":"e10","n":"10-2","t":"FunctionError","s":"RequestResponse で invoke し、関数内部で例外が発生した場合のレスポンスとして正しいものはどれか。","c":["StatusCode が 500 になる","StatusCode は 200 のままで、FunctionError キーが付き Payload にエラー内容が入る","ClientError 例外が送出される","Payload が空になる"],"a":"イ","et":"200だけ見ていると失敗を握り潰す","eb":"呼び出し自体が成功していれば StatusCode は 200 であり、関数内部の失敗は FunctionError キー（Unhandled または Handled）と Payload の内容で表される。StatusCode だけを見て成功判定すると、すべての失敗を見逃す。したがって response.get('FunctionError') の有無を必ず確認する。LogType='Tail' を指定すると LogResult に末尾4KBのログがBase64で入り、失敗時の手がかりになる。"},{"i":"e10#10-3","g":"e10","n":"10-3","t":"環境変数の更新","s":"update_function_configuration で Environment を指定したときの挙動として正しいものはどれか。","c":["環境変数は追記のみ可能で削除はできない","指定したキーだけが追加・更新され、既存のキーは保持される","環境変数がまるごと置き換えられ、指定しなかった既存のキーは消える","既存キーと衝突する場合はエラーになる"],"a":"ウ","et":"読んでマージしてから書く","eb":"Environment は部分更新ではなく全置換であるため、LOG_LEVEL を1つ足すつもりで指定すると他の環境変数がすべて消える。正しい手順は get_function_configuration で現在の値を取得し、Python 側でマージしてから渡すことである。この全置換の挙動はタグやポリシーなど他のAPIでも見られ、部分更新のつもりで全置換してしまう事故は書き込み系で最も多いパターンの1つになる。"},{"i":"e10#10-4","g":"e10","n":"10-4","t":"予約済み同時実行数","s":"put_function_concurrency で予約済み同時実行数を設定したときの効果として正しいものはどれか。","c":["その関数の実行速度が上がる","アカウント全体の上限が引き上げられる","コールドスタートがなくなる","その関数の同時実行の上限になると同時に、その分がアカウントの共有プールから確保される"],"a":"エ","et":"上限であり、同時に確保でもある","eb":"予約済み同時実行数は、その関数が使える上限であると同時に、その分をアカウントの共有プールから取り置く設定でもある。したがって上限としてスロットリングを起こす一方、他の関数のバーストから守る役割も持つ。0 に設定すると関数を事実上停止でき、暴走時の緊急停止手段になる。なおコールドスタートを減らすのはプロビジョニングされた同時実行数（put_provisioned_concurrency_config）であり、別の設定である。"},{"i":"e10#10-5","g":"e10","n":"10-5","t":"$LATEST とバージョン","s":"publish_version で発行したバージョンと $LATEST の関係として正しいものはどれか。","c":["番号付きバージョンはコードと設定が固定された不変のスナップショットで、$LATEST は更新され続ける可変の実体である","バージョンを発行すると $LATEST は削除される","バージョン番号は指定して発行できる","$LATEST は最新の発行済みバージョンを指すエイリアスである"],"a":"ア","et":"不変だからロールバックできる","eb":"publish_version はその時点のコードと設定を固定し、連番のバージョンとして切り出す。以後そのバージョンの中身は変更できず、番号を指定して発行することもできない。$LATEST は更新され続ける作業中の実体であり、これを本番で直接参照すると、意図しない更新がそのまま本番に反映される。エイリアスからバージョンを参照する形にすることで、切り替えと切り戻しがエイリアスの更新だけで済むようになる。"},{"i":"e10#10-6","g":"e10","n":"10-6","t":"エイリアスの重み付け","s":"エイリアスの RoutingConfig にある AdditionalVersionWeights の役割はどれか。","c":["複数のエイリアスに優先順位を付ける","エイリアスが指すバージョンとは別のバージョンへ、指定した割合で振り分ける（カナリア）","リージョン間でトラフィックを分散する","同時実行数をバージョン間で配分する"],"a":"イ","et":"エイリアス1つでカナリアが作れる","eb":"エイリアスは基本となる FunctionVersion を1つ持ち、AdditionalVersionWeights に別バージョンと重み（0〜1）を指定すると、その割合で新バージョンへ振り分けられる。0.1 を指定すれば10%が新バージョンに流れるカナリアになる。切り戻しは RoutingConfig を外すだけで完了するため、デプロイ手段としては最も軽い部類に入る。ただし新旧が同時に動く期間があるため、DBスキーマなど下流の互換性は前提条件になる。"},{"i":"e11#11-1","g":"e11","n":"11-1","t":"滞留数の3つの属性","s":"ApproximateNumberOfMessagesNotVisible が示すものはどれか。","c":["受信済みで可視性タイムアウト中（処理中）のメッセージ数","遅延配信の待機中メッセージ数","DLQに移動したメッセージ数","削除待ちのメッセージ数"],"a":"ア","et":"処理中か、待機中か、遅延中か","eb":"ApproximateNumberOfMessages は受信可能な待機中の数、NotVisible は受信済みでまだ削除されていない処理中の数、Delayed は遅延配信の待機中の数である。NotVisible が高止まりしている場合は、コンシューマが受信したまま処理を終えられていない、あるいは削除に失敗していることを示す。名前に Approximate が付くとおり分散システム上の概算値であり、厳密な在庫数として扱うべきではない点も重要である。"},{"i":"e11#11-2","g":"e11","n":"11-2","t":"受信から削除まで","s":"SQS で受信したメッセージを削除するために必要なものはどれか。","c":["MessageId","ReceiptHandle","QueueUrl と本文のハッシュ","MD5OfBody"],"a":"イ","et":"受信のたびに変わる一時的な値","eb":"delete_message には ReceiptHandle が必要で、これは受信操作ごとに発行される一時的な識別子である。MessageId はメッセージ自体の識別子であり削除には使えない。同じメッセージでも再受信すれば ReceiptHandle は変わるため、可視性タイムアウトが切れた後に古いハンドルで削除しようとすると失敗する。処理に時間がかかる場合は change_message_visibility でタイムアウトを延長する必要がある。"},{"i":"e11#11-3","g":"e11","n":"11-3","t":"DLQ再処理の危険","s":"DLQ再処理で「元キューへ送信 → DLQから削除」の順に処理している場合、送信成功後・削除前にプロセスが落ちるとどうなるか。","c":["DLQのメッセージが自動削除される","メッセージが失われる","DLQにメッセージが残るため、再実行すると元キューに同じメッセージが二重に入る","元キューへの送信が自動的に取り消される"],"a":"ウ","et":"冪等キーが必要になる理由の実例","eb":"送信と削除は別のAPI呼び出しであり、その間に落ちれば送信済みかつ削除前の状態が残る。再実行すれば同じメッセージがもう一度元キューへ送られ、二重処理が発生する。順序を逆にして先に削除すると、今度は送信前に落ちた場合にメッセージが失われる。どちらの順序でも完全な保証はできないため、最終的には受信側を冪等に作る（処理済みIDの記録、冪等キーの利用）ことでしか解決できない。"},{"i":"e11#11-4","g":"e11","n":"11-4","t":"可視性タイムアウト","s":"可視性タイムアウトの役割として正しいものはどれか。","c":["キューへの送信レートを制限する","DLQへ移動するまでの時間を決める","メッセージの保持期間を決める","受信されたメッセージを一定時間だけ他のコンシューマから見えなくし、重複処理を防ぐ"],"a":"エ","et":"短すぎると二重処理、長すぎると復旧が遅れる","eb":"受信されたメッセージは可視性タイムアウトの間だけ他のコンシューマから見えなくなり、その間に削除されなければ再び受信可能になる。処理時間よりタイムアウトが短いと、処理中に別のコンシューマが同じメッセージを受け取り二重処理になる。逆に長すぎると、処理に失敗したメッセージの再試行が遅れる。目安は処理時間のp99に余裕を足した値で、長時間処理では延長APIを併用する。"},{"i":"e11#11-5","g":"e11","n":"11-5","t":"SNS のメッセージ属性","s":"SNS の publish で MessageAttributes を付ける主な目的はどれか。","c":["サブスクリプションのフィルタポリシーで配信先を絞り込めるようにする","メッセージの配信順序を保証する","本文のサイズ上限を引き上げる","メッセージ本文を暗号化する"],"a":"ア","et":"属性がないとフィルタが効かない","eb":"フィルタポリシーはメッセージ属性に対して評価されるため、属性を付けずに発行すると、本文にどんな内容が入っていてもフィルタは一致しない。level や service といった属性を付けておけば、重大度の高い通知だけを特定のサブスクリプションへ流すといった振り分けができる。なお属性はメッセージ本文とは別枠で、サイズ上限（256KB）には両方が含まれる点に注意する。"},{"i":"e12#12-1","g":"e12","n":"12-1","t":"アイデンティティの種類","s":"SES の list_identities で指定できる IdentityType の組み合わせとして正しいものはどれか。","c":["Domain と EmailAddress","Sender と Receiver","Verified と Pending","Production と Sandbox"],"a":"ア","et":"検証の単位が2種類ある","eb":"SES では送信元をドメイン単位またはメールアドレス単位で検証する。ドメイン検証はDNSにレコードを追加する方式で、そのドメイン配下の任意のアドレスから送信できるようになる。アドレス検証は確認メールのリンクを踏む方式で、検証したアドレスからしか送れない。DKIM の検証状態はドメインIDに紐づく概念であり、アドレスIDしか登録していない環境では取得できない点が実務上のつまずきになる。"},{"i":"e12#12-2","g":"e12","n":"12-2","t":"送信クォータ","s":"get_send_quota が返す Max24HourSend と MaxSendRate の意味の組み合わせとして正しいものはどれか。","c":["24時間あたりの受信上限と、送信上限","24時間あたりの送信上限と、1秒あたりの送信上限","24時間あたりの送信上限と、1分あたりの送信上限","月あたりの送信上限と、1秒あたりの送信上限"],"a":"イ","et":"総量と瞬間レートは別々に効く","eb":"Max24HourSend は直近24時間のローリングウィンドウでの送信上限、MaxSendRate は1秒あたりの送信上限である。総量に余裕があっても瞬間的なレートを超えれば Throttling で拒否されるため、大量送信時は送信側でレート制御を行う必要がある。サンドボックス状態では上限が厳しく、かつ検証済みアドレス宛にしか送れない。SentLast24Hours と併せて使用率を監視しておくと上限到達を予見できる。"},{"i":"e12#12-3","g":"e12","n":"12-3","t":"レピュテーションの閾値","s":"SES のバウンス率と苦情率について、注意が必要とされる水準の組み合わせはどれか。","c":["バウンス率10%・苦情率5%","バウンス率0.5%・苦情率0.01%","バウンス率5%・苦情率0.1%","バウンス率1%・苦情率1%"],"a":"ウ","et":"苦情率の桁が2つ小さい","eb":"一般にバウンス率が5%、苦情率が0.1%に近づくと審査の対象になり、超え続ければ送信停止に至る。苦情率の基準がバウンス率より2桁厳しい点が特徴で、数千通に1件の苦情でも問題になりうる。バウンスの主因は宛先リストの陳腐化であり、退会処理の不備や古いリストの再利用が積み重なる。送信統計は自動的に監視されるわけではないため、定期取得してアラート化する運用が必要になる。"},{"i":"e12#12-4","g":"e12","n":"12-4","t":"サプレッションリスト","s":"アカウントレベルのサプレッションリストの役割として正しいものはどれか。","c":["送信元アドレスを検証する","送信レートを制限する","受信したメールを振り分ける","バウンスや苦情のあったアドレスへの送信を自動的に抑制し、レピュテーションの悪化を防ぐ"],"a":"エ","et":"送信しても抑制され課金もされない","eb":"サプレッションリストに載ったアドレス宛の送信は、SESが実際の配信を行わずに抑制する。バウンスを繰り返して評判を落とすことを防ぐ仕組みであり、ハードバウンスや苦情で自動登録されるほか、手動での追加・削除もできる。操作は SESv2 API（put_suppressed_destination / delete_suppressed_destination）で行う。退会したユーザーが再登録した場合など、正当に解除すべきケースがあるため、削除手段を持っておくことも運用上重要になる。"},{"i":"e13#13-1","g":"e13","n":"13-1","t":"手動スナップショットの絞り込み","s":"describe_db_snapshots で SnapshotType='manual' を指定する理由はどれか。","c":["自動バックアップのスナップショットを世代管理の対象から除外するため","手動スナップショットのほうが復元が速いため","自動スナップショットは取得できないため","手動スナップショットだけが暗号化されるため"],"a":"ア","et":"自動分はRDS側の保持期間が管理する","eb":"自動バックアップのスナップショットはRDSが保持期間の設定に従って管理し、利用者が削除することはできない。世代管理スクリプトでこれらを対象に含めると、削除しようとして失敗するか、そもそも意図と異なる対象を扱うことになる。manual を指定して自分で作ったものだけを対象にするのが正しい。なお手動スナップショットはDBインスタンスを削除しても残り続けるため、削除漏れがそのまま課金として残る点にも注意する。"},{"i":"e13#13-2","g":"e13","n":"13-2","t":"スナップショットの完了待ち","s":"create_db_snapshot の直後にスナップショットからの復元を試みると失敗する理由はどれか。","c":["APIの呼び出し間隔が短すぎるため","作成APIの成功は開始の受理にすぎず、available になるまで利用できないため","スナップショットは常に手動で有効化が必要なため","同じリージョンからは復元できないため"],"a":"イ","et":"db_snapshot_completed で待つ","eb":"スナップショットの作成はAPIが成功を返した時点では creating 状態であり、available になるまではサイズやDB負荷に応じた時間がかかる。db_snapshot_completed waiter でこの完了を待つ。所要時間はデータ量に比例するため、実測しておくとバックアップ運用や切り戻し手順の所要時間見積もりに直接使える。また作成中のDBインスタンスに対してスナップショットを要求すると InvalidDBInstanceState が返る。"},{"i":"e13#13-3","g":"e13","n":"13-3","t":"writer の特定","s":"Aurora クラスターのライターインスタンスを特定するために参照するフィールドはどれか。","c":["DBInstances の DBInstanceStatus","Endpoint の Address","DBClusterMembers の IsClusterWriter","DBClusters の Status"],"a":"ウ","et":"フェイルオーバー確認の核心","eb":"describe_db_clusters のレスポンスに含まれる DBClusterMembers は各インスタンスの情報を持ち、IsClusterWriter が True のものが現在のライターである。フェイルオーバーの成否は、この値が実行前と別のインスタンスに移ったかどうかで判定する。クラスターの Status だけを見ていると、切り替わる前に available のまま通過してしまう。アプリ側はクラスターエンドポイントを使っていれば接続先が自動的に追随するが、切り替わり中は一時的に接続エラーが出る。"},{"i":"e13#13-4","g":"e13","n":"13-4","t":"フェイルオーバーのターゲット指定","s":"failover_db_cluster で TargetDBInstanceIdentifier を指定する意味はどれか。","c":["指定したインスタンスを再起動する","指定したインスタンスを削除する","フェイルオーバーの所要時間を短縮する","どのリーダーインスタンスをライターに昇格させるかを明示的に制御する"],"a":"エ","et":"指定しなければAWSが選ぶ","eb":"ターゲットを指定しない場合、AWS がフェイルオーバー優先度（Promotion Tier）に基づいて昇格先を選ぶ。明示的に指定すれば、意図したインスタンスに切り替えられる。AZ をまたいだ切り替えを検証したい場合や、特定のインスタンスクラスに寄せたい場合に有効である。前提としてリーダーインスタンスが1つ以上必要で、シングルインスタンス構成ではフェイルオーバー自体ができない。"},{"i":"e14#14-1","g":"e14","n":"14-1","t":"VPC配下の絞り込み","s":"特定のVPCに属するサブネットだけを取得する方法として正しいものはどれか。","c":["describe_subnets(Filters=[{'Name': 'vpc-id', 'Values': [vpc_id]}])","describe_vpcs の Subnets キーを参照する","describe_subnets の結果を Python でフィルタするしかない","describe_subnets(VpcId=vpc_id)"],"a":"ア","et":"親子関係もFiltersで表す","eb":"EC2 系のAPIでは VpcId のような専用パラメータを持たず、Filters で vpc-id を指定する形になる。またサブネットやルートテーブルは describe_vpcs のレスポンスには含まれず、別のAPIで取得して紐づける必要がある。フィルタ名はハイフン区切り（vpc-id、availability-zone、tag:Name）で、レスポンスのキー名（VpcId）とは表記が異なる点が混同しやすい。"},{"i":"e14#14-2","g":"e14","n":"14-2","t":"パブリックサブネットの判定","s":"サブネットがパブリックかどうかをAPIから判定する方法として正しいものはどれか。","c":["サブネットの MapPublicIpOnLaunch が True かどうかだけで判定できる","関連付けられたルートテーブルに、インターネットゲートウェイ（igw-）向きのルートがあるかで判定する","サブネットの CidrBlock がグローバルIPかどうかで判定する","サブネット名に public が含まれるかで判定する"],"a":"イ","et":"IGW向きルートの有無が本質","eb":"パブリックサブネットの定義は、ルートテーブルに 0.0.0.0/0 → igw- のルートがあることである。MapPublicIpOnLaunch はパブリックIPを自動割り当てするかどうかの設定にすぎず、IGW向きルートがなければIPを持っていても外部と通信できない。逆に自動割り当てが無効でもEIPを付ければ通信できる。判定にはサブネットとルートテーブルの関連付け（明示的な関連付けがなければVPCのメインルートテーブル）を辿る必要がある。"},{"i":"e14#14-3","g":"e14","n":"14-3","t":"EKSノードグループの健全性","s":"describe_nodegroup で status が ACTIVE でも確認すべきフィールドはどれか。","c":["amiType","diskSize","health の issues","version"],"a":"ウ","et":"ACTIVEと健全は同義ではない","eb":"ノードグループの health.issues には、ノードがクラスターに参加できていない、権限が不足している、AMIが古いといった問題が code と message の組で入る。status が ACTIVE でも issues が空でないことがあり、両方を確認しないと問題を見落とす。またスケール設定（minSize / desiredSize / maxSize）と実際のノード数の乖離も併せて見る必要がある。EKSではコントロールプレーンのバージョンとノードのバージョンが乖離しすぎるとサポート外になるため、releaseVersion の確認も棚卸しの対象になる。"},{"i":"e15#15-1","g":"e15","n":"15-1","t":"send_command の非同期性","s":"send_command のレスポンスから直接得られないものはどれか。","c":["コマンドの標準出力","実行対象のインスタンスID","コマンドのステータス（受理時点）","CommandId"],"a":"ア","et":"出力は別APIで取りに行く","eb":"send_command は実行を受け付けた時点で CommandId を返すだけで、実行結果や標準出力は含まれない。結果は get_command_invocation に CommandId と InstanceId を渡して取得し、Status が Success / Failed / TimedOut / Cancelled のいずれかになるまでポーリングする。CommandId を失うと結果を取得する手段がなくなるため、必ず保持する。実行は非同期であり、呼び出しの成功はコマンドの成功を意味しない。"},{"i":"e15#15-2","g":"e15","n":"15-2","t":"Targets 指定","s":"send_command で InstanceIds ではなく Targets（タグ指定）を使う際の注意点はどれか。","c":["タグ指定では最大1台にしか実行できない","条件に一致するすべてのインスタンスが対象になるため、タグの付け方を誤ると想定外の台数に届く","タグ指定では実行結果を取得できない","タグ指定はLinuxインスタンスには使えない"],"a":"イ","et":"影響範囲が事前に見えない","eb":"Targets によるタグ指定は、実行時点で条件に一致するすべてのマネージドインスタンスに配信される。台数を明示しないため、タグの命名が曖昧だったり本番と検証で同じタグを使っていたりすると、意図しない環境にコマンドが届く。実行前に describe_instances を同じ条件で叩いて対象台数を確認する、MaxConcurrency と MaxErrors で段階的に流すといった安全策を組み合わせるのが実務的である。"},{"i":"e15#15-3","g":"e15","n":"15-3","t":"パッチコンプライアンス","s":"describe_instance_patch_states の MissingCount と NotApplicableCount の違いとして正しいものはどれか。","c":["両者は同じ意味である","Missing はセキュリティパッチ、NotApplicable は機能更新の数","Missing は適用対象だが未適用、NotApplicable はそのインスタンスに該当しないパッチの数","Missing は適用に失敗した数、NotApplicable は適用不要と判断された数"],"a":"ウ","et":"未適用と対象外を分けて数える","eb":"MissingCount はベースラインで承認されているが未適用のパッチ数であり、対応が必要な数を表す。NotApplicableCount は該当ソフトウェアが入っていないなどの理由で対象外となるパッチ数で、これが大きくても問題ではない。FailedCount は適用を試みて失敗した数で、こちらは個別の調査が必要になる。準拠判定は Missing と Failed がゼロかどうかで行い、NotApplicable は判定に含めない。"},{"i":"e16#16-1","g":"e16","n":"16-1","t":"サービス別の集計","s":"サービス別にコストを集計するための get_cost_and_usage の指定はどれか。","c":["GroupBy=[{'Type': 'DIMENSION', 'Key': 'SERVICE'}]","Filter={'Service': 'ALL'}","Granularity='SERVICE'","Metrics=['ServiceCost']"],"a":"ア","et":"GroupByは最大2つまで","eb":"GroupBy には DIMENSION（SERVICE、REGION、INSTANCE_TYPE など）と TAG が指定でき、最大2つまで並べられる。タグでグループ化できるということは、学習用リソースに専用タグを付けておけば、その分だけの費用を切り出せるということでもある。Granularity は DAILY / MONTHLY / HOURLY で集計の時間粒度を指定する別の軸であり、混同しやすい。"},{"i":"e16#16-2","g":"e16","n":"16-2","t":"コストの指標","s":"Metrics に指定する UnblendedCost の意味として正しいものはどれか。","c":["税込みの請求額","実際に発生した使用料をそのまま集計した額（組織内の按分を行わない）","予測コスト","リザーブドインスタンスを除いたコスト"],"a":"イ","et":"請求書の額と完全一致はしない","eb":"UnblendedCost は各アカウントで実際に発生した料金をそのまま集計したもので、一般的なコスト分析の既定値である。BlendedCost は組織全体のボリューム割引などを平均化して按分した額、AmortizedCost は前払いのリザーブド費用を期間で均した額で、目的によって使い分ける。いずれも税やクレジットの扱いが請求書と異なるため、請求額と完全に一致させたい場合は別の手段が必要になる。"},{"i":"e16#16-3","g":"e16","n":"16-3","t":"API の課金","s":"Cost Explorer API を扱ううえで運用上注意すべき点はどれか。","c":["呼び出しに管理者権限が必須である","結果はリアルタイムで反映される","リクエストごとに課金されるため、ループ内で細かく呼ばない","1日1回しか呼べない"],"a":"ウ","et":"コスト監視ツール自体がコストになる","eb":"Cost Explorer API は1リクエストあたり課金される数少ないAPIで、日次でサービス別・アカウント別に細かくループさせると、監視のための費用が無視できなくなる。必要な粒度でまとめて取得し、結果を自前で保持して差分を出す設計にする。またデータの反映には最大24時間程度かかり、有効化した直後は過去データも参照できない。前日比のような短い比較には向かない点も押さえておく。"},{"i":"e17#17-1","g":"e17","n":"17-1","t":"assume_role の戻り値","s":"assume_role が返す Credentials に含まれないものはどれか。","c":["RoleArn","AccessKeyId","SecretAccessKey","SessionToken"],"a":"ア","et":"SessionToken があるのが一時認証情報の印","eb":"Credentials に入るのは AccessKeyId、SecretAccessKey、SessionToken、Expiration の4つである。長期のアクセスキーと違い SessionToken が付くのが一時認証情報の特徴で、この3点セットを Session に渡すことで対象アカウントの client を作れる。Expiration は tz-aware な datetime で返り、キャッシュの有効判定に使える。RoleArn は呼び出し時に指定する引数であり、戻り値には AssumedRoleUser として別の形で含まれる。"},{"i":"e17#17-2","g":"e17","n":"17-2","t":"RoleSessionName","s":"RoleSessionName に意味のある名前を付けるべき理由はどれか。","c":["ロールの権限がセッション名で変わるため","CloudTrail の userIdentity に記録され、同じロールを使った操作の主体を区別できるため","セッション名が一致しないと assume できないため","セッション名によって有効期限が変わるため"],"a":"イ","et":"監査ログ上の唯一の手がかり","eb":"共有ロールを複数の人やツールが使う場合、CloudTrail 上ではどれも同じロールとして記録される。区別できるのは RoleSessionName だけであり、これが汎用的な文字列だと「誰がこの操作をしたか」を後から追えなくなる。担当者名、ツール名、チケット番号などを含めておくと監査証跡としてそのまま使える。さらに信頼ポリシーの条件でセッション名を制約することもできる。"},{"i":"e17#17-3","g":"e17","n":"17-3","t":"ExternalId","s":"assume_role の ExternalId について正しいものはどれか。","c":["クロスアカウントでは常に必須である","引き受ける側が任意に決めてよい識別子である","信頼ポリシー側で条件として要求されている場合に必須となり、一致しなければ AccessDenied になる","セッションの有効期限を延長する"],"a":"ウ","et":"混乱した代理人問題への対策","eb":"ExternalId はロール側の信頼ポリシーに sts:ExternalId の条件として書かれている場合にのみ必要で、一致しなければ引き受けられない。第三者ベンダのように多数の顧客のロールを引き受けうる立場に対して、顧客ごとに異なる秘密の識別子を要求することで、他社のロールを誤って（あるいは悪意で）引き受けることを防ぐ。自社内のアカウント間では通常使わない。"},{"i":"e17#17-4","g":"e17","n":"17-4","t":"DurationSeconds","s":"DurationSeconds に指定できる値について正しいものはどれか。","c":["指定しなければ12時間になる","短くするほど権限が制限される","常に最大12時間まで指定できる","ロール側の MaxSessionDuration が上限であり、それを超えるとエラーになる"],"a":"エ","et":"既定は1時間、ロールチェーンは最大1時間","eb":"指定できる範囲は900秒から、ロールに設定された MaxSessionDuration（既定3600秒、最大43200秒）までで、上限を超える値を指定するとエラーになる。省略時は3600秒である。またロールから別のロールを引き受けるロールチェーンでは、指定にかかわらず最大1時間に制限される。長時間バッチでは、期限を延ばすのではなく期限切れ前に取り直す仕組みを用意するのが正しい方向になる。"},{"i":"e17#17-5","g":"e17","n":"17-5","t":"自動リフレッシュ","s":"RefreshableCredentials を使う利点として正しいものはどれか。","c":["期限が近づくと裏側で自動的に再取得されるため、client を作り直さずに長時間使い続けられる","STSへのAPI呼び出しが不要になる","複数ロールを同時に引き受けられる","一時認証情報の有効期限そのものが延長される"],"a":"ア","et":"期限切れ例外を握りつぶすのとは違う","eb":"素朴な実装では、有効期限が切れるたびに assume_role をやり直し、client も作り直す必要がある。RefreshableCredentials は期限接近時に登録したコールバックを自動で呼び、認証情報を差し替えるため、同じ client を使い続けられる。長時間動き続けるバッチや常駐プロセスに向く。有効期限そのものが延びるわけではなく、裏側で取り直しているだけである点を理解しておくと、CloudTrail に定期的な AssumeRole が記録される理由も説明できる。"}]};
const KANA=["ア","イ","ウ","エ"];
const RANKS=[{k:"miss",n:"ミス"},{k:"jab",n:"ジャブ"},{k:"hit",n:"ヒット"},{k:"combo",n:"コンボ"}];
const KEY="sre-boto3-progress-v1";
let mem={}, useLS=true;
try{ const r=localStorage.getItem(KEY); mem=r?JSON.parse(r):{}; }catch(e){ useLS=false; mem={}; }
function save(){ if(!useLS) return; try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){ useLS=false; } }
const streak=id=>mem[id]||0;
const rankOf=id=>Math.min(streak(id),3);
const byGroup=g=>D.qs.filter(q=>q.g===g);
function tally(g){const t=[0,0,0,0];byGroup(g).forEach(q=>t[rankOf(q.i)]++);return t;}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S={group:D.groups[0].id,pat:"all",queue:[],cur:null,picked:null,before:0};

function bar(title,back){return `<div class="bar">${back?`<button class="back" data-nav="${back}">戻る</button>`:""}<h1>${esc(title)}</h1></div>`;}
function talHTML(t){return `<div class="tal">`+RANKS.map((r,i)=>`<span class="t-${r.k}"><em>${r.n}</em><b>${t[i]}</b></span>`).join("")+`</div>`;}

function home(){
  app.innerHTML=`<div class="hero"><p class="k">AWS SDK for Python</p>
  <h1>boto3 サンプル集<br>問題演習</h1>
  <p>全22 ジャンル／${D.qs.length}問</p></div>
  <div class="menu">
    <button data-nav="setup"><b>問題演習</b><span>ジャンルと出題パターンを選んで解く</span></button>
    <button data-nav="score"><b>学習成績</b><span>ランク別の達成状況を確認する</span></button>
  </div>`;
}

function setup(){
  const rows=D.groups.map(g=>{const t=tally(g.id);const n=S.pat==="all"?byGroup(g.id).length:byGroup(g.id).length-t[3];
    return `<button data-g="${g.id}" aria-pressed="${S.group===g.id}"><span class="nm">${esc(g.name)}</span><span class="ct">${n} / ${byGroup(g.id).length}問</span></button>`;}).join("");
  const t=tally(S.group);const cnt=S.pat==="all"?byGroup(S.group).length:byGroup(S.group).length-t[3];
  app.innerHTML=bar("出題設定","home")+`<div class="wrap">
  <h2 class="sec">ジャンル</h2><div class="glist">${rows}</div>
  <h2 class="sec">出題パターン</h2>
  <div class="seg"><button data-p="all" aria-pressed="${S.pat==="all"}">全て</button><button data-p="nc" aria-pressed="${S.pat==="nc"}">コンボを除く</button></div>
  <p class="hint">現在の出題対象：<b>${cnt}</b>問</p>
  <button class="start" ${cnt?"":"disabled"} data-nav="quiz">出題を開始する</button></div>`;
}

function pool(){const a=byGroup(S.group);return S.pat==="all"?a:a.filter(q=>rankOf(q.i)<3);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nextQ(){
  if(!S.queue.length){const p=pool();if(!p.length){S.cur=null;return;}S.queue=shuffle(p.slice());}
  S.cur=S.queue.pop();S.picked=null;S.before=rankOf(S.cur.i);
}

function quiz(){
  const g=D.groups.find(x=>x.id===S.group);
  const total=pool().length;const t=tally(S.group);
  if(!S.cur){
    app.innerHTML=bar("問題演習","setup")+`<div class="wrap">
    <div class="qhead"><div class="g">${esc(g.name)}</div><div class="n">総問題数 <b>0</b></div>${talHTML(t)}</div>
    <div class="done"><p class="big">コンプリート</p><p>このジャンルは全問コンボに到達しました。</p></div>
    <button class="next" data-nav="setup">出題設定に戻る</button></div>`;return;}
  const q=S.cur;const r=RANKS[rankOf(q.i)];
  const choices=q.c.map((c,i)=>{
    let cls="ch";
    if(S.picked!==null){ if(KANA[i]===q.a)cls+=" ok"; else if(KANA[i]===S.picked)cls+=" ng"; }
    return `<button class="${cls}" data-pick="${KANA[i]}" ${S.picked!==null?"disabled":""}><span class="kana">${KANA[i]}</span><span>${esc(c)}</span></button>`;}).join("");
  let verdict="";
  if(S.picked!==null){
    const ok=S.picked===q.a;const after=rankOf(q.i);
    verdict=`<div class="verdict ${ok?"ok":"ng"}">
      <p class="v">${ok?"正解":"不正解"}（正解：${q.a}）</p>
      <p class="rk">ランク：${RANKS[S.before].n} → ${RANKS[after].n}</p>
      <h3>${esc(q.et)}</h3><p class="exp">${esc(q.eb)}</p></div>
      <button class="next" data-next="1">次の問題</button>`;
  }
  app.innerHTML=bar("問題演習","setup")+`<div class="wrap">
  <div class="qhead"><div class="g">${esc(g.name)}</div><div class="n">総問題数 <b>${total}</b></div>${talHTML(t)}</div>
  <div class="meta"><span class="chip c-${r.k}">${r.n}</span><span>${esc(q.n)}</span><span>${esc(q.t)}</span></div>
  <p class="stem">${esc(q.s)}</p>
  <div class="choices">${choices}</div>${verdict}</div>`;
}

function score(){
  let tot=[0,0,0,0],totN=0;
  const rows=D.groups.map(g=>{const t=tally(g.id);const n=byGroup(g.id).length;totN+=n;t.forEach((v,i)=>tot[i]+=v);
    return `<tr><td>${esc(g.name)}</td><td>${n}</td><td class="s-combo">${t[3]}</td><td class="s-hit">${t[2]}</td><td class="s-jab">${t[1]}</td><td class="s-miss">${t[0]}</td></tr>`;}).join("");
  const opts=[`<option value="__all__">すべてのジャンル</option>`].concat(D.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`)).join("");
  app.innerHTML=bar("学習成績","home")+`<div class="wrap">
  <table class="score"><thead><tr><th>ジャンル</th><th>総数</th><th>コンボ</th><th>ヒット</th><th>ジャブ</th><th>ミス</th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td>合計</td><td>${totN}</td><td>${tot[3]}</td><td>${tot[2]}</td><td>${tot[1]}</td><td>${tot[0]}</td></tr></tfoot></table>
  <div class="tools"><h3>正答履歴のクリア</h3>
  <select id="clearScope">${opts}</select>
  <p class="hint" id="clearInfo"></p>
  <div class="row"><button class="btn danger" id="clearBtn">履歴を削除する</button></div></div>
  <div class="tools"><h3>履歴の書き出し／読み込み</h3>
  <div class="row"><button class="btn" id="expBtn">書き出し（JSON）</button>
  <button class="btn" id="impBtn">読み込み</button>
  <input type="file" id="impFile" accept="application/json" style="display:none"></div>
  <p class="note">${useLS?"履歴はこのブラウザのローカル領域に保存されます。サイトデータの削除やプライベートモードでは失われるため、定期的な書き出しを推奨します。":"このビューアではローカル保存が使えないため、履歴はページを閉じると失われます。ファイルをダウンロードしてブラウザで開くと保存されるようになります。"}</p></div>
  </div>`;
  const sc=document.getElementById("clearScope"),info=document.getElementById("clearInfo"),btn=document.getElementById("clearBtn");
  const targets=()=>{const v=sc.value;const list=v==="__all__"?D.qs:byGroup(v);return list.filter(q=>mem[q.i]!==undefined);};
  const refresh=()=>{const n=targets().length;info.textContent=`履歴が記録されている問題：${n}件`;btn.disabled=n===0;};
  sc.onchange=refresh;refresh();
  btn.onclick=()=>{const t=targets();if(!t.length)return;
    if(!confirm(`${t.length}件の正答履歴を削除します。よろしいですか。`))return;
    t.forEach(q=>delete mem[q.i]);save();score();alert(`${t.length}件の履歴を削除しました。`);};
  document.getElementById("expBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(mem,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="sre-boto3-progress.json";a.click();URL.revokeObjectURL(a.href);};
  document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);
      if(typeof o!=="object"||o===null||Array.isArray(o))throw 0;
      for(const k in o){if(typeof o[k]!=="number")throw 0;}
      mem=o;save();score();alert("履歴を読み込みました。");
    }catch(_){alert("形式が正しくありません。履歴は変更していません。");}};rd.readAsText(f);};
}

const views={home,setup,quiz,score};
function go(v){ if(v==="quiz"){S.queue=[];nextQ();} views[v](); }
app.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");
  if(nav){go(nav.dataset.nav);return;}
  const g=e.target.closest("[data-g]");
  if(g){S.group=g.dataset.g;setup();return;}
  const p=e.target.closest("[data-p]");
  if(p){S.pat=p.dataset.p;setup();return;}
  const pk=e.target.closest("[data-pick]");
  if(pk&&S.picked===null){
    S.picked=pk.dataset.pick;const q=S.cur;
    mem[q.i]=(S.picked===q.a)?Math.min(streak(q.i)+1,3):0;save();quiz();return;}
  if(e.target.closest("[data-next]")){nextQ();quiz();return;}
});
home();
</script>
</body></html>
