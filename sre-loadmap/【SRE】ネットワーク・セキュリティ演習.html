<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRE ネットワーク・セキュリティ 演習</title>
<style>
:root{--ink:#191d24;--sub:#5d6670;--paper:#fcfbf8;--shell:#1c242f;
--line:#ded9ce;--line2:#eeeae1;
--miss:#b0332a;--jab:#3d6aa6;--hit:#12796a;--combo:#a97a12;
--act:#12796a;--act-d:#0d5c50;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--shell);color:var(--ink);
font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{padding:20px 18px 56px}
.bar{background:var(--shell);color:#eef1f4;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.bar .back{background:none;border:1px solid #47535f;border-radius:3px;padding:4px 11px;font-size:13px;color:#cdd5dc}
.bar .back:hover{background:#2b3642}
.bar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
.hero{padding:44px 18px 28px;background:var(--shell);color:#f2f4f6}
.hero .k{font-size:13px;color:#8fa0ae;margin:0 0 10px}
.hero h1{margin:0;font-size:27px;line-height:1.35;font-weight:700}
.hero p{margin:14px 0 0;color:#a9b6c1;font-size:14px}
.menu{display:grid;gap:14px;padding:24px 18px 40px}
.menu button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--act);border-radius:3px;padding:20px}
.menu button:hover{border-color:var(--act);background:#f4faf8}
.menu b{display:block;font-size:19px;font-weight:700}
.menu span{display:block;color:var(--sub);font-size:13.5px;margin-top:4px}
h2.sec{font-size:13px;color:var(--sub);margin:26px 0 10px;font-weight:600}
h2.sec:first-child{margin-top:4px}
.glist{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.glist button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:12px 14px}
.glist button:last-child{border-bottom:0}
.glist button:hover{background:#f2f7f6}
.glist button[aria-pressed="true"]{background:#e7f2f0;box-shadow:inset 4px 0 0 var(--act)}
.glist .nm{flex:1;font-size:15px}
.glist .ct{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:11px 8px;font-size:14.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--act);color:#fff;font-weight:600}
.hint{font-size:13px;color:var(--sub);margin:8px 2px 0}
.start{margin-top:26px;width:100%;background:var(--act);color:#fff;border:0;border-radius:3px;padding:15px;font-size:16.5px;font-weight:700}
.start:hover{background:var(--act-d)}
.start:disabled{background:#b8bfc4;cursor:not-allowed}
.qhead{background:#fff;border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.qhead .g{font-size:14px;font-weight:700}
.qhead .n{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.qhead .n b{color:var(--ink);font-size:16px}
.tal{display:flex;width:100%;margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);gap:6px}
.tal span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:2px;background:#f7f5f0;border:1px solid var(--line2)}
.tal em{font-style:normal;font-size:11px;color:var(--sub);letter-spacing:.03em}
.tal b{font-size:16px;font-variant-numeric:tabular-nums;line-height:1.2}
.tal .t-miss b{color:var(--miss)}.tal .t-jab b{color:var(--jab)}
.tal .t-hit b{color:var(--hit)}.tal .t-combo b{color:var(--combo)}
.meta{margin:22px 2px 8px;font-size:12.5px;color:var(--sub);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:2px;color:#fff;letter-spacing:.04em}
.c-miss{background:var(--miss)}.c-jab{background:var(--jab)}
.c-hit{background:var(--hit)}.c-combo{background:var(--combo)}
.stem{font-size:16.5px;line-height:1.9}
.choices{display:grid;gap:9px;margin-top:20px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:3px;padding:13px 14px;font-size:15.5px;line-height:1.65}
.ch:hover:not(:disabled){border-color:var(--act);background:#f4faf8}
.ch:disabled{cursor:default;opacity:.72}
.ch .kana{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--sub);background:#f7f5f0}
.ch.ok{border-color:var(--hit);background:#e9f5f2;opacity:1}
.ch.ok .kana{background:var(--hit);border-color:var(--hit);color:#fff}
.ch.ng{border-color:var(--miss);background:#fbeceb;opacity:1}
.ch.ng .kana{background:var(--miss);border-color:var(--miss);color:#fff}
.verdict{margin-top:24px;border:1px solid var(--line);border-radius:3px;background:#fff;border-left-width:5px;padding:16px}
.verdict.ok{border-left-color:var(--hit)}
.verdict.ng{border-left-color:var(--miss)}
.verdict .v{font-size:18px;font-weight:700;margin:0 0 6px}
.verdict.ok .v{color:var(--hit)}
.verdict.ng .v{color:var(--miss)}
.verdict .rk{font-size:13px;color:var(--sub);margin:0 0 14px}
.verdict h3{font-size:15px;margin:14px 0 6px}
.exp{font-size:15px;line-height:1.9;margin:0}
.next{margin-top:22px;width:100%;background:var(--act);color:#fff;border:0;border-radius:3px;padding:14px;font-size:16px;font-weight:700}
.next:hover{background:var(--act-d)}
table.score{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.score th,table.score td{border:1px solid var(--line);padding:8px 6px;text-align:right;font-variant-numeric:tabular-nums}
table.score th:first-child,table.score td:first-child{text-align:left}
table.score thead th{background:var(--shell);color:#fff;font-size:12.5px;font-weight:600}
table.score tbody tr:nth-child(even){background:#f7f9fb}
table.score tfoot td{background:#eef3f7;font-weight:700}
.s-miss{color:var(--miss)}.s-jab{color:var(--jab)}
.s-hit{color:var(--hit)}.s-combo{color:var(--combo)}
.tools{margin-top:26px;border:1px solid var(--line);border-radius:3px;background:#fff;padding:16px}
.tools h3{font-size:14px;margin:0 0 10px}
select{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:3px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px 14px;font-size:14px}
.btn:hover{background:#f2f7f6}
.btn.danger{border-color:var(--miss);color:var(--miss)}
.btn.danger:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.note{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.7}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:26px;font-weight:700;color:var(--combo)}
</style></head>
<body><div id="app"></div>
<script>
const D = {"groups":[{"id":"n1","name":"第1部 1. トランスポート層（TCP/UDP）"},{"id":"n2","name":"第1部 2. 名前解決（DNS）"},{"id":"n3","name":"第1部 3. HTTP と上位プロトコル"},{"id":"n4","name":"第1部 4. TLS / PKI"},{"id":"n5","name":"第1部 5. 負荷分散・トラフィック制御"},{"id":"n6","name":"第1部 6. クラウドネットワーク設計"},{"id":"n7","name":"第1部 7. コンテナのネットワーク"},{"id":"n8","name":"第1部 8. ネットワーク可観測性"},{"id":"n9","name":"第1部 9. キャパシティ・制限値"},{"id":"s1","name":"第2部 1. アイデンティティ・アクセス管理"},{"id":"s2","name":"第2部 2. シークレット・鍵管理"},{"id":"s3","name":"第2部 3. サプライチェーン・CI/CD統制"},{"id":"s4","name":"第2部 4. 脆弱性・パッチ管理"},{"id":"s5","name":"第2部 5. ネットワーク境界防御"},{"id":"s6","name":"第2部 6. 監査ログ・脅威検知"}],"qs":[{"i":"n1#1-1","g":"n1","n":"1-1","t":"3ウェイハンドシェイク","s":"あるサーバへ接続を試みたところ、待たされることなく即座に Connection refused が返った。最初に疑うべき原因はどれか。","c":["経路上のセキュリティグループまたはNACLでパケットが破棄されている","宛先ホストの当該ポートでプロセスが待ち受けていない","NAT Gateway の送信元ポートが枯渇している","DNS の名前解決に失敗している"],"a":"イ","et":"速い失敗はアプリの問題、遅い失敗はネットワークの問題","eb":"パケットフィルタは通常、拒否を通知せずに黙ってドロップするため、遮断されている場合は無応答のまま再送を繰り返し「タイムアウト」になる。一方、即座に Connection refused（ECONNREFUSED）が返るということは、パケットが宛先ホストまで到達した上で OS が RST を返している証拠である。したがって疑うのはアプリの起動失敗、リッスンアドレスの誤り（127.0.0.1 のみでリッスン等）、ポート番号の誤りとなる。"},{"i":"n1#1-2","g":"n1","n":"1-2","t":"TIME_WAIT","s":"TCP の TIME_WAIT 状態が溜まるのはどちら側か。","c":["先に close を呼んだ側（能動クローズ側）","後から close を呼んだ側（受動クローズ側）","常にサーバ側","常にクライアント側"],"a":"ア","et":"TIME_WAIT は能動クローズ側に溜まる","eb":"TIME_WAIT は先に close を呼んだ側に残る。HTTP で Keep-Alive を使わない場合はレスポンス送信後にサーバが閉じるためサーバ側に、外部APIを大量に呼ぶ構成では呼び出し側に溜まる。溜まっている側が分かれば対処も決まり、サーバ側なら Keep-Alive の有効化、クライアント側ならコネクションプールの導入が第一手になる。2MSL 待つ理由は、最終ACK消失時の FIN 再送への応答と、遅延パケットが新しい接続へ誤配送されるのを防ぐためである。"},{"i":"n1#1-3","g":"n1","n":"1-3","t":"エフェメラルポート枯渇","s":"接続先が1つのDBに集中している構成でエフェメラルポートが枯渇しやすい理由として適切なものはどれか。","c":["宛先ポートが動的に変化するため","5タプルのうちクライアントが変えられるのが送信元ポートだけになるため","TIME_WAIT が発生しないため","MTU が小さくなるため"],"a":"イ","et":"5タプルの一意性から説明する","eb":"TCP接続は送信元IP・送信元ポート・宛先IP・宛先ポート・プロトコルの5つ組で一意に識別される。宛先が分散していれば同じ送信元ポートを再利用できるが、宛先が1つに集中すると変えられるのは送信元ポートだけとなり、既定範囲（32768-60999、約28,000）で頭打ちになる。TIME_WAIT のソケットも枠を占有するため実効上限はさらに早く訪れる。対処はポート範囲拡大よりも、接続生成自体を減らす Keep-Alive やコネクションプーリングを優先する。"},{"i":"n1#1-4","g":"n1","n":"1-4","t":"SNATポート枯渇","s":"NAT Gateway 経由の通信で送信元ポートの割り当てに失敗したことを検知できる CloudWatch メトリクスはどれか。","c":["ActiveConnectionCount","BytesOutToDestination","ErrorPortAllocation","PacketsDropCount"],"a":"ウ","et":"ErrorPortAllocation を監視項目に入れる","eb":"AWS/NATGateway 名前空間の ErrorPortAllocation は、送信元ポートの割り当てに失敗した回数を示す。0より大きい値が出た時点でアラームを上げる設定にする。NAT Gateway は同一の宛先IP・宛先ポートの組に対して約55,000接続が上限であり、単一の外部エンドポイントに集中するワークロードが最も枯渇しやすい。回避策は、宛先がAWSサービスならVPCエンドポイント、外部ならNAT Gateway増設、アプリを改修できるなら接続再利用である。"},{"i":"n1#1-5","g":"n1","n":"1-5","t":"コネクションプール","s":"コネクションプールが枯渇したとき、アプリケーション側に現れる典型的な症状はどれか。","c":["DBへの接続拒否エラーが多発する","プールから接続を取得する段階でのタイムアウトが発生する","DBのCPU使用率が100%に張り付く","名前解決に失敗する"],"a":"イ","et":"DBは元気なのにアプリだけ詰まる","eb":"プール枯渇はDBへの接続エラーではなく、プールから接続を取得する段階でのタイムアウトとして現れる。HikariCP なら Connection is not available, request timed out といったメッセージになる。紛らわしいのは、この状態でDBのCPUや接続数に余裕があることも多く、DBを見て「異常なし」と判断してしまいやすい点である。プールの待機キュー長やアクティブ接続数をメトリクス化しておくことが切り分けの鍵になる。"},{"i":"n1#1-6","g":"n1","n":"1-6","t":"Keep-Alive / アイドルタイムアウト","s":"アプリ側の Keep-Alive タイムアウトを ALB の idle timeout より短く設定した場合に起きやすい事象はどれか。","c":["低頻度でランダムに502が発生する","全リクエストが504になる","ヘルスチェックが全滅する","TLSハンドシェイクに失敗する"],"a":"ア","et":"アプリ側をLB側より長くするのが鉄則","eb":"ALBはバックエンドとの接続を再利用する。アプリ側のタイムアウトがALBより短いと、ALBがまだ生きていると思っている接続をアプリが先に閉じる。その直後にALBがその接続へリクエストを送るとRSTが返り、ALBは502を返す。この502は低頻度でランダムに発生するため原因究明が難しい。対策はアプリ側のKeep-AliveタイムアウトをALBのidle timeoutより明確に長く（+5〜10秒程度）設定することである。"},{"i":"n1#1-7","g":"n1","n":"1-7","t":"バックログ / SYNキュー","s":"accept キューが溢れた場合の挙動として正しいものはどれか。","c":["サーバのアプリケーションログにキュー溢れのエラーが記録される","クライアントには接続タイムアウトに見え、アプリには何も通知されない","クライアントに即座に RST が返る","カーネルが自動的にキュー長を拡張する"],"a":"イ","et":"アプリに通知されずログも残らない","eb":"acceptキューが溢れると、カーネルは既に完了したハンドシェイクの最終ACKを黙って破棄する（既定の tcp_abort_on_overflow=0 の挙動）。クライアントはサーバが受け取ったと思っているためしばらく待ってから再送し、最終的にタイムアウトする。サーバ側は accept 前の段階なのでアプリケーションには一切通知されずログも残らない。ss -ltn の Send-Q（キュー長上限）と Recv-Q（滞留数）、netstat -s のオーバーフロー統計を確認する。実際のキュー長は listen() の backlog と net.core.somaxconn の小さい方になる。"},{"i":"n1#1-8","g":"n1","n":"1-8","t":"輻輳制御・ウィンドウサイズ","s":"1 Gbps・RTT 100ms の経路で、帯域が空いているのにスループットが約5 Mbpsしか出ない。最も考えられる原因はどれか。","c":["MTUが小さすぎる","受信ウィンドウサイズが帯域遅延積より小さい","パケットロスが100%発生している","DNSキャッシュが古い"],"a":"イ","et":"帯域遅延積（BDP）で説明する","eb":"BDP = 帯域 × RTT であり、その経路上に同時に存在できるデータ量を表す。1 Gbps・RTT 100ms なら約12.5 MB。TCPは受信ウィンドウの分までしか未確認データを送れないため、ウィンドウが64KBしかなければ100msごとに64KBしか送れず、実効速度は約5 Mbpsにとどまる。対策はウィンドウスケーリングの有効化、並列転送、そしてRTTそのものを縮めること（CDNやリージョン配置の見直し）である。リージョン間の大容量転送が遅いという相談の多くはこれで説明できる。"},{"i":"n1#1-9","g":"n1","n":"1-9","t":"UDPの特性","s":"UDPでログを転送している構成で、欠損を検知するために最も適切な監視方法はどれか。","c":["送信側の件数と受信側の件数を突き合わせる","転送プロセスのエラーログを監視する","TCPの再送回数を監視する","DNSの応答時間を監視する"],"a":"ア","et":"静かにデータが減るので件数差で見る","eb":"UDPには再送も到達確認もないため、パケットが失われても送信側は成功したと認識し、エラーログにも何も出ない。ログ転送でこれが起きると、障害調査に使うログ自体が虫食いになるという最悪の形で影響し、しかも欠損に気づく手段がない。したがって監視は送った件数と受け取った件数を突き合わせる方式にする。受信側ホストで netstat -su の receive errors や buffer errors を見れば、カーネルのバッファ溢れによる欠損も検出できる。重要なログはTCPベースの転送に切り替えるのが根本対策である。"},{"i":"n2#2-1","g":"n2","n":"2-1","t":"レコード種別","s":"ゾーン頂点（example.com そのもの）に CNAME を置けない理由として正しいものはどれか。","c":["CNAMEはサブドメインでしか定義できないと規格で定められているため","CNAMEを持つ名前は他のレコードを持てず、頂点には必ずSOAとNSが必要なため","CNAMEのTTLが常に0になるため","CNAMEはIPv6に対応していないため"],"a":"イ","et":"CNAMEは他レコードと共存できない","eb":"CNAMEは「この名前は別名であり実体は別の名前にある」という宣言であるため、CNAMEを持つ名前は他のレコードを一切持てない（RFC 1034、RFC 2181）。一方、ゾーン頂点にはSOAレコードとNSレコードが必ず存在しなければならず、この2つとCNAMEは共存できない。サブドメインにはSOAもNSも不要なのでCNAMEを置ける。Route 53のALIASは規格上のレコード種別ではなく、権威サーバが問い合わせ時に内部で解決してAレコードとして返す実装上の機能であり、この制約を回避している。"},{"i":"n2#2-2","g":"n2","n":"2-2","t":"TTL","s":"切替作業のためTTLを3600秒から60秒に変更した。切替を実行してよいのはいつか。","c":["変更直後すぐ","旧TTL（3600秒）が経過した後","新TTL（60秒）が経過した後","翌月の同じ日"],"a":"イ","et":"TTLの変更自体も既存キャッシュには反映されない","eb":"あるリゾルバがTTL 3600でレコードをキャッシュした直後にTTLを60へ変更しても、そのリゾルバは残り3600秒間は古いレコードを保持し続ける。新しいTTL値を知るのはキャッシュが切れて再問い合わせしたときである。したがって「TTL変更が全リゾルバに行き渡った」と言えるのは旧TTLの時間が経過した後になる。安全側に倒すなら旧TTLの2倍程度を見る。作業前日にTTLを下げておく運用が一般的である。"},{"i":"n2#2-3","g":"n2","n":"2-3","t":"ネガティブキャッシュ","s":"DNSレコードを作成する前に動作確認で問い合わせてしまった。その後レコードを追加しても引けない原因はどれか。","c":["権威サーバの再起動が必要なため","NXDOMAIN応答がキャッシュされているため","TTLが長すぎるレコードを作成したため","ゾーンの委任が壊れているため"],"a":"イ","et":"ネガティブキャッシュはSOAのminimumで効く","eb":"「そのレコードは存在しない」というNXDOMAIN応答もキャッシュされる。その保持時間はゾーンのSOAレコードのminimumフィールドとSOA自身のTTLの小さい方で決まる（RFC 2308）。この挙動を知らないと「設定が間違っている」と思い込んで無駄な調査を始めてしまう。対処は待つか、別のリゾルバ（dig @権威サーバ や dig @8.8.8.8）で確認することである。"},{"i":"n2#2-4","g":"n2","n":"2-4","t":"リゾルバ / 権威サーバ","s":"dig @権威サーバ では新しい値が返るが、dig @8.8.8.8 では古い値が返る。この状況の判断として正しいものはどれか。","c":["設定が誤っているので再設定が必要","設定は正しく、リゾルバ側のキャッシュが切れるのを待てばよい","権威サーバの委任が壊れている","ゾーンファイルのシリアル番号を戻す必要がある"],"a":"イ","et":"両者の食い違いは浸透待ちの証拠","eb":"権威サーバが新しい値を返し、リゾルバが古い値を返している場合、設定は正しく浸透を待っている段階だと判断できる。この判定ができると、無用な設定の再確認や再変更を避けられる。逆に権威サーバ自体が古い値を返しているなら、設定が反映されていない、あるいは別のゾーンを編集しているといった自分側の問題になる。権威サーバは dig NS ドメイン名 で特定できる。"},{"i":"n2#2-5","g":"n2","n":"2-5","t":"アプリ側のDNSキャッシュ","s":"digでは新しいIPが引けるのに、JVMで動くアプリだけが古いIPへ接続し続ける。緊急時の対処として最も確実なものはどれか。","c":["レコードのTTLをさらに短くする","アプリケーションプロセスを再起動する","VPCのDHCPオプションセットを変更する","ALBのidle timeoutを延ばす"],"a":"イ","et":"DNSキャッシュは3階層に存在する","eb":"DNSのキャッシュはリゾルバ、OS、アプリケーションランタイムの3階層に存在しうる。JVMは historically セキュリティマネージャが有効な環境で networkaddress.cache.ttl の既定が -1（無期限）となり、一度解決したIPをプロセスの生存期間中ずっと保持し続ける。DNS側でいくらTTLを短くしても効果がない。緊急時は再起動が確実であり、恒久対策は networkaddress.cache.ttl を明示することである。ss -tan で実際の接続先IPを確認すれば切り分けられる。"},{"i":"n2#2-6","g":"n2","n":"2-6","t":"プライベートホストゾーン","s":"オンプレミスのDNSサーバから、AWSのプライベートホストゾーンの名前を解決できるようにするために必要なものはどれか。","c":["Route 53 Resolver の Inbound Endpoint","Route 53 Resolver の Outbound Endpoint","NAT Gateway","Transit Gateway のみ"],"a":"ア","et":"Inboundは入口、Outboundは出口","eb":"Inbound Endpoint はオンプレからAWS側の名前を解決するための入口であり、オンプレのDNSサーバからこのエンドポイントへ転送する。逆に Outbound Endpoint はAWS側からオンプレの名前を解決するための出口で、Resolver Rule で「このドメインはオンプレのDNSへ転送する」と定義する。双方向の解決が必要な場合は両方を構築するが、片方向で済む場合は必要な方だけでよい。なおプライベートホストゾーンの利用には VPC の enableDnsSupport と enableDnsHostnames が有効である必要がある。"},{"i":"n2#2-7","g":"n2","n":"2-7","t":"ヘルスチェック連動ルーティング","s":"Route 53 のヘルスチェックが間隔30秒・失敗閾値3回、レコードのTTLが60秒のとき、フェイルオーバー完了までの最悪時間はおよそどれか。","c":["約30秒","約60秒","約150秒","約600秒"],"a":"ウ","et":"切替時間 = 障害検知時間 + TTL","eb":"検知に30秒×3回で最大90秒、そこにTTLの60秒が加わるため、最悪で約150秒は旧系にトラフィックが流れ続ける。高速検知（間隔10秒）にすれば30秒+TTLまで縮まる。RTOを議論する際は、この計算値を根拠として示せることが重要である。加重ルーティングによる段階的移行でも、重みの変更はTTLに律速される点に注意する。"},{"i":"n2#2-8","g":"n2","n":"2-8","t":"名前解決の経路","s":"dig +trace を実行したところ、com. のTLDサーバの段階で対象ドメインのNSが返ってこなかった。疑うべき箇所はどれか。","c":["ゾーン内のAレコードの設定","ドメインの登録やレジストラ側のネームサーバ設定","アプリケーションのDNSキャッシュ","ALBのターゲットグループ設定"],"a":"イ","et":"どの段階で止まったかで切り分ける","eb":"dig +trace の出力はルートサーバ（.）→ TLDサーバ（com.）→ 権威サーバの順に、各段階のNSレコードと最終的なAレコードが並ぶ。TLDの段階でNSが返ってこなければドメインの登録やネームサーバ設定の問題、権威サーバに到達しているのにレコードが返らなければゾーン内のレコード設定の問題と切り分けられる。委任先のNSが古いまま（レジストラ側とゾーン側の不一致）というケースもここで見つかる。"},{"i":"n3#3-1","g":"n3","n":"3-1","t":"ステータスコードの切り分け","s":"ALBアクセスログで elb_status_code が 502、target_status_code が - になっていた。これが意味することはどれか。","c":["アプリケーションが502を返した","ALB自身がエラーを生成した","クライアントが接続を切った","WAFがブロックした"],"a":"イ","et":"target_status_code が - ならLB生成","eb":"target_status_code はバックエンドが返したコード、elb_status_code はALBがクライアントに返したコードである。通常は一致するが、target_status_code が - になっている場合はALB自身がエラーを生成したことを意味し、バックエンドまで到達していないか、到達しても正常な応答が得られなかったことになる。メトリクスでも HTTPCode_ELB_5XX_Count と HTTPCode_Target_5XX_Count のどちらが増えているかを見るのが5xx調査の起点になる。なおWAFによるブロックは403で返る。"},{"i":"n3#3-2","g":"n3","n":"3-2","t":"502 Bad Gateway","s":"デプロイのたびに502が発生する。原因として最も可能性が高い組合せはどれか。","c":["登録解除の遅延不足とアプリのgraceful shutdown未実装","証明書チェーンの配信漏れ","サブネットのIP枯渇","DNSのネガティブキャッシュ"],"a":"ア","et":"ALB側とアプリ側の両輪が必要","eb":"タスク停止時、ECSはターゲットグループからの登録解除を開始すると同時にコンテナへSIGTERMを送る。アプリがSIGTERMを受けて即座にプロセスを終了すると、処理中のリクエストが切断されて502になる。正しい実装はSIGTERMを受けたら新規受付を止め、処理中を完了させてから終了すること。加えて登録解除の遅延をアプリの最長処理時間より長く設定する必要がある。両方が揃って初めてデプロイ時の5xxがゼロになる。502の他の原因としてはタイムアウト値の逆転、不正なHTTPレスポンス、ヘッダのサイズ超過がある。"},{"i":"n3#3-3","g":"n3","n":"3-3","t":"503 Service Unavailable","s":"ALBが503を返している。最初に確認すべきメトリクスはどれか。","c":["TargetResponseTime","HealthyHostCount","NewConnectionCount","ProcessedBytes"],"a":"イ","et":"ヘルスチェック全滅か未登録かを判定する","eb":"ターゲットグループの HealthyHostCount を見る。0であれば全滅、そもそもターゲットが1つも登録されていなければ未登録である。UnHealthyHostCount と併せて推移を見ればどちらの状態にいつ遷移したかが分かる。全滅の場合、次に見るのはヘルスチェックの対象パスで、DB疎通まで確認する実装だとDB障害で全台が一斉にUnhealthyになる。なおアプリが自発的に返す503（メンテナンスモードやロードシェディング）は target_status_code も503になるため区別できる。"},{"i":"n3#3-4","g":"n3","n":"3-4","t":"504 Gateway Timeout","s":"504が発生した際、アプリ側のログに該当リクエストの処理完了記録が残っていた。この場合に疑うべきものはどれか。","c":["アプリがハングしている","ALBのidle timeout値とアプリの処理時間の関係","サブネットのルートテーブル","TLSの暗号スイート不一致"],"a":"イ","et":"処理完了記録の有無で調査先が変わる","eb":"ALBアクセスログの trace_id（X-Amzn-Trace-Id）でアプリログを検索し、処理完了の記録があるならアプリは応答したがALBが待ちきれなかった、つまりタイムアウト設定の問題である。記録がない、あるいは処理開始のみならアプリが本当にハングしている（DBロック待ち、外部API待ち、スレッド枯渇）。この分岐で調査先が完全に変わるため最初に確認すべき項目になる。健全な状態はアプリのp99がidle timeoutの半分以下に収まっていることである。"},{"i":"n3#3-5","g":"n3","n":"3-5","t":"HTTP/2 の多重化","s":"HTTP/2でTCPレベルのHead-of-Lineブロッキングが起きる理由はどれか。","c":["ストリームの優先度制御が無効なため","下層のTCPが順序保証のために再送を待つ間、その接続上の全ストリームが停止するため","ヘッダ圧縮が失敗するため","TLS 1.3が必須のため"],"a":"イ","et":"アプリ層は多重化、下層のTCPは1本","eb":"HTTP/2はアプリケーション層では多重化されているが、下層のTCPは1本のストリームである。パケットロスが起きると、TCPが順序を保証するために再送を待つ間、その接続上のすべてのストリームが停止する。これがTCPレベルのHead-of-Lineブロッキングであり、HTTP/3（QUIC）がUDPベースになったのはこの問題を解決するためである。また接続数が激減することでLBの分散が偏りやすくなる点も、HTTP/2運用上の注意点になる。"},{"i":"n3#3-6","g":"n3","n":"3-6","t":"gRPC","s":"gRPCを使った構成でスケールアウトしても新しいタスクに負荷が流れない。理由はどれか。","c":["LBが接続確立時に一度だけ振り分け先を決めるため","gRPCがUDPを使うため","ヘルスチェックが無効化されているため","TLS終端が行われていないため"],"a":"ア","et":"長寿命接続は振り分け先が固定される","eb":"gRPCはHTTP/2上で動作し、クライアントは接続を張りっぱなしにして使い続ける。LBが接続確立時に一度だけ振り分け先を決めるため、その後どれだけリクエストが流れても同じターゲットに集中する。特にスケールアウト時、新しく追加されたタスクには既存の接続が張られないためいつまでも空のままになる。対策はクライアント側ロードバランシング、サービスメッシュによる肩代わり、あるいは接続の最大生存時間を設定して定期的に張り直させることである。"},{"i":"n3#3-7","g":"n3","n":"3-7","t":"WebSocket","s":"WebSocket接続がALBのアイドルタイムアウトで切断される。アプリケーション側の回避策として適切なものはどれか。","c":["リクエストごとに新しい接続を張る","idle timeoutより短い間隔でPing/Pongフレームを送る","HTTP/1.0にダウングレードする","スティッキーセッションを有効にする"],"a":"イ","et":"Ping/Pongで接続をアイドルにしない","eb":"WebSocketは接続を維持するが、データが流れない時間が続くとLBがアイドルと判断して切断する（ALBの既定は60秒）。回避策はアプリケーションレベルで定期的にPing/Pongフレームを送ることで、間隔はidle timeoutより短く（60秒なら30秒程度）設定する。idle timeoutを延ばす設定も併用できる。またスケールイン時は長時間接続を登録解除の遅延では守り切れないため、自動再接続、ジッタ付きバックオフ、サーバ側に状態を持たない設計が論点になる。"},{"i":"n3#3-8","g":"n3","n":"3-8","t":"冪等性とリトライ","s":"非冪等なPOST処理に対して安全にリトライできるようにする仕組みはどれか。","c":["指数バックオフのみを実装する","冪等キー（Idempotency Key）を用いる","タイムアウト値を延ばす","HTTPメソッドをGETに変更する"],"a":"イ","et":"冪等キーで二重実行を防ぐ","eb":"冪等とは同じリクエストを何回実行しても結果が同じという性質である。GETは読み取りのみ、PUTは置き換え、DELETEは最終状態が変わらないため冪等だが、POSTは2回実行すれば2つ作られるため非冪等であり、安易なリトライは二重登録や二重課金を引き起こす。冪等キーはクライアントがリクエストごとに一意なキー（UUID等）を生成してヘッダに付与し、サーバがそれを記録して2回目以降は処理せず初回の結果を返す仕組みである。キーの保存期間と、初回処理完了前の再送に対する排他制御が実装上の注意点になる。"},{"i":"n3#3-9","g":"n3","n":"3-9","t":"X-Forwarded-For 等のヘッダ","s":"X-Forwarded-For を用いてIPベースのアクセス制御を行う場合の注意点として正しいものはどれか。","c":["先頭の値が常に真のクライアントIPなので、それを使えばよい","クライアントが値を偽装できるため、最前段のプロキシで既存ヘッダを破棄して上書きする必要がある","ALBは常に単一の値しか付けないので偽装の余地はない","このヘッダはTLS終端しない構成でも参照できる"],"a":"イ","et":"信頼できるのは自分が追記した部分だけ","eb":"X-Forwarded-For は経由したプロキシが末尾に追記していく形式で、クライアントは任意の値を付けてリクエストできる。プロキシがそれを尊重して追記するだけだと先頭には嘘のIPが並ぶ。信頼できるのは自分が管理するプロキシが追記した部分だけであり、「右から数えて信頼できるプロキシの数だけ遡った位置」が実質的なクライアントIPになる。アクセス制御や監査ログに使う場合は、最前段で既存ヘッダを破棄し自分が観測した接続元で上書きする設定が必須である。"},{"i":"n4#4-1","g":"n4","n":"4-1","t":"TLSハンドシェイク","s":"TLS接続時に no shared cipher というエラーが出た。原因はどれか。","c":["証明書の有効期限切れ","双方に共通する暗号スイートが存在しない","SNIが送られていない","中間CA証明書の配信漏れ"],"a":"イ","et":"バージョン不一致か暗号スイート不一致かを判別する","eb":"protocol version を含むエラーならバージョン不一致で、クライアントが提示した最高バージョンをサーバが受け付けていない。handshake failure や no shared cipher なら暗号スイート不一致で、双方に共通のスイートが1つもない。判別後はどちら側を変えるかを決めるが、古いクライアントを救うためにサーバ側を緩めるのは他の利用者のセキュリティを下げる判断なので、影響範囲を測ってから行う。openssl s_client -connect で使用プロトコルと暗号スイートを確認できる。"},{"i":"n4#4-2","g":"n4","n":"4-2","t":"証明書チェーン","s":"あるHTTPSサイトがブラウザでは正常に表示されるが、curlやJavaのHTTPクライアントからは証明書検証に失敗する。原因として最も可能性が高いものはどれか。","c":["中間CA証明書の配信漏れ","サーバ証明書の有効期限切れ","TLS 1.3が無効","SNIの未対応"],"a":"ア","et":"ブラウザはAIAで中間証明書を補完する","eb":"ブラウザはAIA（Authority Information Access）拡張を見て中間証明書を自動で取得しにいく、あるいは過去に取得した中間証明書をキャッシュしているため、配信漏れがあっても通ってしまう。curlやJavaのHTTPクライアントは原則これを行わないためチェーンが繋がらず検証に失敗する。「ブラウザで確認したから大丈夫」が通用しない典型例であり、openssl s_client -showcerts で subject と issuer の連鎖が途切れていないか必ず確認する。"},{"i":"n4#4-3","g":"n4","n":"4-3","t":"SNI","s":"SNIに対応していない古いクライアントからHTTPS接続した場合の挙動はどれか。","c":["接続が必ず拒否される","サーバの既定証明書が返り、ホスト名不一致エラーになることがある","自動的にHTTPへフォールバックする","ワイルドカード証明書が自動生成される"],"a":"イ","et":"SNIがないとサーバは判断できない","eb":"SNIはClientHelloに接続先ホスト名を含める拡張である。これがないとサーバはどの証明書を出すべきか判断できず、設定上の既定証明書を返す。結果としてクライアント側で「証明書のホスト名が一致しない」エラーになる。古い組み込み機器や一部のバッチ処理で今も遭遇する。openssl s_client の -servername オプションの有無で返る証明書が変わることを実際に確認しておくとよい。"},{"i":"n4#4-4","g":"n4","n":"4-4","t":"証明書の有効期限","s":"証明書の期限切れ障害を防ぐうえで見落とされやすい監視対象はどれか。","c":["ACMで管理している公開向け証明書","CloudFrontのディストリビューション証明書","内部通信用の自己署名証明書やmTLSのクライアント証明書","ALBのリスナー証明書"],"a":"ウ","et":"内部向け証明書は自動更新の仕組みがない","eb":"公開向け証明書はACM等で自動更新されることが多く事故が起きにくい。一方、内部通信用に手作業で発行した証明書は自動更新の仕組みがなく、失効に気づくのが本番障害時になりやすい。mTLS用のクライアント証明書、内部LB用の証明書、Kubernetes関連の証明書などを一覧化し、同じ監視の網に入れる。監視は30日前に警告、7日前に緊急の二段階が実務的である。"},{"i":"n4#4-5","g":"n4","n":"4-5","t":"ACM / 自動更新","s":"ACMのDNS検証で発行した証明書の自動更新が失敗する原因として代表的なものはどれか。","c":["検証用CNAMEレコードを削除してしまった","リスナーのセキュリティポリシーが古い","証明書のキーサイズが2048bitである","CloudFrontを経由していない"],"a":"ア","et":"検証用CNAMEは恒久的に残す","eb":"ACMはDNS検証を使う場合、更新のたびに検証用CNAMEレコードの存在を確認する。「発行できたからもう不要」と削除すると次回更新時に検証できず失敗する。期限切れ障害の典型的な原因なのでこのレコードは恒久的に残す。また、ACMのパブリック証明書は秘密鍵を取り出せず、ALB・CloudFront・API Gateway等の統合サービスでしか使えない。EC2上のnginx等で使う場合はACM Private CAや外部CAが必要になる点も設計段階で押さえておく。"},{"i":"n4#4-6","g":"n4","n":"4-6","t":"mTLS（相互TLS）","s":"mTLSを導入する際に最も運用負荷となりやすいものはどれか。","c":["サーバ証明書の取得","クライアント証明書の配布・更新・失効","TLSバージョンの選定","暗号スイートの選定"],"a":"イ","et":"ライフサイクル管理まで含めて設計する","eb":"mTLSではサーバがCertificateRequestを送り、クライアントも証明書を提示してサーバが検証する双方向の認証になる。パスワードやトークンを使わない強固なクライアント認証が利点だが、証明書の数だけ発行・配布・更新・失効の運用が発生する。特に失効はCRLやOCSPの仕組みを用意しないと漏洩した証明書を無効化できず難しい。クライアント数が多い場合、この運用を自動化する基盤（サービスメッシュや証明書管理基盤）が事実上必須になる。"},{"i":"n4#4-7","g":"n4","n":"4-7","t":"TLS終端位置","s":"ALBでTLS終端せずパススルーする構成の代償として正しいものはどれか。","c":["クライアントIPが取得できなくなる","WAFによるL7検査やパスベースのルーティング、詳細なアクセスログが使えなくなる","証明書の更新が自動化できなくなる","ヘルスチェックが実行できなくなる"],"a":"イ","et":"暗号化と監視性のトレードオフ","eb":"LBで終端すればHTTPヘッダやパス、ボディが見えるためWAFによるL7検査、パスベースのルーティング、詳細なアクセスログが可能になる。終端せずパススルーするとLBからはTCPストリームしか見えず、WAFは使えずログもL4の情報に限られる。「暗号化したいからパススルー」が監視性を大きく損なうというトレードオフを理解しておく。なおVPC内だから平文でよいとは限らず、データの機密度、準拠基準、脅威モデルから判断する。"},{"i":"n4#4-8","g":"n4","n":"4-8","t":"暗号スイート / TLSバージョン","s":"TLS 1.0/1.1 を廃止する前に確認すべきこととして最も適切なものはどれか。","c":["ALBアクセスログの ssl_protocol からクライアントのTLSバージョン分布を集計する","証明書のキーサイズを確認する","ターゲットグループの登録数を確認する","Route 53のTTLを短縮する"],"a":"ア","et":"分布を見ずに切ると特定顧客が繋がらなくなる","eb":"ALBアクセスログには ssl_protocol フィールドがあり、Athenaで GROUP BY すれば分布が出る。TLS 1.0/1.1 のアクセスが一定数あるなら、どのクライアントかを user_agent や client_ip で特定してから廃止時期を調整する。分布を見ずに切ると特定の顧客だけ繋がらなくなる事故になる。現在許容しているバージョンはリスナーのSSLセキュリティポリシー名（例：ELBSecurityPolicy-TLS13-1-2-2021-06）から読み取れる。"},{"i":"n5#5-1","g":"n5","n":"5-1","t":"ALB と NLB の違い","s":"相手先のファイアウォールに接続元IPを登録してもらう必要がある。選定すべきロードバランサはどれか。","c":["ALB","NLB","CLB","Gateway Load Balancer"],"a":"イ","et":"要件から選定理由を説明できることが重要","eb":"NLBを選ぶのは、固定IPが必要（相手先のファイアウォールにIP登録する場合）、TCP/UDPでHTTP以外を扱う、極めて低いレイテンシが要る、極端に高いスループットが要る、といったケースである。ALBを選ぶのはパスやホスト名で振り分けたい、WAFを適用したい、認証機能を使いたい、HTTPレベルの詳細なアクセスログが要る場合。迷ったらALBが既定という整理で実務はほぼ足りる。NLBは既定でクライアントIPが保持される点もALBとの挙動差になる。"},{"i":"n5#5-2","g":"n5","n":"5-2","t":"ヘルスチェック設計","s":"ロードバランサのヘルスチェックのパスでDB疎通まで確認する実装にした場合の弊害はどれか。","c":["ヘルスチェックの間隔が自動的に延びる","DB障害時に全ターゲットが一斉にUnhealthyになり503になる","ターゲットの登録解除ができなくなる","TLS終端が行えなくなる"],"a":"イ","et":"生存確認と依存先確認は分ける","eb":"DB疎通を含めると、DB障害時に全ターゲットが一斉にUnhealthyになりALBが503を返す。個別タスクの異常とシステム全体の異常を区別できなくなる。推奨は2系統に分けることで、ロードバランサ用のヘルスチェックは「このプロセスが生きているか」だけを見る浅いものにし、DB等の依存先確認は別のエンドポイントで監視ツールが見る。Kubernetesのliveness / readinessの分離と同じ発想である。なお検知までの最短時間は間隔×異常閾値で計算できる。"},{"i":"n5#5-3","g":"n5","n":"5-3","t":"コネクションドレイニング","s":"登録解除の遅延（deregistration delay）を設定する際の基準として適切なものはどれか。","c":["常に既定の300秒のままにする","アプリの最長処理時間より長く設定する","ヘルスチェック間隔と同じ値にする","0秒にして即座に切り離す"],"a":"イ","et":"猶予が切れると処理中が切られる","eb":"遅延時間が処理時間より短いと、猶予が切れた時点でALBが接続を強制的に閉じるため処理中のリクエストが切られる。既定値は300秒だが、短いAPIしか持たないサービスでは長すぎてデプロイが遅くなり、逆にバッチ的な長時間処理があるサービスでは足りない。p99の処理時間に余裕を足した値を設定するのが基本である。アプリ側のgraceful shutdownと併せて初めてデプロイ時の5xxがゼロになる。"},{"i":"n5#5-4","g":"n5","n":"5-4","t":"スティッキーセッション","s":"スティッキーセッションを使わずに済ませるための第一選択はどれか。","c":["ターゲット数を増やす","セッション状態を外部ストア（Redis等）に置く","ヘルスチェックを緩和する","TLS終端をバックエンドに移す"],"a":"イ","et":"恒久設計としてスティッキーは選ばない","eb":"スティッキーセッションを有効にすると、一度割り当てられたクライアントは同じターゲットに固定されるため、新しく追加したターゲットには既存クライアントが流れてこない。スケールアウトしても既存の負荷は分散されず、ターゲット障害時にはセッションも失われる。セッション状態をアプリのメモリではなく外部ストアに置けばどのターゲットが受けても処理でき、スケールアウトもローリング更新も自由になる。既存アプリの延命策として使うのは妥当だが、恒久設計としては選ばないという判断が重要である。"},{"i":"n5#5-5","g":"n5","n":"5-5","t":"ターゲットグループ / 振り分けアルゴリズム","s":"リクエストごとの処理時間のばらつきが大きいワークロードで有効な振り分けアルゴリズムはどれか。","c":["ラウンドロビン","最小未処理リクエスト数（LOR）","送信元IPハッシュ","ランダム"],"a":"イ","et":"ばらつきの有無で選ぶ","eb":"ラウンドロビンは順番に均等配分するためリクエスト数は揃うが負荷は揃わない。重い処理を引いたターゲットにさらに次のリクエストが回り、処理待ちが積み上がる。最小未処理リクエスト数はその時点で処理中の件数が最も少ないターゲットに送るため、詰まっているターゲットには送られなくなり、処理時間のばらつきが大きいワークロードで有効である。処理時間が均一なワークロードでは差がほとんど出ない。"},{"i":"n5#5-6","g":"n5","n":"5-6","t":"リトライとサーキットブレーカ","s":"各層が3回までリトライする3層構成で、最悪の場合に最下層へ届くリクエスト数は元の何倍になるか。","c":["3倍","9倍","27倍","81倍"],"a":"ウ","et":"多段リトライは掛け算で増える","eb":"3×3×3 = 27倍になる。4層なら81倍である。対策はリトライを行う層を1箇所に限定することで、一般には最も外側か最も内側の1箇所に寄せる。加えてリトライ回数の上限とリトライ予算（全リクエストのうちリトライが占める割合の上限）を設ける。リトライストームは、リトライ自体が負荷源となって元の原因が解消しても障害が終わらないという正のフィードバックを生むため、回復を妨げる点が最も厄介である。指数バックオフにはジッタを加えて波を平らにする。"},{"i":"n5#5-7","g":"n5","n":"5-7","t":"タイムアウトの階層設計","s":"タイムアウト値が「クライアント < LB < アプリ < DB」と逆転している場合に起きることはどれか。","c":["リクエストが一切処理されなくなる","外側が先に諦め、内側は処理を続けたままリソースを占有し続ける","ヘルスチェックが必ず失敗する","TLSハンドシェイクが失敗する"],"a":"イ","et":"外側ほど長く、内側ほど短くする","eb":"外側が先に諦めると、内側は処理を続けたままリソースを占有し続ける。クライアントには既にエラーを返しているのにDBクエリやスレッドは動き続け、負荷時にはこれが積み上がってリソース枯渇を招く。さらにクライアントがリトライすると、捨てられた処理と新しい処理が二重に走り不整合の原因にもなる。担当システムの各層の値を書き出して逆転がないか点検する習慣をつける。"},{"i":"n5#5-8","g":"n5","n":"5-8","t":"ブルーグリーン / カナリアデプロイ","s":"カナリアデプロイを行う際に必須となる前提条件はどれか。","c":["新旧バージョンが同時に動作するため、DBスキーマの互換性を維持すること","切替期間中にリソースを2倍確保すること","セッションをスティッキーにすること","TLS終端をバックエンドで行うこと"],"a":"ア","et":"新旧の並存期間が長いことが特徴","eb":"ブルーグリーンは新旧の完全な環境を2つ用意して一括で切り替えるため、切り戻しが一瞬で済む反面リソースが2倍必要になる。カナリアは新バージョンに少量のトラフィックを流して比率を上げていくため追加リソースは少量で済むが、新旧が同時に動く期間が長く、DBスキーマの互換性維持が必須になる。いずれの方式でも、切り戻しにかかる実測時間を把握しておくことが障害時の実質的なMTTRの根拠になる。"},{"i":"n5#5-9","g":"n5","n":"5-9","t":"バックプレッシャ","s":"流入が処理能力を超えた状態で、被害を最小化する設計として適切なものはどれか。","c":["キュー長を無制限にして全リクエストを受け付ける","キュー長に上限を設け、溢れたら即座にエラーを返す","タイムアウト値を無制限にする","リトライ回数を増やす"],"a":"イ","et":"待たせて失敗させるより早く失敗させる","eb":"キューに上限がないと待ち時間が際限なく伸び、やがてキューの先頭にあるリクエストはクライアントが既にタイムアウトして諦めた後のものになる。処理しても誰も受け取らない仕事だけをやり続ける状態になり、流入を止めるまで回復しない。キュー長に上限を設けて溢れたら即座にエラーを返すロードシェディングが基本形である。加えて滞留時間が一定を超えたリクエストは処理前に破棄し、上流にはレートリミットで入口を絞る。"},{"i":"n6#6-1","g":"n6","n":"6-1","t":"VPC / サブネット設計","s":"/24 のサブネットで実際に利用できるIPアドレスの数はいくつか。","c":["256","254","251","250"],"a":"ウ","et":"AWSは各サブネットで5つ予約する","eb":"AWSはネットワークアドレス、VPCルータ、AWS提供DNS、将来用の予約、ブロードキャストアドレスの5つを予約するため、/24 では256ではなく251しか使えない。/28 なら11個であり、小さいサブネットでは予約の割合が大きく響く。必要IP数は「平常時の最大タスク数 + ローリング更新中の一時増分 + スパイク時の余裕 + 予備」から逆算する。CIDR設計は後から変えにくいので設計段階で余裕を見ておく。"},{"i":"n6#6-2","g":"n6","n":"6-2","t":"ルートテーブル","s":"ルートテーブルに 0.0.0.0/0 と 10.0.0.0/16 の両方がある場合、10.0.1.5 宛ての通信が選ぶ経路はどれか。","c":["0.0.0.0/0 のルート","10.0.0.0/16 のルート","先に登録された方","両方に複製される"],"a":"イ","et":"最長一致の原則","eb":"複数のルートが該当する場合、プレフィックス長が最も長い（範囲が狭い）ルートが選ばれる。この原則を理解していないと「0.0.0.0/0 をNAT Gatewayに向けたのに一部の通信だけ別経路を通る」といった挙動を説明できない。疎通不可時の点検は SG → NACL → ルートテーブル → 宛先側SG/NACL → 宛先のリッスン状態、の順で行うと絞り込みやすい。"},{"i":"n6#6-3","g":"n6","n":"6-3","t":"セキュリティグループ / NACL","s":"NACLを使う際に、戻り通信のためにインバウンドで 1024-65535 の許可が必要になる理由はどれか。","c":["NACLがステートレスで、行きと戻りを別々に評価するため","NACLがセキュリティグループより優先されるため","エフェメラルポートが固定されているため","NACLがIPv6のみを扱うため"],"a":"ア","et":"SGはステートフル、NACLはステートレス","eb":"NACLはステートレスであり行きと戻りを別々に評価する。行きでポート443への送信を許可しても、戻りのパケット（送信元443、宛先はクライアントのエフェメラルポート）は別ルールで評価されるため、インバウンド側でエフェメラルポート範囲の許可を入れないと応答だけが落ちる。SGはステートフルなのでこの設定は不要である。またSGは許可のみ、NACLはDenyも書けるため、特定IPの緊急遮断にはNACLが向く。"},{"i":"n6#6-4","g":"n6","n":"6-4","t":"NAT Gateway","s":"NAT Gateway を1つのAZにのみ配置し、全AZのルートテーブルをそこへ向けている構成のリスクはどれか。","c":["データ処理料金が2倍になる","そのAZが障害を起こすと他AZのタスクも外部通信ができなくなる","SNATポートが枯渇しなくなる","VPCエンドポイントが使えなくなる"],"a":"イ","et":"NAT GatewayはAZ内のリソース","eb":"NAT GatewayはAZ内のリソースである。1つのAZにのみ配置して全AZのルートテーブルをそこへ向けていると、そのAZが障害を起こした瞬間に他AZのタスクも外部通信ができなくなり、マルチAZでタスクを分散した意味が失われる。各AZにNAT Gatewayを置き、そのAZのルートテーブルは自AZのものを向けるのが原則である。なおNAT Gatewayは時間課金に加えデータ処理料金もかかるため、AWSサービス宛てはVPCエンドポイントに寄せるとコストも削減できる。"},{"i":"n6#6-5","g":"n6","n":"6-5","t":"VPCエンドポイント","s":"Gateway型のVPCエンドポイントが対象とするサービスと課金の組合せとして正しいものはどれか。","c":["S3とDynamoDB、無料","全AWSサービス、無料","S3とDynamoDB、ENI時間課金あり","全AWSサービス、ENI時間課金あり"],"a":"ア","et":"Gateway型は無料、Interface型は有料","eb":"Gateway型はS3とDynamoDBのみが対象で、ルートテーブルにエントリを追加する方式であり無料である。Interface型はサブネットにENIを作成しプライベートIPでサービスに接続する方式で、多くのAWSサービスに対応するがENIごとの時間課金とデータ処理料金がかかる。エンドポイント導入によりNAT Gatewayのデータ処理料金削減とSNATポート枯渇回避の両方が同時に得られるため、S3やECRへの大量転送がある構成では効果が大きい。"},{"i":"n6#6-6","g":"n6","n":"6-6","t":"Transit Gateway / VPCピアリング","s":"VPC-A と VPC-B、VPC-B と VPC-C がピアリングされているとき、A から C への通信はどうなるか。","c":["Bを経由して通信できる","通信できない","ルートテーブルの設定次第で通信できる","NAT Gatewayがあれば通信できる"],"a":"イ","et":"ピアリングは推移的ルーティング不可","eb":"VPCピアリングは1対1の関係であり、Bを経由した中継を行わない。A-Cの通信が必要ならA-Cのピアリングを別途張る必要があり、VPCがn個あると必要な接続数は n(n-1)/2 で増えていく。4〜5個を超えたあたりからメッシュ管理が現実的でなくなるため、ハブアンドスポーク型で中継できるTransit Gatewayへの移行を検討する。ただしTransit Gatewayはアタッチメントとデータ転送で課金されるため、VPCが2〜3個ならピアリングの方が安い。"},{"i":"n6#6-7","g":"n6","n":"6-7","t":"ハイブリッド接続","s":"Direct Connect + VPNバックアップ構成で、事前に確認しておくべきことはどれか。","c":["VPN経由の縮退運転で業務が回るか（帯域と遅延の劣化）","VPNがDXより高速であること","DXが自動でVPNに置き換わらないこと","VPNがIPv6のみに対応していること"],"a":"ア","et":"縮退時の帯域と遅延の劣化を見込む","eb":"DX単独は最も安いが回線障害で全断し、DX冗長化は可用性が最も高いがコストも2倍になる。DX+VPNバックアップは中間の構成で、通常はDXの広帯域・低遅延を使い障害時はインターネット経由のVPNに切り替わる。ただしバックアップ時は帯域と遅延が劣化するため、縮退運転で業務が回るかを事前に確認しておく必要がある。可用性要件とコストのバランスから3構成を比較できるようにしておく。"},{"i":"n6#6-8","g":"n6","n":"6-8","t":"マルチAZ / マルチリージョン","s":"2AZ構成で1AZ障害に耐えるために、平常時の各AZの使用率はどの程度に抑えるべきか。","c":["50%以下","67%以下","80%以下","90%以下"],"a":"ア","et":"1AZ喪失時に残りが全量を引き受ける","eb":"2AZ構成なら1AZ障害時に残り1AZが100%を引き受けるため、各AZは平常時50%以下の使用率で運用する必要がある。3AZなら1AZ喪失時に残り2AZで捌くため各AZ67%以下で済む。オートスケールがあるから大丈夫とは限らず、スケールアウトには数分かかるためその間の急激な負荷増に耐えられるかを別途確認する。マルチリージョン化はコストと複雑性が大きく増すため、まずマルチAZで足りるかをRTO/RPOから検討するのが順序である。"},{"i":"n7#7-1","g":"n7","n":"7-1","t":"awsvpcモード","s":"平常時60タスクのサービスで maximumPercent を200に設定している。サブネット設計で見込むべきIP消費数はどれか。","c":["60","90","120","180"],"a":"ウ","et":"ローリング更新中は新旧タスクが並存する","eb":"awsvpcモードではタスク1つにつきENIが1つ、プライベートIPが1つ割り当てられる。maximumPercent が200なら更新中はタスク数が最大2倍になるため、平常時60タスクなら更新中は120個のIPが必要になる。平常時の値だけで設計するとデプロイのたびに失敗する。複数サービスが同じサブネットを共有していれば合算で計算し、EC2やRDS、Interface型VPCエンドポイントもIPを消費する点を忘れない。"},{"i":"n7#7-2","g":"n7","n":"7-2","t":"ENI上限 / IP枯渇","s":"サブネットのIP枯渇でECSタスクが起動できないとき、最初に確認すべき場所はどれか。","c":["アプリケーションのコンテナログ","ECSのサービスイベント","ALBのアクセスログ","CloudTrailのデータイベント"],"a":"イ","et":"アプリログには何も出ない","eb":"IP枯渇時はタスクがPENDINGのまま起動せず、サービスイベントに insufficient IP addresses といった趣旨のメッセージが出る。アプリのログには何も出ないため、ECSのイベントタブを見る習慣がないと迷子になる。似た症状でENIの上限やクラスタのキャパシティ不足もあるのでメッセージ本文を正確に読む。既存サブネットのCIDRは拡張できないため、恒久対策はサブネット追加やVPCへのセカンダリCIDR追加になる。"},{"i":"n7#7-3","g":"n7","n":"7-3","t":"サービスディスカバリ","s":"Cloud MapのようなDNSベースのサービスディスカバリで注意すべきリスクはどれか。","c":["クライアント側のキャッシュが古いIPを掴み続ける","レコードが手動更新になる","TLS終端ができない","ヘルスチェックが実行できない"],"a":"ア","et":"仮想IP方式ならこの問題は起きない","eb":"Cloud Mapではタスクの起動・停止に連動してRoute 53のレコードが自動で追加・削除されるが、レコードのTTLとクライアント側のDNSキャッシュが効くため、タスクが入れ替わってレコードが更新されても古い結果をキャッシュしていれば既に存在しないIPへ接続を試みる。対策はTTLを短くする、アプリのDNSキャッシュ設定を明示する、接続失敗時にリトライして名前解決をやり直す実装にすることである。Kubernetes ServiceのClusterIPのように仮想IPを固定する方式ならこの問題は起きない。"},{"i":"n7#7-4","g":"n7","n":"7-4","t":"Kubernetes Service / Ingress","s":"Kubernetes の Service タイプのうち、クラスタ内部からのみ到達できるものはどれか。","c":["ClusterIP","NodePort","LoadBalancer","ExternalName"],"a":"ア","et":"サービス間通信の既定形","eb":"ClusterIPはクラスタ内部からのみ到達できる仮想IPで、サービス間通信の既定形である。NodePortは全ノードの特定ポートを開けて外部から到達可能にするがポート範囲が限られ単体で本番に使うことは少ない。LoadBalancerはクラウドのLBを自動作成するがサービスごとにLBが作られコストが嵩む。IngressはL7の入口としてホスト名やパスによる振り分けとTLS終端を担当し、1つのLBで複数サービスを束ねられる点がコスト面の利点になる。"},{"i":"n7#7-5","g":"n7","n":"7-5","t":"CNIプラグイン","s":"AWS VPC CNI を使う場合に、1ノードあたりの最大Pod数を決める要因はどれか。","c":["ノードのCPUコア数","インスタンスタイプごとのENI数とENIあたりのIP数","kubeletのバージョン","Serviceのタイプ"],"a":"イ","et":"PodがVPCのIPを直接消費する","eb":"AWS VPC CNIはPodにVPCのプライベートIPを直接割り当てるため、PodとVPC内の他リソースが同じアドレス空間で通信でき、SGも適用できる。代償としてPod数はサブネットのIP数とノードのENI/IP上限に制約され、インスタンスタイプごとに搭載できるENI数とENIあたりのIP数が1ノードあたりの最大Pod数を決める。またNetworkPolicyを実際に強制するのはCNIプラグインの役目であり、非対応のプラグインではエラーも出ずに何も起こらないため、導入後に実際に遮断されることを検証する必要がある。"},{"i":"n7#7-6","g":"n7","n":"7-6","t":"サービスメッシュ","s":"サービスメッシュを導入すべきでないケースとして適切なものはどれか。","c":["サービス数が数個で、運用体制も薄い組織","サービス間のmTLSを一元的に適用したい場合","分散トレースを全サービスに適用したい場合","サービス間のリトライを宣言的に制御したい場合"],"a":"ア","et":"得られるものと代償を両面で言えること","eb":"サービスメッシュはアプリを改修せずにmTLS・リトライ・タイムアウト・サーキットブレーカ・分散トレースを一元的に適用でき、通信の可視化とポリシー適用が宣言的になる。一方で全Podにサイドカーが増えることによるリソース消費とレイテンシ増、コントロールプレーンの運用負荷、障害時の切り分けの複雑化、バージョンアップ追従の負担という代償がある。サービス数が少ない構成ではライブラリやALBの機能で代替でき、運用体制が薄い組織ではメッシュ自体が新たな障害点になる。"},{"i":"n7#7-7","g":"n7","n":"7-7","t":"East-West / North-South","s":"分散トレースが主に効果を発揮するトラフィックはどれか。","c":["North-South（外部との通信）","East-West（サービス間通信）","ヘルスチェックトラフィック","DNSクエリ"],"a":"イ","et":"境界だけ固めても横展開は防げない","eb":"North-Southは外部との通信であり、WAF、DDoS対策、認証、レートリミットが主な制御手段で、監視はエンドユーザ視点のレイテンシとエラー率が中心になる。East-Westはサービス間通信で、mTLS、NetworkPolicy、サービス間の認可が主な制御手段となり、監視はサービス間の依存関係、呼び出し回数、伝播する遅延が中心になる。分散トレースが効くのは主にEast-Westである。境界防御だけを固めてEast-Westを無防備にすると、一箇所の侵害が横展開を許すことになる。"},{"i":"n8#8-1","g":"n8","n":"8-1","t":"VPC Flow Logs","s":"VPC Flow Logs で、行きがACCEPT、戻りがREJECTと記録されていた。原因として最も可能性が高いものはどれか。","c":["セキュリティグループの設定漏れ","NACLの戻り方向の許可漏れ","ルートテーブルの設定漏れ","ENIの上限到達"],"a":"イ","et":"SGはステートフルなので戻りは落ちない","eb":"SGはステートフルなので行きが通れば戻りが落ちることはない。行きがACCEPTで戻りがREJECTならNACLの戻り方向の許可漏れである。行き自体がREJECTならSGかNACLのどちらかで入口が塞がれている。記録自体が存在しなければパケットがそのENIまで到達していない（経路の問題）と判断する。なおFlow LogsにはAWS提供DNS、DHCP、インスタンスメタデータ宛てなど記録されない通信があるため、出ていないから通信していないとは言い切れない。"},{"i":"n8#8-2","g":"n8","n":"8-2","t":"ALBアクセスログ","s":"ALBアクセスログの target_processing_time が -1 になっている。これが意味することはどれか。","c":["アプリの処理時間がゼロだった","ターゲットに到達していない、または応答を受け取れなかった","リクエストがキャッシュから返された","ヘルスチェックのログである"],"a":"イ","et":"5xx調査ではまずこの値を見る","eb":"-1 はターゲットに到達していない、または応答を受け取れなかったことを示す。ターゲットが選択できなかった（503）、接続が確立できなかった、接続が途中で切れた（502）などのケースである。-1 が並んでいればアプリまで届いていないので、アプリのログを掘っても何も出てこない。なお3つの processing_time はそれぞれ、request が受信からターゲット送信開始まで、target がアプリの処理時間、response がクライアントへ返し終わるまでを指す。"},{"i":"n8#8-3","g":"n8","n":"8-3","t":"dig","s":"リゾルバのキャッシュを避けて権威サーバの正解を直接確認したいとき、適切なコマンドはどれか。","c":["dig +short ドメイン名","dig @権威サーバ ドメイン名","dig +trace ドメイン名","dig -x IPアドレス"],"a":"イ","et":"3つの使い分けができれば実務は足りる","eb":"@サーバ指定はキャッシュを避けて正解を確認するとき、あるいは特定リゾルバの見え方を確認するときに使う。+short は結果だけを素早く見るとき、+trace はどの段階で失敗しているかをルートから辿るときに使う。権威サーバは dig NS ドメイン名 で特定できる。ANSWER SECTIONの2列目がTTLの残り秒数であり、数秒あけて2回実行して値が減っていればキャッシュされていると判断できる。"},{"i":"n8#8-4","g":"n8","n":"8-4","t":"curl -v","s":"curl の -w オプションで time_appconnect から time_connect を引いた値が示すものはどれか。","c":["DNS解決にかかった時間","TCP接続確立にかかった時間","TLSハンドシェイクにかかった時間","レスポンス転送にかかった時間"],"a":"ウ","et":"各値は累積時間である点に注意","eb":"time_namelookup、time_connect、time_appconnect、time_starttransfer、time_total はいずれも累積時間である。したがってTLSにかかった時間は time_appconnect - time_connect で求める。この分解ができると「遅い」という曖昧な報告を具体的な調査対象に落とせる。time_namelookup が大きければDNS、time_connect との差が大きければTCP接続確立、time_starttransfer との差が大きければサーバ処理、time_total との差が大きければ転送そのものが原因である。"},{"i":"n8#8-5","g":"n8","n":"8-5","t":"ss / netstat","s":"アプリからDBへのESTABLISHED接続数が設定したプール最大数に常に張り付いている。推測できることはどれか。","c":["プールが枯渇している","プールが効いておらず毎回新規接続している","DNSキャッシュが古い","MTU不整合が起きている"],"a":"ア","et":"実際に張られている接続数を数える","eb":"ss -Htan dst DBのIP | wc -l などで実際に張られている接続数を数え、設定したプール最大数と比較する。常に上限に張り付いているならプール枯渇を疑う。逆に想定よりはるかに少ないなら、プールが効いておらず毎回新規接続している可能性がある。ss -tanp でプロセス名まで出せばどのアプリの接続かを特定できる。全体像は ss -s でサマリを見る。"},{"i":"n8#8-6","g":"n8","n":"8-6","t":"tcpdump","s":"アプリのログに何も出ないが疎通しない、という場面で tcpdump が果たす役割として最も適切なものはどれか。","c":["アプリケーションのスタックトレースを取得する","パケットが到達しているか否かを事実として確定させる","DNSレコードを書き換える","TLS証明書を検証する"],"a":"イ","et":"推測を排除できる最後の拠り所","eb":"tcpdump はパケットが到達しているか否かを事実として確定できる。到達していればアプリ側の問題、到達していなければ経路の問題と、調査範囲が半分になる。推測を排除できるという意味で最後の拠り所になるツールであり、本番で常用するものではないが必要な場面で躊躇なく使えることが重要である。基本形は tcpdump -i any host 対向IP and port 443 -nn -c 100 で、-nn は名前解決を抑止して表示を速くし副作用も避けられる。"},{"i":"n8#8-7","g":"n8","n":"8-7","t":"mtr / traceroute","s":"mtr で中間ホップに損失が表示されているが、最終ホップでは損失がない。この状況の解釈として正しいものはどれか。","c":["中間ルータで実害のあるパケットロスが起きている","中間ルータがICMPへの応答を優先していないだけで実害はない","経路が切り替わっている","MTUが不整合である"],"a":"イ","et":"最終ホップまで損失が続いていれば本物","eb":"中間ルータはICMPへの応答を最優先で処理しないため、負荷時にはICMPだけが落ちることがある。その結果、中間ホップに損失が表示されても実際のトラフィックは問題なく通過していることがある。判断の目安は、中間ホップで損失が出ていても最終ホップで損失がなければ実害はない、逆に最終ホップまで損失が続いていれば本物である。なおAWS内部のネットワークはICMPに応答しない箇所が多く traceroute が * * * で埋まるが、これは障害ではなく仕様である。"},{"i":"n8#8-8","g":"n8","n":"8-8","t":"レイテンシの分解","s":"エンドユーザから見た総遅延を分解する区間として、正しい順序はどれか。","c":["DNS解決 → TCP接続 → TLSハンドシェイク → サーバ処理 → 転送完了","TCP接続 → DNS解決 → サーバ処理 → TLSハンドシェイク → 転送完了","TLSハンドシェイク → DNS解決 → TCP接続 → 転送完了 → サーバ処理","サーバ処理 → DNS解決 → TCP接続 → TLSハンドシェイク → 転送完了"],"a":"ア","et":"分解して語れることが実力差になる","eb":"総遅延はDNS解決 → TCP接続 → TLSハンドシェイク → サーバ処理（TTFB）→ 転送完了に分解する。「遅い」という報告に対し「DNSが50ms、接続が20ms、TLSが40ms、サーバ処理が800ms、転送が30ms。サーバ処理が支配的です」と答えられる状態が目標である。区間ごとの打ち手は、DNSならTTL調整やリゾルバ変更、TCP接続ならCDN導入や接続再利用、TLSならセッション再開やTLS 1.3、サーバ処理ならプロファイリングやクエリ改善、転送なら圧縮やCDNになる。"},{"i":"n9#9-1","g":"n9","n":"9-1","t":"サービスクォータ","s":"負荷試験の計画を立てる際、クォータ引き上げについて見込んでおくべきことはどれか。","c":["すべて即座に自動承認される","大幅な引き上げはサポートケースの審査で数営業日かかる場合がある","引き上げは有償オプションである","引き上げは一度しか申請できない"],"a":"イ","et":"クォータ確認は試験計画の最初のタスク","eb":"自動承認されるものもあるが、大幅な引き上げはサポートケースとして人手の審査が入り数営業日かかることがある。負荷試験の直前に気づくと日程が崩れるため、試験計画の最初のタスクとしてクォータ確認を置く。確認すべき主要項目はECSタスク数、ENI数、ELB数、Lambda同時実行数、サブネットIP数、インスタンスタイプ別vCPU数などである。Service Quotas で Adjustable が false の項目はハードリミットなので設計で回避する必要がある。"},{"i":"n9#9-2","g":"n9","n":"9-2","t":"サブネットIP枯渇","s":"サブネットの利用可能IP数を監視したい。適切な方法はどれか。","c":["CloudWatchの標準メトリクスをそのまま使う","describe-subnets の AvailableIpAddressCount を定期取得しカスタムメトリクス化する","VPC Flow Logs の件数から推定する","ALBのターゲット数から推定する"],"a":"イ","et":"標準メトリクスが存在しないので自前で作る","eb":"サブネットの利用可能IP数には標準メトリクスが存在しないため、describe-subnets の AvailableIpAddressCount を EventBridge + Lambda などで定期取得し、CloudWatchのカスタムメトリクスとして出して閾値アラームを設定する。枯渇するとタスクがPENDINGのまま起動せず、ECSのサービスイベントにIP不足の旨が出る。アプリのログには何も出ないため、コンテナ側だけを見ていると原因に辿り着けない。"},{"i":"n9#9-3","g":"n9","n":"9-3","t":"接続数・帯域の上限","s":"負荷試験で「最初は速いが数分後に遅くなる」という現象が出た。まず疑うべきものはどれか。","c":["バースト帯域からベースライン帯域への低下","DNSのネガティブキャッシュ","TLSセッション再開の失敗","ルートテーブルの最長一致"],"a":"ア","et":"カタログの最大値は常時出るとは限らない","eb":"小〜中サイズのインスタンスは短時間だけ上限まで出せるが、継続するとベースライン値まで絞られるクレジット方式になっている。カタログに最大10 Gbpsと書かれていても常時10 Gbps出るとは限らない。継続的に高い帯域が必要ならバーストしないサイズのインスタンスを選ぶ。使用中インスタンスタイプの帯域上限は describe-instance-types の NetworkInfo で確認でき、Fargateの場合はタスクサイズに応じた帯域が割り当てられる。"},{"i":"n9#9-4","g":"n9","n":"9-4","t":"MTU / フラグメンテーション","s":"小さいリクエストは通るが、大きいリクエストだけがハングする。疑うべき原因はどれか。","c":["MTU不整合とPath MTU Discoveryの不全","DNSの浸透待ち","セキュリティグループの設定漏れ","証明書の期限切れ"],"a":"ア","et":"サイズ依存の挙動はMTUを疑う","eb":"パケットサイズが閾値を超えた時点で落ちるためサイズ依存の挙動になる。VPNやトンネルはヘッダを追加するため実効MTUが標準の1500より小さくなり、VPC内は最大9001だがインターネットゲートウェイ経由では1500に制限される。コンテナのオーバーレイネットワークでも同様に減る。経路上で最小のMTUが全体を律するが、Path MTU Discovery はICMPに依存するためICMPをブロックしていると正しく機能せずこの障害が起きる。ping -M do -s サイズ で通る最大サイズを確認できる。"},{"i":"n9#9-5","g":"n9","n":"9-5","t":"リージョン間・AZ間レイテンシ","s":"AWSのAZ間レイテンシの桁感として最も近いものはどれか。","c":["1〜2ms程度","10ms程度","50ms程度","100〜150ms程度"],"a":"ア","et":"桁感があれば物理距離で説明できるか判断できる","eb":"同一AZ内は1ms未満、AZ間は1〜2ms程度、東京-大阪のような国内リージョン間は10ms前後、東京-バージニア北部のような大陸間は100〜150ms程度である。この桁感があると、計測値を見た瞬間に物理的な距離で説明できる遅延かそれ以外かを判断できる。1往復100msのリージョン間で1リクエスト中に5回同期呼び出しをすれば500msが加算されるため、N+1問題があると一気に致命的になる。"},{"i":"n9#9-6","g":"n9","n":"9-6","t":"スロットリング","s":"ThrottlingException が返ってきたときの適切な対処はどれか。","c":["サーバ側の障害として調査を開始する","上限付きの指数バックオフにジッタを加えてリトライする","タイムアウト値を無制限にする","リトライを無限に繰り返す"],"a":"イ","et":"障害ではなく送りすぎの合図","eb":"ThrottlingException、TooManyRequestsException、RequestLimitExceeded、ProvisionedThroughputExceededException、HTTPの429や503はいずれも障害ではなく送りすぎの合図である。サーバ側の異常として調査を始めると方向を誤る。自前で書く場合は待機時間を random(0, min(maxDelay, base × 2^attempt)) とする Full Jitter が基本形で、回数上限を必ず設け、上限に達したら諦めて上位にエラーを返す。無限リトライはリトライストームの温床になる。AWS SDKは既定でリトライとバックオフを実装している。"},{"i":"s1#1-1","g":"s1","n":"1-1","t":"最小権限の原則","s":"CloudTrailの実績から権限を絞り込む際に最も注意すべきことはどれか。","c":["実績のない権限をすべて機械的に削除する","年次処理や障害時のみ実行する稀な操作を落とさないようにする","本番環境では絶対に権限を絞らない","IAMポリシーではなくSCPだけで制御する"],"a":"イ","et":"実績だけを機械的に信じない","eb":"手順は対象ロールが一定期間（最低1か月、月次バッチがあれば2か月）に実際に呼んだAPIをCloudTrailから抽出し、現在のポリシーと突き合わせて一度も呼ばれていないアクションを削除候補とし、監査モードで様子を見てから適用する。注意点は期間中に実行されなかった稀な処理を落とさないことで、実績だけを機械的に信じない。IAM Access Analyzer のポリシー生成をたたき台にし、稀な操作は人が補う。「まず広く許可して後で絞る」進め方をとる場合は、期限とチケットを必ず紐づける。"},{"i":"s1#1-2","g":"s1","n":"1-2","t":"IAMポリシーの評価順序","s":"IAMの権限評価において最も優先されるものはどれか。","c":["明示的Allow","明示的Deny","暗黙のDeny","リソースベースポリシーのAllow"],"a":"イ","et":"明示的Deny > 明示的Allow > 暗黙のDeny","eb":"評価はSCP、リソースベースポリシー、権限境界、アイデンティティベースポリシー、セッションポリシーの各段階で行われ、すべてで許可され、かつどこにも明示的Denyがない場合にのみ許可される。ひとつでもDenyがあれば拒否、どこにも明示的Allowがなければ暗黙のDenyで拒否になる。「権限はあるはずなのに拒否される」際は、エラーの explicit deny / implicit deny の文言を読み、SCP、権限境界、リソース側ポリシー（バケットポリシーやKMS鍵ポリシー）、条件キーの順で確認する。"},{"i":"s1#1-3","g":"s1","n":"1-3","t":"ロールと AssumeRole","s":"IAMロールの信頼ポリシー（Trust Policy）が定めるものはどれか。","c":["そのロールで何ができるか","誰がそのロールを引き受けられるか","一時認証情報の有効期限","ロールに付与できる権限の上限"],"a":"イ","et":"信頼ポリシーと権限ポリシーの役割分担","eb":"信頼ポリシーは誰がこのロールを引き受けられるかを定め、Principalに引き受け元（別アカウント、サービス、OIDCプロバイダ）を書く。権限ポリシーは引き受けた後に何ができるかを定める。クロスアカウントでは、引き受けられる側の信頼ポリシーと引き受ける側のAssumeRole権限の両方が必要であり、片方だけでは機能しない。sts assume-role で返るのは AccessKeyId、SecretAccessKey、SessionToken、Expiration で、SessionTokenが付くのが一時認証情報の特徴である。"},{"i":"s1#1-4","g":"s1","n":"1-4","t":"権限境界","s":"権限境界（Permissions Boundary）の典型的な使いどころはどれか。","c":["組織全体に一律の禁止事項を課す","開発者にIAMロール作成権限を渡しつつ、作られるロールの権限に上限をかける","一時認証情報の有効期限を延ばす","リソースへのアクセス元IPを制限する"],"a":"イ","et":"権限を与えるのではなく上限を定める","eb":"開発者に自分でIAMロールを作ってよい権限を渡したいが、作られるロールが強すぎると困るという場面で使う。作成するロールには必ずこの境界を付けることを条件付きで強制すれば、開発者が作るロールの権限は境界の範囲を超えられない。実際の権限は「境界 ∩ アイデンティティポリシー」になる。SCPも上限を定める点は同じだが、権限境界がIAMエンティティ単位であるのに対し、SCPはOrganizations配下のアカウントやOU単位で適用され、ルートユーザを含む全プリンシパルに効く。"},{"i":"s1#1-5","g":"s1","n":"1-5","t":"SCP","s":"SCP（サービスコントロールポリシー）の性質として正しいものはどれか。","c":["SCPで許可すればアカウント内の誰もがその操作を実行できる","SCPはアカウント内のIAMが許可できる範囲の天井を定めるものである","SCPはIAMユーザ単位で適用する","SCPはリージョンごとに自動生成される"],"a":"イ","et":"SCPは天井であって許可ではない","eb":"SCPで許可を書いてもそれだけでは誰も何もできず、アカウント内のIAMポリシーで許可されて初めて実行できる。SCPはアカウント内のIAMが許可できる範囲の天井を定めるフィルタである。この性質を理解していないと「SCPで許可したのに使えない」という誤解に陥る。典型的なガードレール例は、使用リージョンの制限、CloudTrailの無効化・削除の禁止、ルートユーザの利用禁止、特定タグのないリソース作成の禁止などで、いずれもやってはいけないことを構造的に不可能にする発想である。"},{"i":"s1#1-6","g":"s1","n":"1-6","t":"クロスアカウントアクセス","s":"第三者ベンダに自社アカウントへのアクセスを許可する際、外部ID（External ID）が防ぐ問題はどれか。","c":["混乱した代理人問題","リプレイ攻撃","ブルートフォース攻撃","SQLインジェクション"],"a":"ア","et":"顧客ごとに異なる秘密の識別子","eb":"ベンダは多数の顧客のロールを引き受けられる立場にあるため、攻撃者が自分のアカウントIDを偽ってベンダに登録すると、ベンダを経由して他社のリソースにアクセスできてしまう可能性がある。これが混乱した代理人問題である。外部IDは顧客ごとに異なる秘密の識別子を信頼ポリシーの条件に入れることで、ベンダが正しい顧客のロールしか引き受けられないようにする仕組みである。"},{"i":"s1#1-7","g":"s1","n":"1-7","t":"SSO / フェデレーション","s":"IAMユーザを作らずSSO/フェデレーションを使う構造的な利点はどれか。","c":["APIの実行速度が上がる","退職時の権限剥奪がIdP側の一箇所で完結する","CloudTrailのログ量が減る","リージョン間レイテンシが下がる"],"a":"イ","et":"漏洩の窓を狭める効果も大きい","eb":"IAMユーザを各アカウントに作る方式だと、退職時に全アカウントのユーザを個別に削除する必要があり、一つでも消し忘れればそのアカウントへのアクセスが残る。フェデレーションでは認証が社内IdPに集約されるため、IdP側でアカウントを無効化すれば全AWSアカウントへのアクセスが即座に失われ、人事プロセスとの連動も一箇所で済む。加えて取得されるのは有効期限付きの一時認証情報のみとなり、漏洩しても数時間で無効になるため被害の窓が劇的に狭まる。"},{"i":"s1#1-8","g":"s1","n":"1-8","t":"OIDC / SAML","s":"GitHub Actions から AWS へOIDCで認証する際、信頼ポリシーの条件で参照することで実行元を限定できるクレームはどれか。","c":["sub","iat","jti","nbf"],"a":"ア","et":"リポジトリ・ブランチ・環境で限定する","eb":"トークンの sub クレームには repo:org/repo:ref:refs/heads/main のような値が入る。信頼ポリシーの条件でこの値を照合すれば、特定のリポジトリの特定ブランチからの実行だけを許可できる。環境単位なら repo:org/repo:environment:production となる。aud が sts.amazonaws.com であることも併せて検証する。人間のログインにはSAML/OIDC、マシンにはOIDCという使い分けになるが、共通する要点は長期キーを発行しないことである。"},{"i":"s1#1-9","g":"s1","n":"1-9","t":"特権アクセスの分離","s":"本番の破壊的操作を日常権限から切り離す実装として適切なものはどれか。","c":["全員に管理者権限を配り、操作ログだけを取る","日常は読み取り中心の権限とし、必要時のみ承認付きで有効期限付きの昇格ロールを引き受ける","本番アカウントへのアクセスを完全に禁止する","IAMユーザのパスワードを定期変更する"],"a":"イ","et":"技術的に止められない操作は可視化して抑止する","eb":"承認付きの一時昇格が代表例で、承認はSlackワークフローやIdPの承認機能で行い有効期限（1〜2時間）を付ける。より簡易な案としては本番の書き込みロールをMFA必須の条件付きにする、Break Glassアカウント（緊急時のみ使い、使用すれば必ずアラートが飛ぶ）を用意するなどがある。昇格ロールのAssumeRoleイベントをCloudTrailで検知してSlackへ即時通知し、誰がいつ何のために昇格したかが見える状態にする。技術的に止められない操作は可視化して抑止するという考え方である。"},{"i":"s2#2-1","g":"s2","n":"2-1","t":"Secrets Manager / Parameter Store","s":"Secrets Manager と Parameter Store の選び分けの基準として最も適切なものはどれか。","c":["暗号化の可否","ローテーション機能の要否とコスト","リージョン間レイテンシ","タグ付けの可否"],"a":"イ","et":"要件がなければParameter Storeから始める","eb":"Secrets Manager はローテーション機能、クロスリージョンレプリケーション、RDSとの統合が必要な場合に選ぶが、シークレットあたり月額の課金がある。Parameter Store は SecureString 型で暗号化保存でき標準パラメータは無料だが、ローテーションは自前実装になる。要件がなければ Parameter Store で始め、ローテーションが必要になった時点で Secrets Manager を検討する順序が費用対効果として妥当である。ECSからは タスク定義の secrets で参照でき、値そのものはタスク定義に残らない。"},{"i":"s2#2-2","g":"s2","n":"2-2","t":"KMS / カスタマーマネージドキー","s":"IAMでS3の読み取りとkms:Decryptを許可しているのにオブジェクトを読めない。次に確認すべきものはどれか。","c":["バケットのバージョニング設定","KMSの鍵ポリシー","Route 53のレコード","ALBのリスナー設定"],"a":"イ","et":"鍵ポリシーとIAMポリシーの二重制御","eb":"KMSは鍵ポリシーが起点であり、鍵ポリシーでIAMポリシーによる制御を委任する記述があって初めてIAMポリシー側の許可が効く。したがってIAMで許可したのに使えない場合、鍵ポリシー側で許可されていないことが原因になる。特にクロスアカウントでは鍵ポリシー側でも相手アカウントを許可する必要がある。エラーがAccessDeniedとだけ出ることもあるため、暗号化されたリソースへのアクセス障害では常に鍵を疑う。なおAWSマネージドキーは鍵ポリシーを編集できずクロスアカウント共有もできない。"},{"i":"s2#2-3","g":"s2","n":"2-3","t":"封筒暗号化","s":"封筒暗号化において、暗号化データと一緒に保存してよいものはどれか。","c":["平文のデータキー","マスター鍵で暗号化されたデータキー","マスター鍵そのもの","KMSのAPIキー"],"a":"イ","et":"平文データキーはメモリ上でのみ扱う","eb":"封筒暗号化ではKMSからデータキーを発行してもらい、KMSは平文のデータキーとマスター鍵で暗号化されたデータキーの両方を返す。クライアントは平文データキーでローカルにデータを暗号化し、暗号化済みデータキーをデータと一緒に保存する。復号時は暗号化済みデータキーをKMSに送って平文データキーを取り戻す。平文データキーを一緒に保存すれば暗号化した意味が完全に失われるため、使用直後にメモリから消去する。この分離があるからKMSの鍵ポリシーによるアクセス制御が意味を持つ。"},{"i":"s2#2-4","g":"s2","n":"2-4","t":"シークレットのローテーション","s":"シークレットを無停止でローテーションするために必要な設計はどれか。","c":["旧資格情報を即座に無効化する","新旧2つの資格情報が同時に有効な期間を設ける","全アプリを同時に再起動する","ローテーション間隔を1年以上にする"],"a":"イ","et":"新旧併存がないと一斉に認証エラーになる","eb":"ローテーションの瞬間に旧資格情報を無効化すると、まだ旧値をキャッシュしているアプリが一斉に認証エラーを起こす。Secrets Manager の4段階ローテーションでも AWSCURRENT と AWSPENDING というラベルで新旧を併存させる。DBユーザならユーザを2つ用意して交互に使う方式にすれば切り替え時も常に片方が有効になる。アプリ側は起動時のみ取得、TTL付きキャッシュ、認証エラー時に再取得の3方式があり、実務ではTTL付きキャッシュと認証エラー時の再取得の組合せが堅実である。"},{"i":"s2#2-5","g":"s2","n":"2-5","t":"ハードコード検出","s":"Gitリポジトリにアクセスキーがコミットされていたことが判明した。最優先で行うべきことはどれか。","c":["該当行を削除して新しくコミットする","直ちにその資格情報を失効させ、新しい資格情報を発行する","リポジトリをプライベートに変更する","コミット履歴を書き換える"],"a":"イ","et":"履歴の掃除は二の次","eb":"該当行を削除して新しくコミットしてもGitの履歴には残り続け、リポジトリをクローンした誰もが取り出せる。フォークやミラー、CIのキャッシュにも残る。正しい対処は、直ちにその資格情報を失効させ、新しい資格情報を発行して差し替え、必要なら履歴の書き換えを行う順である。最優先は失効であり、履歴の掃除は二の次である。予防としては gitleaks 等をコミット前フックとCIの二段構えで回す。"},{"i":"s2#2-6","g":"s2","n":"2-6","t":"環境変数 vs シークレット参照","s":"環境変数に機密情報を置いた場合の漏洩経路として当てはまらないものはどれか。","c":["/proc/<pid>/environ やプロセス一覧からの読み取り","クラッシュ時のコアダンプやエラー画面への出力","外部コマンド実行時の子プロセスへの継承","TLSハンドシェイクのClientHelloへの混入"],"a":"エ","et":"漏洩経路を複数挙げられること","eb":"環境変数は ps e や /proc/<pid>/environ から読める、クラッシュ時のコアダンプやスタックトレースに出る、多くのフレームワークがエラー画面に環境変数を一括出力する、外部コマンド実行時に子プロセスへ継承される、タスク定義やデプロイ設定に平文で残る、CIのビルドログに出力される、といった経路で漏れる。TLSハンドシェイクに混入することはない。機密度が高いものは実行時にSDK経由で取得しメモリ上でのみ保持する方式が望ましい。"},{"i":"s2#2-7","g":"s2","n":"2-7","t":"一時認証情報","s":"アカウント内の長期アクセスキーを棚卸しするために使うものはどれか。","c":["IAM認証情報レポート","VPC Flow Logs","ALBアクセスログ","Cost Explorer"],"a":"ア","et":"最終使用日時から未使用キーを抽出する","eb":"aws iam generate-credential-report で取得できる認証情報レポートには、全ユーザのアクセスキーの有無、最終使用日時、パスワードの最終使用日が一覧で出る。これをCSVとして分析し、90日以上未使用のキー、作成から一定期間以上経過して未ローテーションのキー、そもそも不要なIAMユーザを抽出する。運用としては月次でLambdaが取得して通知し、いきなり削除せずまず無効化して一定期間様子を見てから削除する二段階にすると影響のある削除を避けられる。"},{"i":"s3#3-1","g":"s3","n":"3-1","t":"OIDC連携によるキーレス認証","s":"GitHub Actions との OIDC 連携で、信頼ポリシーの条件を緩く書いた場合に生じる危険はどれか。","c":["ビルド時間が長くなる","同じOIDCプロバイダを使う他のリポジトリからもロールを引き受けられる","一時認証情報の有効期限が無限になる","CloudTrailにログが残らなくなる"],"a":"イ","et":"条件の書き方で安全性が決まる","eb":"sub の条件をワイルドカードで広げたり、そもそも sub の条件を書かずに aud だけを検証したりすると、同じOIDCプロバイダを使う任意のリポジトリからロールを引き受けられる。組織外のリポジトリからも引き受け可能になるケースすらある。「OIDCにしたから安全」ではなく条件の書き方で安全性が決まるため、設定後は想定外のリポジトリから引き受けられないことを実際に確認する。"},{"i":"s3#3-2","g":"s3","n":"3-2","t":"Terraform state の保護","s":"Terraform の state ファイルについて正しいものはどれか。","c":["機微情報は常にマスクされるため平文では含まれない","変数に sensitive = true を付ければstateにも記録されない","DBパスワード等が平文で記録されうるため、state自体を機密情報として扱う","stateはローカルにのみ保存すべきである"],"a":"ウ","et":"stateそのものが機密情報","eb":"aws_db_instance の password、aws_iam_access_key の secret、random_password の result などはstateファイルに平文で記録される。変数に sensitive = true を付けてもログ出力が抑制されるだけでstateには入る。つまりstateファイルはそれ自体が機密情報であり、ローカルに置いたままコミットしたり共有ドライブに置いたりしてはいけない。S3バックエンドでは暗号化・バージョニング・アクセス制限・ロックの4点をセットで設定する。"},{"i":"s3#3-3","g":"s3","n":"3-3","t":"IaCスキャン","s":"IaCスキャンをCIに組み込む際、運用が形骸化しないための工夫として適切なものはどれか。","c":["検出されたすべての項目でジョブを失敗させる","重大度の閾値を設け、例外は理由を記載して抑制する","検出結果を無視してログにのみ残す","本番デプロイ後にのみ実行する"],"a":"イ","et":"全件ブロックはCIが常に赤になり無視される","eb":"tfsec や Checkov でHIGH以上が検出されたらジョブを失敗させ、MEDIUM以下は警告として記録するといった閾値設定を行う。全件をブロックするとCIが常に赤になり無視されるようになるため、閾値設定と例外管理（インラインコメントでの抑制と理由の記載）をセットで運用する。典型的な検出はセキュリティグループの 0.0.0.0/0 許可、S3やRDSの暗号化未設定、CloudTrailのログ検証未有効、IAMポリシーのワイルドカードなどである。"},{"i":"s3#3-4","g":"s3","n":"3-4","t":"SBOM","s":"SBOM（ソフトウェア部品表）を整備する主な目的はどれか。","c":["ビルド時間を短縮する","新しい脆弱性が公表されたとき、影響範囲を即座に判定する","ライセンス料を削減する","コンテナイメージのサイズを縮小する"],"a":"イ","et":"影響調査そのものが障害になりうる","eb":"Log4Shellのような広範囲に影響する脆弱性では、影響調査そのものに何日もかかることが実際の障害になった。SBOMは「どのソフトウェアにどのライブラリのどのバージョンが入っているか」の台帳であり、これがあれば検索一発で影響範囲が出る。SBOMがないと脆弱性公表のたびに全リポジトリの依存関係を人手で調べ直すことになり、推移的依存は特に見落としやすい。調査に時間がかかるほど攻撃者に先行される時間が伸びる。"},{"i":"s3#3-5","g":"s3","n":"3-5","t":"アーティファクト署名","s":"アーティファクト署名によって検証できることはどれか。","c":["成果物が正規のビルドパイプラインで作られ、その後改ざんされていないこと","成果物に脆弱性が含まれていないこと","成果物のライセンスが適切であること","成果物のパフォーマンスが基準を満たすこと"],"a":"ア","et":"レジストリ侵害時のすり替えも検知できる","eb":"署名により、そのアーティファクトが正規のビルドパイプラインで作られたものでありその後改ざんされていないことを検証できる。デプロイ時に署名を検証する仕組み（Kubernetesのadmission controller等）を入れれば、出所不明のイメージが本番に入ることを構造的に防げる。レジストリが侵害されてイメージがすり替えられた場合にも検知できる。cosign が代表的な実装である。"},{"i":"s3#3-6","g":"s3","n":"3-6","t":"ベースイメージの管理","s":"Dockerfile で FROM にタグではなくダイジェストを指定する理由はどれか。","c":["イメージのダウンロードが速くなるため","タグは同じ名前のまま別のイメージを指すよう付け替えられるため","ダイジェスト指定のほうがイメージサイズが小さいため","タグ指定ではマルチアーキテクチャに対応できないため"],"a":"イ","et":"再現可能なビルドと改ざん検知","eb":"タグは同じ名前のまま別のイメージを指すように付け替えられるため、FROM node:20 と書いていてもビルドするタイミングによって中身が変わり、再現性がなく意図しない変更が入り込む余地がある。ダイジェストはコンテンツのハッシュなので常に同一のイメージを指し、再現可能なビルドと改ざん検知の両方に効く。代償として更新が自動では入らないため、Dependabot や Renovate による更新自動化とセットで運用する。"},{"i":"s3#3-7","g":"s3","n":"3-7","t":"ブランチ保護 / レビュー必須化","s":"ブランチ保護とレビュー必須化がもつ、統制以外のもう一つの側面はどれか。","c":["ビルドの高速化","誰が何を承認したかの追跡性が確保され、監査証跡としてそのまま使える","ストレージコストの削減","テストカバレッジの自動向上"],"a":"イ","et":"変更管理の記録を別途作る必要がなくなる","eb":"統制面では本番反映経路への直接pushを禁止し必ずプルリクエストとレビューを経由させることで、一人の判断だけで本番が変わることを防ぐ。追跡性の面では「いつ、誰が、何を、誰の承認で変更したか」がGit上に残り、これは監査対応の証跡としてそのまま使える。変更管理の記録を別途作る必要がなくなるという実務上の利点が大きい。"},{"i":"s3#3-8","g":"s3","n":"3-8","t":"ビルド環境の隔離","s":"ビルドランナーに本番デプロイ権限を持たせることのリスクはどれか。","c":["ビルドが遅くなる","リポジトリのコードや依存ライブラリ経由の任意コード実行が、そのまま本番の掌握につながる","ログが大量に出力される","キャッシュが効かなくなる"],"a":"イ","et":"ビルドランナーはコードを実行する場所","eb":"ビルドランナーはリポジトリのコードを実行する場所であり、悪意あるプルリクエストや依存ライブラリの侵害によって任意のコードが実行されうる。そのランナーが本番の強い権限を持っていれば、コードの実行がそのまま本番の掌握につながる。特にフォークからのプルリクエストでシークレットが使える設定になっていると危険度が高い。ビルド・テスト用ジョブは読み取り中心の最小権限とし、デプロイ用は環境ごとに別ロール、本番は承認を必須にする。"},{"i":"s4#4-1","g":"s4","n":"4-1","t":"コンテナイメージスキャン","s":"レジストリでの継続スキャンがビルド時スキャンに加えて必要な理由はどれか。","c":["ビルド時スキャンは精度が低いため","ビルド時点では既知でなかったCVEが後から公表されるため","レジストリのストレージ使用量を把握するため","イメージのタグ付けを自動化するため"],"a":"イ","et":"稼働中のイメージほど長く放置される","eb":"ビルド時のスキャンは脆弱なイメージを本番に入れる前に止めるためのもので、フィードバックが早く修正コストが低い。レジストリでの継続スキャンは既にpush済みのイメージに対して後から公表された脆弱性を検出するためのもので、ビルド時点では既知でなかったCVEは再スキャンしなければ永久に見つからない。稼働中のイメージほど長く放置されるため、後者がないと「ビルド時は綺麗だったが今は穴だらけ」という状態になる。ECRの拡張スキャンはOSパッケージに加え依存ライブラリも継続的に再評価する。"},{"i":"s4#4-2","g":"s4","n":"4-2","t":"依存ライブラリの脆弱性","s":"依存ライブラリの脆弱性管理において、特に見落とされやすいものはどれか。","c":["直接依存しているライブラリ","推移的依存（間接的に含まれるライブラリ）","OSパッケージ","ベースイメージのバージョン"],"a":"イ","et":"攻撃者にとって直接か間接かは関係ない","eb":"直接依存が10個でも、その先の依存を辿ると数百のパッケージが実際にはインストールされている。攻撃者にとっては直接依存か推移的依存かは関係なく、実行環境に存在すれば等しく攻撃面になる。Log4Shellの際も多くのアプリは log4j を直接書いていなかったがフレームワーク経由で含んでいた。運用としては担当、期限（重大度ごとに定義）、判断基準を決め、対応不要と判断したものを明示的に閉じる仕組みが重要である。"},{"i":"s4#4-3","g":"s4","n":"4-3","t":"CVE / CVSS","s":"CVSSスコアが9.8でも対応優先度を下げてよい場合として適切なものはどれか。","c":["社内システムであれば常に優先度は低い","該当機能をコードから呼んでおらず、外部から到達できる経路にもない場合","スコアの計算が新しいバージョンである場合","ベンダが修正版を出していない場合"],"a":"イ","et":"到達可能性で優先度を判断する","eb":"CVSSはその脆弱性そのものの深刻度を表すもので、自社環境での実際のリスクではない。到達可能性の判断材料は、脆弱な関数・機能を実際に呼んでいるか、そのコンポーネントは外部から到達できる経路にあるか、攻撃の前提条件（認証の要否、特定設定の有効化）を満たすか、既に悪用が確認されているか（KEV掲載の有無）の4点である。逆にCVSS 5点台でも外部公開されていて認証不要なら優先度は高い。"},{"i":"s4#4-4","g":"s4","n":"4-4","t":"KEV","s":"CISAが公開する KEV カタログが示すものはどれか。","c":["CVSSスコアが9.0以上の脆弱性の一覧","実際に悪用が確認された脆弱性の一覧","ベンダが修正を提供していない脆弱性の一覧","米国政府機関でのみ影響する脆弱性の一覧"],"a":"イ","et":"理論上の危険性ではなく事実に基づく優先度","eb":"KEV（Known Exploited Vulnerabilities）は米国CISAが公開する、実際に悪用が確認された脆弱性の一覧である。誰でも参照でき機械可読な形式でも配布されている。自社の検出結果とKEVを突き合わせ、掲載されているものを最優先で対処することで、理論上の危険性ではなく現に攻撃されているという事実に基づく優先度付けができる。運用ルールとしては、KEV掲載かつ自社に該当するものはCVSSスコアに関わらず緊急対応キューに入れる。"},{"i":"s4#4-5","g":"s4","n":"4-5","t":"パッチ適用の運用設計","s":"緊急パッチを迅速に当てられるかどうかを実質的に規定するものはどれか。","c":["脆弱性スキャナの精度","デプロイ基盤の成熟度（無停止のローリング更新が可能か）","CVSSスコアの計算方法","SBOMのフォーマット"],"a":"イ","et":"パッチ管理の速度はデプロイ基盤に規定される","eb":"緊急パッチを当てたくても適用に計画停止が必要な構成では即座に当てられず、承認や告知に時間がかかりその間は無防備なままになる。ローリング更新とヘルスチェックが機能していれば任意のタイミングで無停止適用できる。つまりパッチ管理の速度はデプロイ基盤の成熟度に規定される。緊急適用の判断基準（KEV掲載、インターネット公開、認証不要で悪用可能、PoC公開など）は、その場で議論せずに済むよう事前に文書化しておく。"},{"i":"s4#4-6","g":"s4","n":"4-6","t":"EOL管理","s":"EOL（サポート終了）を迎えたソフトウェアを使い続けることの構造的なリスクはどれか。","c":["ライセンス料が上がる","新たに脆弱性が公表されても修正版が提供されず、塞げない穴が一方的に増える","パフォーマンスが徐々に低下する","ログ形式が変更される"],"a":"イ","et":"期限が決まっている強制的な移行イベント","eb":"EOL後のバージョンには新たに脆弱性が見つかっても修正版が提供されないため、時間の経過とともに塞げない穴が一方的に増えていく。仮想パッチや利用制限で凌ぐことはできるが根本的な解決にはならない。EOLは「いつか対応する課題」ではなく期限が決まっている強制的な移行イベントとして計画に組み込む必要がある。OS、ランタイム、フレームワーク、ミドルウェア、ベースイメージ、RDS等のエンジンバージョンを一覧化し、6か月前に通知が飛ぶ仕組みに載せる。"},{"i":"s4#4-7","g":"s4","n":"4-7","t":"仮想パッチ","s":"WAFによる仮想パッチの運用として適切なものはどれか。","c":["恒久対策として扱い、修正版の適用は不要とする","暫定措置と位置づけ、恒久対策の期限を設定してチケット管理する","ルールは一度入れたら削除しない","仮想パッチの適用時は監視を停止する"],"a":"イ","et":"ルールの肥大化は性能と誤検知の両面で害になる","eb":"仮想パッチはWAFやIPSで攻撃パターンを遮断する暫定措置であり、脆弱性そのものは残っているためルールを回避する攻撃手法が見つかれば破られる。運用としては仮想パッチを入れた時点でチケットを起票し恒久対策の期限を設定する。定期的に仮想パッチの一覧をレビューし、恒久対策済みのルールは削除する。削除しないとWAFルールが肥大化し、性能と誤検知の両面で害になる。"},{"i":"s5#5-1","g":"s5","n":"5-1","t":"セキュリティグループ設計","s":"awsvpcモードでタスクのIPが頻繁に変わる環境で、DB側のSGの書き方として最も管理しやすいものはどれか。","c":["サブネットのCIDRを丸ごと許可する","送信元にアプリ用SGのIDを指定する","0.0.0.0/0 を許可してアプリ側で制御する","タスク起動のたびにIPを追記する"],"a":"イ","et":"実質的なタグベースのマイクロセグメンテーション","eb":"インバウンドルールの送信元にはCIDRではなく別のSGのIDを指定でき、「このSGが付いたリソースからの通信を許可する」という意味になる。DBのSGで送信元をアプリ用SGのIDにしておけば、アプリのIPが変わってもタスクが増減してもルールを触る必要がない。IPベースだとawsvpcモードでは管理が破綻し、広いCIDRを許可すると無関係なリソースからも到達できてしまう。SG参照は役割に基づく許可であり、実質的なタグベースのマイクロセグメンテーションとして機能する。"},{"i":"s5#5-2","g":"s5","n":"5-2","t":"WAF","s":"WAFのマネージドルールを本番に適用する際の手順として適切なものはどれか。","c":["最初からBlockモードで適用し、問題が出たら解除する","一定期間Countモードで運用して誤検知を確認してからBlockへ切り替える","ルールを一つずつ本番で試す","ログを取得せずに適用する"],"a":"イ","et":"いきなりBlockは業務トラフィックを遮断する","eb":"マネージドルールグループをCountモードで1〜2週間適用し、WAFログとメトリクスでどのルールが何件マッチしたかを集計する。正常なリクエストにマッチしているルール（誤検知）を特定して除外やスコープダウン条件を設定し、誤検知がないことを確認してからBlockへ切り替える。いきなりBlockにすると正常な業務トラフィックを遮断して障害になり、特に管理画面やファイルアップロード機能が引っかかりやすい。Countモードでは nonTerminatingMatchingRules に記録される。"},{"i":"s5#5-3","g":"s5","n":"5-3","t":"レートリミット","s":"IP単位のレートリミットを設定する際に注意すべきことはどれか。","c":["共有IP（企業のNATやモバイルキャリア）からのアクセスは正常でも多くなる","IPアドレスは常に個人を一意に識別する","閾値は低いほど安全である","認証前のリクエストには適用できない"],"a":"ア","et":"単位の選び方で巻き込みを避ける","eb":"IP単位は最も簡単だが、企業のNATやモバイルキャリアなど共有IPからのアクセスは正常でも多くなるため、閾値を厳しくしすぎると大企業の利用者をまとめて遮断してしまう。閾値はアクセスログから送信元ごとの単位時間あたりリクエスト数の分布を見て、p99やp99.9の数倍に設定する。実務では認証前はIP単位で緩めに、認証後はユーザ単位で厳密にという二段構えにし、ログイン試行など攻撃対象になりやすいエンドポイントだけ個別に厳しい制限をかける。"},{"i":"s5#5-4","g":"s5","n":"5-4","t":"DDoS対策","s":"L7のHTTPフラッド攻撃に対する対処として適切なものはどれか。","c":["帯域を増やす","WAFのレートベースルール、Bot対策、キャッシュ活用","MTUを小さくする","TLSバージョンを下げる"],"a":"イ","et":"L7ではアプリの作りが防御力に直結する","eb":"L3/L4攻撃（SYNフラッド、UDPリフレクション）は帯域とコネクションを枯渇させるもので、対処はエッジでの吸収でありAWS Shieldが自動的に緩和する。L7攻撃は正常なリクエストに見えるため帯域では判別できず、WAFのレートベースルール、Bot対策、CAPTCHA、キャッシュ活用で対処する。L7ではアプリの作りが防御力に直結する点が特徴である。いずれの場合もオリジンのIPを直接晒さない構成（CDN経由に限定、オリジンアクセス制限）が前提になる。"},{"i":"s5#5-5","g":"s5","n":"5-5","t":"プライベート接続への寄せ","s":"公開エンドポイントを棚卸しする対象として含めるべきでないものはどれか。","c":["インターネット向けELB","パブリックIPを持つEC2/ENI","パブリックアクセス可能なS3バケット","VPC内部のみで解決するプライベートホストゾーン"],"a":"エ","et":"開いている口の棚卸しを継続的に行う","eb":"棚卸しの対象は、インターネット向けELB、パブリックIPを持つEC2/ENI、パブリックアクセス可能なS3バケット、パブリックアクセシビリティが有効なRDS、エンドポイントタイプがRegional/EdgeのAPI Gatewayなどである。プライベートホストゾーンはVPC内部からのみ解決できるため公開エンドポイントではない。AWS Config や Security Hub の基準チェック、IAM Access Analyzer の外部アクセス検出を使うと継続的に把握できる。"},{"i":"s5#5-6","g":"s5","n":"5-6","t":"踏み台の廃止（SSM Session Manager）","s":"NAT Gatewayのないプライベートサブネットで Session Manager を使うために必要な Interface型VPCエンドポイントの組合せはどれか。","c":["s3、dynamodb、logs","ssm、ssmmessages、ec2messages","ec2、elasticloadbalancing、autoscaling","kms、secretsmanager、sts"],"a":"イ","et":"22番ポートも鍵も踏み台も不要になる","eb":"ssm、ssmmessages、ec2messages の3つのInterface型VPCエンドポイントを作成すればインターネットなしで利用できる。対象インスタンスにはSSM Agentと AmazonSSMManagedInstanceCore 相当の権限を持つインスタンスプロファイルが必要で、操作する側には ssm:StartSession の権限が要る。22番ポートを開ける必要も、SSH鍵を管理する必要も、踏み台インスタンスを維持する必要もない。加えてセッション中に実行されたコマンドを操作者が触れない場所に記録でき、この監査上の優位性が廃止の主な動機になる。"},{"i":"s5#5-7","g":"s5","n":"5-7","t":"ゼロトラスト","s":"ゼロトラストの考え方に基づく具体的な変更として適切でないものはどれか。","c":["VPC内・社内LANだからという理由での無認証アクセスを排除する","内部通信も含めてTLS化する","リクエストごとに認可を評価し、有効期限の短い一時認証情報を使う","境界のファイアウォールを強化し、内部は従来どおり信頼する"],"a":"エ","et":"境界の内側を安全地帯とみなす前提を捨てる","eb":"ゼロトラストは境界の内側を安全地帯とみなす前提を捨て、あらゆるアクセスを外部からのものとして扱う設計変更である。具体的にはネットワーク位置による暗黙の信頼をやめてサービス間でも認証・認可を行う、内部通信も含めて暗号化する、一度認証したら終わりではなくリクエストごとに認可を評価し有効期限の短い一時認証情報を使う、デバイスやMFAの状態を条件に加える、すべてのアクセスを記録して異常を検知する、といった変更になる。境界だけを強化して内部を従来どおり信頼するのは対極の考え方である。"},{"i":"s6#6-1","g":"s6","n":"6-1","t":"CloudTrail","s":"S3からの情報持ち出しを追跡するために有効化しておく必要があるものはどれか。","c":["管理イベント（既定で有効）","データイベント（既定では無効）","Insightsイベント","組織証跡のみ"],"a":"イ","et":"データイベントは既定で無効・課金対象","eb":"管理イベントはリソースに対する制御操作（インスタンス起動、SG変更、IAM操作）を記録し既定で有効、90日間は無料で参照できる。データイベントはリソース内のデータに対する操作（S3のGetObject/PutObject、Lambdaの Invoke、DynamoDBの項目操作）を記録し、既定では無効で有効にすると件数に応じて課金される。S3からの情報持ち出しを追跡したいならデータイベントを有効にしておかなければ記録自体が残らない。また攻撃者は監視されていない未使用リージョンを狙うため、全リージョンでの証跡有効化が必要である。"},{"i":"s6#6-2","g":"s6","n":"6-2","t":"ログの保全性","s":"ログ集約先を別アカウントにする主な理由はどれか。","c":["ストレージコストが安くなるため","侵害されたアカウントの管理者権限を取られてもログを消せないようにするため","ログ検索が高速になるため","リージョン間転送が不要になるため"],"a":"イ","et":"侵害されたアカウントからは手が出せない構造にする","eb":"侵害されたアカウントの管理者権限を取られた場合、そのアカウント内のログは消せる。証跡を消されると何が起きたかを再構成できなくなる。ログを別アカウント（ログアーカイブ専用アカウント）へ集約し、書き込みは許可するが削除は許可しない設定にすれば、侵害されたアカウントからは手が出せない。S3オブジェクトロック（WORM）は保持期間中は誰も削除・上書きできない状態にし、ランサムウェア対策としても機能する。CloudTrailのログファイル検証は削除を防ぐのではなく改ざんを検知する仕組みである。"},{"i":"s6#6-3","g":"s6","n":"6-3","t":"GuardDuty","s":"GuardDuty の検出タイプのうち、認証情報の窃取を示唆するものはどれか。","c":["EC2インスタンスに紐づく一時認証情報が、そのインスタンス以外の場所から使われている","CPU使用率が閾値を超えた","ディスク空き容量が不足している","ALBのターゲットがUnhealthyになった"],"a":"ア","et":"重大度に応じた初動を事前に手順化する","eb":"GuardDutyの代表的な検出には、EC2からの異常な通信（既知のC&Cサーバとの通信、暗号通貨マイニングプールへの接続、ポートスキャン）、認証情報の不審な利用（インスタンスに紐づく一時認証情報が別の場所から使われている＝窃取）、異常なAPI呼び出し（普段使わないリージョンでの操作、CloudTrailの無効化、大量のリソース削除）、S3への異常なアクセスがある。High は即時対応として隔離・認証情報失効・スナップショットによる証拠保全、Medium は当日中の調査、Low は定期レビューといった初動を事前に手順化しておく。"},{"i":"s6#6-4","g":"s6","n":"6-4","t":"Security Hub","s":"Security Hub の位置づけとして正しいものはどれか。","c":["脅威を直接検知する単独のセンサー","各サービスの検出結果を共通フォーマットに正規化して一元表示する","ログを長期保管するアーカイブサービス","ネットワークトラフィックを遮断するファイアウォール"],"a":"イ","et":"どこを見れば現状が分かるかを一箇所に定める","eb":"GuardDuty、Inspector、Macie、Config、IAM Access Analyzer など各サービスの検出結果がそれぞれ別のコンソールに分散していると見落とす。Security Hub はこれらを共通フォーマット（ASFF）に正規化して一元表示し、マルチアカウント環境ではメンバーアカウントの結果を管理アカウントに集約できる。加えてAWS基礎セキュリティベストプラクティスやCIS Benchmarkなどの基準を有効化すると準拠率がスコアとして表示される。全て100%にする必要はなく、該当しないものは理由を記録して抑制し残りを計画的に潰す。"},{"i":"s6#6-5","g":"s6","n":"6-5","t":"SIEM連携","s":"インシデント調査の時間を左右する要素として最も重要なものはどれか。","c":["ログの保存容量","ログの検索性（パーティション設計、フォーマット統一、共通識別子）","ログの圧縮率","ログの配信間隔"],"a":"イ","et":"存在していても検索できなければ使えない","eb":"インシデント調査は時間との勝負であり、ログが存在していても検索に数十分かかる、フォーマットがバラバラで突き合わせられないという状態では実質的に使えない。効くのはパーティション設計（日付・アカウント・リージョンで分割）、タイムスタンプの形式統一、共通の識別子（リクエストID、トレースID、ユーザID）の埋め込みである。調査手順は、起点イベントの時刻と識別子を確定し、CloudTrail・VPC Flow Logs・ALBアクセスログ・アプリログを横断検索して単一のタイムラインに並べ、因果を推定する流れになる。"},{"i":"s6#6-6","g":"s6","n":"6-6","t":"検知から対応までの導線","s":"アラートを作成する際の必須項目として適切な組合せはどれか。","c":["閾値と通知先のみ","一次対応のオーナー、初動の手順、エスカレーション先","ログの保持期間と圧縮形式","メトリクスの取得間隔のみ"],"a":"イ","et":"定義のないアラートは鳴っても誰も動かない","eb":"アラートごとに、誰が一次対応するか（チーム名、オンコールローテーション）、最初に何をするか（確認すべきダッシュボード、実行するコマンド、ランブックへのリンク）、どうなったら誰に上げるか（15分で解決しなければリード、情報漏洩の疑いがあればセキュリティ担当と法務）を定義する。これが定義されていないアラートは鳴っても誰も動かない。加えてアラート疲れを防ぐため、発火件数と実際に対応した割合を定期集計し、対応率の低いアラートは閾値見直しかダッシュボード表示への格下げ、あるいは廃止を判断する。"},{"i":"s6#6-7","g":"s6","n":"6-7","t":"ログの保持コスト設計","s":"ログをGlacier系のストレージクラスへ階層化する際に、事前に確認しておくべきことはどれか。","c":["取り出しにかかる時間と費用を実際に試しておく","圧縮アルゴリズムを統一すること","ログのタイムゾーンをJSTに揃えること","アラートの閾値を下げること"],"a":"ア","et":"1年保持と決めたなら取り出し訓練を一度やる","eb":"直近（30〜90日）は即座に検索できる状態（CloudWatch Logs、S3標準＋Athena）に置き、それ以降は S3 Glacier Instant Retrieval や Glacier Flexible Retrieval へライフサイクルルールで移行する。注意点はGlacierからの取り出しには時間と費用がかかることで、1年保持と決めたなら実際に1年前のログを取り出す訓練を一度やって必要な時間を把握しておく。保持期間そのものは法令・契約上の義務、調査実務上の必要期間（侵害の発見までに平均数か月かかる統計を踏まえ最低1年）、監査要件の最大値から決める。"}]};
const KANA=["ア","イ","ウ","エ"];
const RANKS=[{k:"miss",n:"ミス"},{k:"jab",n:"ジャブ"},{k:"hit",n:"ヒット"},{k:"combo",n:"コンボ"}];
const KEY="sre-net-sec-progress-v1";
let mem={}, useLS=true;
try{ const r=localStorage.getItem(KEY); mem=r?JSON.parse(r):{}; }catch(e){ useLS=false; mem={}; }
function save(){ if(!useLS) return; try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){ useLS=false; } }
const streak=id=>mem[id]||0;
const rankOf=id=>Math.min(streak(id),3);
const byGroup=g=>D.qs.filter(q=>q.g===g);
function tally(g){const t=[0,0,0,0];byGroup(g).forEach(q=>t[rankOf(q.i)]++);return t;}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S={group:D.groups[0].id,pat:"all",queue:[],cur:null,picked:null,before:0};

function bar(title,back){return `<div class="bar">${back?`<button class="back" data-nav="${back}">戻る</button>`:""}<h1>${esc(title)}</h1></div>`;}
function talHTML(t){return `<div class="tal">`+RANKS.map((r,i)=>`<span class="t-${r.k}"><em>${r.n}</em><b>${t[i]}</b></span>`).join("")+`</div>`;}

function home(){
  app.innerHTML=`<div class="hero"><p class="k">SRE 実務スキルマップ</p>
  <h1>ネットワーク・セキュリティ<br>問題演習</h1>
  <p>全15ジャンル／${D.qs.length}問</p></div>
  <div class="menu">
    <button data-nav="setup"><b>問題演習</b><span>ジャンルと出題パターンを選んで解く</span></button>
    <button data-nav="score"><b>学習成績</b><span>ランク別の達成状況を確認する</span></button>
  </div>`;
}

function setup(){
  const rows=D.groups.map(g=>{const t=tally(g.id);const n=S.pat==="all"?byGroup(g.id).length:byGroup(g.id).length-t[3];
    return `<button data-g="${g.id}" aria-pressed="${S.group===g.id}"><span class="nm">${esc(g.name)}</span><span class="ct">${n} / ${byGroup(g.id).length}問</span></button>`;}).join("");
  const t=tally(S.group);const cnt=S.pat==="all"?byGroup(S.group).length:byGroup(S.group).length-t[3];
  app.innerHTML=bar("出題設定","home")+`<div class="wrap">
  <h2 class="sec">ジャンル</h2><div class="glist">${rows}</div>
  <h2 class="sec">出題パターン</h2>
  <div class="seg"><button data-p="all" aria-pressed="${S.pat==="all"}">全て</button><button data-p="nc" aria-pressed="${S.pat==="nc"}">コンボを除く</button></div>
  <p class="hint">現在の出題対象：<b>${cnt}</b>問</p>
  <button class="start" ${cnt?"":"disabled"} data-nav="quiz">出題を開始する</button></div>`;
}

function pool(){const a=byGroup(S.group);return S.pat==="all"?a:a.filter(q=>rankOf(q.i)<3);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nextQ(){
  if(!S.queue.length){const p=pool();if(!p.length){S.cur=null;return;}S.queue=shuffle(p.slice());}
  S.cur=S.queue.pop();S.picked=null;S.before=rankOf(S.cur.i);
}

function quiz(){
  const g=D.groups.find(x=>x.id===S.group);
  const total=pool().length;const t=tally(S.group);
  if(!S.cur){
    app.innerHTML=bar("問題演習","setup")+`<div class="wrap">
    <div class="qhead"><div class="g">${esc(g.name)}</div><div class="n">総問題数 <b>0</b></div>${talHTML(t)}</div>
    <div class="done"><p class="big">コンプリート</p><p>このジャンルは全問コンボに到達しました。</p></div>
    <button class="next" data-nav="setup">出題設定に戻る</button></div>`;return;}
  const q=S.cur;const r=RANKS[rankOf(q.i)];
  const choices=q.c.map((c,i)=>{
    let cls="ch";
    if(S.picked!==null){ if(KANA[i]===q.a)cls+=" ok"; else if(KANA[i]===S.picked)cls+=" ng"; }
    return `<button class="${cls}" data-pick="${KANA[i]}" ${S.picked!==null?"disabled":""}><span class="kana">${KANA[i]}</span><span>${esc(c)}</span></button>`;}).join("");
  let verdict="";
  if(S.picked!==null){
    const ok=S.picked===q.a;const after=rankOf(q.i);
    verdict=`<div class="verdict ${ok?"ok":"ng"}">
      <p class="v">${ok?"正解":"不正解"}（正解：${q.a}）</p>
      <p class="rk">ランク：${RANKS[S.before].n} → ${RANKS[after].n}</p>
      <h3>${esc(q.et)}</h3><p class="exp">${esc(q.eb)}</p></div>
      <button class="next" data-next="1">次の問題</button>`;
  }
  app.innerHTML=bar("問題演習","setup")+`<div class="wrap">
  <div class="qhead"><div class="g">${esc(g.name)}</div><div class="n">総問題数 <b>${total}</b></div>${talHTML(t)}</div>
  <div class="meta"><span class="chip c-${r.k}">${r.n}</span><span>${esc(q.n)}</span><span>${esc(q.t)}</span></div>
  <p class="stem">${esc(q.s)}</p>
  <div class="choices">${choices}</div>${verdict}</div>`;
}

function score(){
  let tot=[0,0,0,0],totN=0;
  const rows=D.groups.map(g=>{const t=tally(g.id);const n=byGroup(g.id).length;totN+=n;t.forEach((v,i)=>tot[i]+=v);
    return `<tr><td>${esc(g.name)}</td><td>${n}</td><td class="s-combo">${t[3]}</td><td class="s-hit">${t[2]}</td><td class="s-jab">${t[1]}</td><td class="s-miss">${t[0]}</td></tr>`;}).join("");
  const opts=[`<option value="__all__">すべてのジャンル</option>`].concat(D.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`)).join("");
  app.innerHTML=bar("学習成績","home")+`<div class="wrap">
  <table class="score"><thead><tr><th>ジャンル</th><th>総数</th><th>コンボ</th><th>ヒット</th><th>ジャブ</th><th>ミス</th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td>合計</td><td>${totN}</td><td>${tot[3]}</td><td>${tot[2]}</td><td>${tot[1]}</td><td>${tot[0]}</td></tr></tfoot></table>
  <div class="tools"><h3>正答履歴のクリア</h3>
  <select id="clearScope">${opts}</select>
  <p class="hint" id="clearInfo"></p>
  <div class="row"><button class="btn danger" id="clearBtn">履歴を削除する</button></div></div>
  <div class="tools"><h3>履歴の書き出し／読み込み</h3>
  <div class="row"><button class="btn" id="expBtn">書き出し（JSON）</button>
  <button class="btn" id="impBtn">読み込み</button>
  <input type="file" id="impFile" accept="application/json" style="display:none"></div>
  <p class="note">${useLS?"履歴はこのブラウザのローカル領域に保存されます。サイトデータの削除やプライベートモードでは失われるため、定期的な書き出しを推奨します。":"このビューアではローカル保存が使えないため、履歴はページを閉じると失われます。ファイルをダウンロードしてブラウザで開くと保存されるようになります。"}</p></div>
  </div>`;
  const sc=document.getElementById("clearScope"),info=document.getElementById("clearInfo"),btn=document.getElementById("clearBtn");
  const targets=()=>{const v=sc.value;const list=v==="__all__"?D.qs:byGroup(v);return list.filter(q=>mem[q.i]!==undefined);};
  const refresh=()=>{const n=targets().length;info.textContent=`履歴が記録されている問題：${n}件`;btn.disabled=n===0;};
  sc.onchange=refresh;refresh();
  btn.onclick=()=>{const t=targets();if(!t.length)return;
    if(!confirm(`${t.length}件の正答履歴を削除します。よろしいですか。`))return;
    t.forEach(q=>delete mem[q.i]);save();score();alert(`${t.length}件の履歴を削除しました。`);};
  document.getElementById("expBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(mem,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="sre-net-sec-progress.json";a.click();URL.revokeObjectURL(a.href);};
  document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);
      if(typeof o!=="object"||o===null||Array.isArray(o))throw 0;
      for(const k in o){if(typeof o[k]!=="number")throw 0;}
      mem=o;save();score();alert("履歴を読み込みました。");
    }catch(_){alert("形式が正しくありません。履歴は変更していません。");}};rd.readAsText(f);};
}

const views={home,setup,quiz,score};
function go(v){ if(v==="quiz"){S.queue=[];nextQ();} views[v](); }
app.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");
  if(nav){go(nav.dataset.nav);return;}
  const g=e.target.closest("[data-g]");
  if(g){S.group=g.dataset.g;setup();return;}
  const p=e.target.closest("[data-p]");
  if(p){S.pat=p.dataset.p;setup();return;}
  const pk=e.target.closest("[data-pick]");
  if(pk&&S.picked===null){
    S.picked=pk.dataset.pick;const q=S.cur;
    mem[q.i]=(S.picked===q.a)?Math.min(streak(q.i)+1,3):0;save();quiz();return;}
  if(e.target.closest("[data-next]")){nextQ();quiz();return;}
});
home();
</script>
</body></html>
