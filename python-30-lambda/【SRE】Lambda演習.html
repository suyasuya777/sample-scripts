<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【SRE】Lambda演習</title>
<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#f6f8fa;
  --ink:#17222e; --muted:#5d6d7c; --line:#d3dae1;
  --act:#2d5c7a; --act-ink:#ffffff;
  --ok:#1b6b4c; --ok-bg:#e6f2ec;
  --ng:#9c3630; --ng-bg:#f7e9e8;
  --combo:#8a6a12; --combo-bg:#f5eed9;
  --radius:4px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11171d; --surface:#19212a; --surface2:#1f2831;
    --ink:#e2e8ee; --muted:#93a3b1; --line:#2c3944;
    --act:#6fa8cc; --act-ink:#10171d;
    --ok:#6cc39b; --ok-bg:#16302a;
    --ng:#e08b85; --ng-bg:#331e1e;
    --combo:#d7b45a; --combo-bg:#332c16;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:15px; line-height:1.75;
  -webkit-text-size-adjust:100%;
}
code,.mono{font-family:ui-monospace,"Cascadia Mono","Consolas","Yu Gothic",monospace;font-size:.92em}
code{background:var(--surface2); border:1px solid var(--line); border-radius:3px; padding:.05em .3em; word-break:break-all}
.wrap{max-width:740px; margin:0 auto; padding:20px 16px 72px}
h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.02em}
h2{font-size:16px; margin:28px 0 10px; font-weight:700}
.sub{color:var(--muted); font-size:13px; margin-top:2px}
header.top{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:18px;
}
button{font:inherit; color:inherit; cursor:pointer}
.btn{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:5px 12px; font-size:13px; line-height:1.6;
}
.btn:hover{border-color:var(--act); color:var(--act)}
.btn.primary{background:var(--act); color:var(--act-ink); border-color:var(--act)}
.btn.primary:hover{opacity:.88; color:var(--act-ink)}
.btn.danger:hover{border-color:var(--ng); color:var(--ng)}
:focus-visible{outline:2px solid var(--act); outline-offset:2px}

/* ── ジャンル一覧 ───────────────────── */
.glist{border-top:1px solid var(--line)}
.grow{border-bottom:1px solid var(--line); padding:11px 0; display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap}
.gmain{flex:1 1 300px; min-width:0}
.gname{font-weight:600}
.gmeta{color:var(--muted); font-size:12px}
.gacts{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.bar{display:flex; height:6px; width:100%; max-width:260px; margin-top:6px; border:1px solid var(--line); background:var(--surface)}
.bar i{display:block; height:100%}
.bar .b-combo{background:var(--combo)}
.bar .b-hit{background:var(--act); opacity:.55}
.bar .b-jab{background:var(--act); opacity:.28}
.bar .b-miss{background:transparent}
.count{font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); white-space:nowrap}
.count b{color:var(--ink); font-weight:600}
.done .gname::after{content:"  コンプリート"; color:var(--combo); font-size:11px; font-weight:600}

/* ── 出題 ─────────────────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
.qhead{display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:10px; flex-wrap:wrap}
.qid{font-variant-numeric:tabular-nums}
.qtext{font-size:16px; font-weight:600; line-height:1.8; margin:0 0 14px}
.choices{display:flex; flex-direction:column; gap:8px}
.ch{
  display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface2); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 12px; line-height:1.7;
}
.ch:hover:not(:disabled){border-color:var(--act)}
.ch:disabled{cursor:default}
.ch .k{
  flex:0 0 auto; width:20px; height:20px; margin-top:2px; border:1px solid var(--line);
  border-radius:3px; display:grid; place-items:center; font-size:11px; color:var(--muted);
  font-variant-numeric:tabular-nums; background:var(--surface);
}
.ch.pick-ok{background:var(--ok-bg); border-color:var(--ok)}
.ch.pick-ok .k{border-color:var(--ok); color:var(--ok)}
.ch.pick-ng{background:var(--ng-bg); border-color:var(--ng)}
.ch.pick-ng .k{border-color:var(--ng); color:var(--ng)}
.ch.reveal{border-color:var(--ok)}
.verdict{margin:16px 0 0; padding-top:14px; border-top:1px solid var(--line)}
.vtag{font-weight:700}
.vtag.ok{color:var(--ok)}
.vtag.ng{color:var(--ng)}
.exp{margin:6px 0 0; font-size:14px}
.ref{margin-top:8px; font-size:12px; color:var(--muted)}
.rankline{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12px; color:var(--muted); flex-wrap:wrap}
.pips{display:flex; gap:3px}
.pips i{width:11px; height:11px; border:1px solid var(--line); border-radius:2px; display:block}
.pips i.on{background:var(--act); border-color:var(--act)}
.pips i.full{background:var(--combo); border-color:var(--combo)}
.navrow{display:flex; justify-content:space-between; gap:10px; margin-top:16px; align-items:center; flex-wrap:wrap}
.hint{font-size:11px; color:var(--muted)}

/* ── 結果・成績 ───────────────────── */
.banner{border:1px solid var(--combo); background:var(--combo-bg); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px}
.banner h2{margin:0 0 4px; font-size:16px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{border-bottom:1px solid var(--line); padding:7px 6px; text-align:right; font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left; font-variant-numeric:normal}
thead th{border-bottom:1.5px solid var(--ink); font-weight:600; color:var(--muted); font-size:12px}
tbody tr:hover{background:var(--surface2)}
tfoot td{font-weight:600; border-top:1.5px solid var(--ink); border-bottom:none}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0}
.note{font-size:12px; color:var(--muted); margin-top:10px}
.hide{display:none !important}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <h1>【SRE】Lambda演習</h1>
    <div class="sub" id="subhead"></div>
  </div>
  <div class="gacts">
    <button class="btn" id="navHome">ジャンル一覧</button>
    <button class="btn" id="navStats">学習成績</button>
  </div>
</header>

<!-- ホーム -->
<section id="home">
  <div class="grow" style="border-top:1px solid var(--line)">
    <div class="gmain">
      <div class="gname">全ジャンル</div>
      <div class="gmeta" id="allMeta"></div>
      <div class="bar" id="allBar"></div>
    </div>
    <div class="gacts">
      <button class="btn" data-scope="*" data-mode="all">全て</button>
      <button class="btn primary" data-scope="*" data-mode="noncombo">コンボを除く</button>
    </div>
  </div>
  <div class="glist" id="glist"></div>
  <p class="note">
    3回連続で正解すると「コンボ」。1回でも誤答すると「ミス」に戻ります。<br>
    <b>全て</b>＝そのジャンルを1周して現在地を把握する。<b>コンボを除く</b>＝未コンボだけを繰り返し、コンプリートまで潰す。
  </p>
</section>

<!-- 出題 -->
<section id="quiz" class="hide">
  <div class="card">
    <div class="qhead">
      <span class="qid" id="qid"></span>
      <span id="qprog"></span>
    </div>
    <p class="qtext" id="qtext"></p>
    <div class="choices" id="choices"></div>
    <div class="verdict hide" id="verdict">
      <div><span class="vtag" id="vtag"></span> <span id="vrank"></span></div>
      <p class="exp" id="vexp"></p>
      <div class="ref" id="vref"></div>
      <div class="rankline">
        <span>連続正解</span>
        <span class="pips" id="pips"></span>
        <span id="pipstext"></span>
      </div>
    </div>
    <div class="navrow">
      <button class="btn" id="quitBtn">中断して一覧へ</button>
      <div class="gacts">
        <span class="hint" id="kbdHint">1〜4 キーで選択</span>
        <button class="btn primary hide" id="nextBtn">次の問題</button>
      </div>
    </div>
  </div>
</section>

<!-- セッション結果 -->
<section id="result" class="hide">
  <div class="banner" id="resultBanner">
    <h2 id="rTitle"></h2>
    <div id="rBody"></div>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="rAgain"></button>
    <button class="btn" id="rHome">ジャンル一覧へ</button>
    <button class="btn" id="rStats">学習成績を見る</button>
  </div>
</section>

<!-- 学習成績 -->
<section id="stats" class="hide">
  <h2>ジャンル別</h2>
  <table>
    <thead>
      <tr><th>ジャンル</th><th>問数</th><th>ミス</th><th>ジャブ</th><th>ヒット</th><th>コンボ</th><th>誤答</th><th>正答率</th></tr>
    </thead>
    <tbody id="statBody"></tbody>
    <tfoot id="statFoot"></tfoot>
  </table>

  <h2>直近のセッション</h2>
  <table>
    <thead><tr><th>日時</th><th>範囲</th><th>出題</th><th>正答</th><th>結果</th></tr></thead>
    <tbody id="sessBody"></tbody>
  </table>

  <h2>履歴の保管</h2>
  <div class="toolbar">
    <button class="btn primary" id="expBtn">JSONを書き出す</button>
    <button class="btn" id="impBtn">JSONを読み込む</button>
    <input type="file" id="impFile" accept="application/json,.json">
    <button class="btn danger" id="resetBtn">履歴をリセット</button>
  </div>
  <p class="note">
    履歴はこのブラウザのローカル領域にだけ保存されます。サイトデータの削除やプライベートウィンドウでは消えます。
    各期末（3/21・3/28・4/4・4/11・4/14）に書き出して保管してください。
  </p>
</section>

</div>

<script>
const GENRES = [
  { id: "01", name: "Lambda 実行基盤とハンドラ", phase: "第1期", day: "3/15〜3/17", file: "（全サンプル共通）" },
  { id: "02", name: "EventBridge 定期実行", phase: "第1期", day: "3/16〜3/19", file: "eventbridge_scheduled_job.py" },
  { id: "03", name: "実行環境の再利用とシークレット", phase: "第1期", day: "3/17〜3/19", file: "secrets_manager_ssm.py" },
  { id: "04", name: "S3 イベント", phase: "第1期", day: "3/18〜3/21", file: "s3_event_integration.py" },
  { id: "05", name: "署名付きURLとSNS発行", phase: "第1期", day: "3/21〜3/24", file: "s3_presigned_url.py / sns_publisher.py" },
  { id: "06", name: "API Gateway プロキシ統合", phase: "第2期", day: "3/22〜3/25", file: "rest_api.py" },
  { id: "07", name: "Cognito Pre Sign-up", phase: "第2期", day: "3/24〜3/28", file: "cognito_pre_signup_trigger.py" },
  { id: "08", name: "SQS イベントソース", phase: "第3期", day: "3/29〜3/31", file: "sqs_sns_integration.py" },
  { id: "09", name: "DynamoDB Streams", phase: "第3期", day: "4/1〜4/4", file: "dynamodb_streams_trigger.py" },
  { id: "10", name: "エラー設計・DLQ・冪等性", phase: "第3期", day: "4/2〜4/5", file: "error_handling_dlq.py" },
  { id: "11", name: "統合：API GW → DynamoDB → SES", phase: "第4期", day: "4/5〜4/7", file: "api_gateway_dynamodb_ses_integration/" },
  { id: "12", name: "VPC・RDS 接続", phase: "第4期", day: "4/8〜4/11", file: "vpc_rds_connection.py" },
  { id: "13", name: "Step Functions", phase: "第4期", day: "4/11〜4/13", file: "step_functions_trigger.py" },
  { id: "14", name: "Powertools と可観測性", phase: "第5期", day: "4/12〜4/14", file: "powertools_middleware.py" }
];

const QUESTIONS = [
  // ── 01 Lambda 実行基盤とハンドラ ──────────────────────────
  { id: "01-01", g: "01",
    q: "`lambda_handler(event, context)` の第2引数 `context` から取得できないものはどれか。",
    c: ["残りの実行可能時間（`get_remaining_time_in_millis()`）", "関数名とバージョン", "このリクエストの AWS リクエストID", "イベントを発生させたサービス名"],
    a: 3,
    e: "`context` は実行環境そのものの情報（関数名、リクエストID、残り時間、メモリ上限、ロググループ名など）を持ちます。どのサービスから呼ばれたかは `event` 側の構造で判断します。S3 なら `Records[].s3`、EventBridge なら `source` といった具合に、イベントソースごとに形が違うのがこの1ヶ月の主眼です。",
    r: "全サンプル共通" },
  { id: "01-02", g: "01",
    q: "Terraform で `aws_cloudwatch_log_group` を明示的に作る理由として正しいものはどれか。",
    c: ["明示的に作らないと Lambda のログが一切出力されないため", "Lambda が自動作成したロググループは保持期間が無期限になるため", "ロググループを先に作らないと関数のデプロイが失敗するため", "自動作成されたロググループは Logs Insights の対象外になるため"],
    a: 1,
    e: "ロググループは初回実行時に Lambda が自動作成しますが、そのとき保持期間は「無期限」になります。ログが溜まり続けて課金されるので、`retention_in_days` を付けた状態で先に作っておくのが定石です。",
    r: "3/15 基盤構築" },
  { id: "01-03", g: "01",
    q: "S3 や API Gateway からトリガを構成したのに Lambda が起動しない。最初に疑うべきものはどれか。",
    c: ["実行ロールに `AWSLambdaBasicExecutionRole` が付いていない", "`aws_lambda_permission`（リソースベースポリシー）を付けていない", "関数のタイムアウトが短すぎる", "予約済み同時実行数が 0 になっている"],
    a: 1,
    e: "他サービスが Lambda を呼ぶ許可は、関数側のリソースベースポリシーで与えます。Terraform では `aws_lambda_permission` です。実行ロール（Lambda が他サービスを呼ぶための権限）とは向きが逆で、ここを混同するのがこの月で一番多いつまずきです。",
    r: "3/16・3/19・3/23" },
  { id: "01-04", g: "01",
    q: "Lambda の実行ロールが制御する範囲として正しいものはどれか。",
    c: ["Lambda が DynamoDB や S3 など他のサービスを呼ぶときの権限", "誰がこの Lambda 関数を呼び出せるか", "関数が接続できる VPC とサブネットの範囲", "関数のログをどのロググループに書くかの指定"],
    a: 0,
    e: "実行ロールは「Lambda から外向き」の権限です。「誰が呼べるか」はリソースベースポリシー側。教材では `AWSLambdaBasicExecutionRole` だけから始め、`AccessDenied` を読みながら必要な権限を足していく進め方を取ります。",
    r: "3/15 基盤構築" },
  { id: "01-05", g: "01",
    q: "教材のサンプルが `boto3.client(\"s3\")` などをハンドラ関数の外（モジュールスコープ）に書いている理由はどれか。",
    c: ["ハンドラ内に書くと boto3 が import エラーになるため", "実行環境が再利用される間、クライアント生成が1回で済むため", "モジュールスコープに書かないと IAM 権限が解決されないため", "Lambda の仕様でハンドラ内に boto3 を書くことが禁止されているため"],
    a: 1,
    e: "Lambda は実行環境（コンテナ）を使い回します。モジュールスコープのコードはコールドスタート時にだけ走るので、クライアント生成や設定取得をここに置くと2回目以降の呼び出しが速くなります。`secrets_manager_ssm.py` のキャッシュも同じ仕組みを使っています。",
    r: "全サンプル共通" },
  { id: "01-06", g: "01",
    q: "`api_gateway_dynamodb_ses_integration` は handler.py / db.py / mailer.py の3ファイル構成になっている。handler.py の `import db` が成立する条件はどれか。",
    c: ["3ファイルが zip のルート直下に同じ階層で入っていること", "db.py を Lambda Layer として別に配置すること", "`PYTHONPATH` に `/var/task` を明示的に設定すること", "handler.py で `from . import db` と相対 import に書き換えること"],
    a: 0,
    e: "Lambda はデプロイパッケージを `/var/task` に展開し、そこが `sys.path` に入ります。3ファイルが同階層にあれば `import db` はそのまま通ります。Terraform では `archive_file` の `source_dir` にディレクトリを指定して固めます。",
    r: "api_gateway_dynamodb_ses_integration/handler.py" },
  { id: "01-07", g: "01",
    q: "Python ランタイムにあらかじめ同梱されているライブラリはどれか。",
    c: ["boto3", "pymysql", "aws_lambda_powertools", "requests"],
    a: 0,
    e: "同梱されているのは boto3（と botocore）だけです。`vpc_rds_connection.py` の `pymysql` や `powertools_middleware.py` の Powertools は、Lambda Layer を使うか、依存を含めた zip を自分で作る必要があります。`ModuleNotFoundError` の原因はほぼこれです。",
    r: "vpc_rds_connection.py / powertools_middleware.py" },
  { id: "01-08", g: "01",
    q: "ハンドラの戻り値について正しいものはどれか。",
    c: ["どの呼び出し方でも必ず呼び出し元に返る", "同期（RequestResponse）では呼び出し元に返るが、非同期（Event）では捨てられる", "非同期呼び出しでは DLQ に自動で格納される", "戻り値が dict 以外だと必ず実行エラーになる"],
    a: 1,
    e: "非同期呼び出しでは戻り値を受け取る相手がいないので捨てられます。結果を残したいなら Lambda Destinations（`OnSuccess` / `OnFailure`）を使います。`error_handling_dlq.py` が 400 を「返す」だけでは非同期経路では誰も見ない、という論点にそのままつながります。",
    r: "error_handling_dlq.py" },

  // ── 02 EventBridge 定期実行 ────────────────────────────────
  { id: "02-01", g: "02",
    q: "`eventbridge_scheduled_job.py` が読んでいる `event[\"time\"]` に入っているものはどれか。",
    c: ["関数がコールドスタートした時刻", "スケジュールされたイベントの発生時刻（ISO 8601 形式の文字列）", "前回実行からの経過秒数", "`datetime` 型の実行時刻オブジェクト"],
    a: 1,
    e: "EventBridge のイベントは `time` に ISO 8601 形式の文字列で発生時刻を持ちます。`datetime` ではなく文字列なので、日付計算をするならパースが必要です。コードは別途 `datetime.now(timezone.utc)` で当月1日を組み立てています。",
    r: "eventbridge_scheduled_job.py" },
  { id: "02-02", g: "02",
    q: "`cron(0 17 * * ? *)` は日本時間では何時の実行になるか。",
    c: ["毎日 17:00", "毎日 翌 2:00", "毎日 8:00", "毎日 12:00"],
    a: 1,
    e: "EventBridge の cron 式は UTC で解釈されます。UTC 17:00 は JST（+9時間）で翌日 2:00。コード中のコメントもそうなっています。JST のつもりで書くと9時間ずれるのが定番の事故です。",
    r: "eventbridge_scheduled_job.py" },
  { id: "02-03", g: "02",
    q: "cron 式と rate 式の使い分けとして正しいものはどれか。",
    c: ["rate 式は「5分ごと」のような間隔指定、cron 式は「毎日2時」のような時刻指定に使う", "rate 式は秒単位、cron 式は分単位でしか指定できない", "rate 式は UTC、cron 式はローカルタイムゾーンで解釈される", "rate 式は1日1回までしか指定できない"],
    a: 0,
    e: "`rate(5 minutes)` は「前回から5分後」という間隔の指定、`cron(0 17 * * ? *)` は「その時刻ちょうど」という指定です。どちらも UTC 基準です。曜日と日の両方を指定できないため、cron 式ではどちらかに `?` を置きます。",
    r: "eventbridge_scheduled_job.py" },
  { id: "02-04", g: "02",

/* ── 保存 ─────────────────────────── */
const KEY = "sre-lambda-drill-v1";
const RANKS = ["ミス","ジャブ","ヒット","コンボ"];
let state = load();

function blank(){ return { version:1, updatedAt:null, q:{}, totals:{answered:0,correct:0}, sessions:[] }; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const o = JSON.parse(raw);
    if(!o || typeof o!=="object" || !o.q) return blank();
    return Object.assign(blank(), o);
  }catch(e){ return blank(); }
}
function save(){
  state.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ console.warn("保存に失敗しました", e); }
}
function rec(id){
  if(!state.q[id]) state.q[id] = { s:0, n:0, w:0 };
  return state.q[id];
}
function streak(id){ return state.q[id] ? state.q[id].s : 0; }
function rankIdx(id){ const s = streak(id); return s>=3 ? 3 : s; }

/* ── 表示ヘルパー ─────────────────── */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, (_,m)=>"<code>"+m+"</code>").replace(/\n/g,"<br>"); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function byGenre(g){ return QUESTIONS.filter(q => q.g === g); }
function scopeQs(scope){ return scope === "*" ? QUESTIONS.slice() : byGenre(scope); }
function scopeName(scope){
  if(scope === "*") return "全ジャンル";
  const g = GENRES.find(x => x.id === scope);
  return g ? g.id + " " + g.name : scope;
}
function dist(list){
  const d=[0,0,0,0];
  list.forEach(q => d[rankIdx(q.id)]++);
  return d;
}
function barHTML(d, total){
  const order=[["b-combo",d[3]],["b-hit",d[2]],["b-jab",d[1]],["b-miss",d[0]]];
  return order.map(([cls,n]) => '<i class="'+cls+'" style="width:'+(total? n/total*100 : 0)+'%"></i>').join("");
}

/* ── 画面切替 ─────────────────────── */
const V = { home:el("home"), quiz:el("quiz"), result:el("result"), stats:el("stats") };
function el(id){ return document.getElementById(id); }
function show(name){
  Object.keys(V).forEach(k => V[k].classList.toggle("hide", k !== name));
  window.scrollTo(0,0);
}

/* ── ホーム ───────────────────────── */
function renderHome(){
  const all = QUESTIONS, ad = dist(all);
  el("allMeta").textContent = GENRES.length + "ジャンル・" + all.length + "問　コンボ " + ad[3] + " / " + all.length;
  el("allBar").innerHTML = barHTML(ad, all.length);

  el("glist").innerHTML = GENRES.map(g => {
    const list = byGenre(g.id), d = dist(list), done = d[3] === list.length && list.length > 0;
    return '<div class="grow'+(done?" done":"")+'">'
      + '<div class="gmain">'
      +   '<div class="gname">'+esc(g.id+". "+g.name)+'</div>'
      +   '<div class="gmeta">'+esc(g.phase+"｜"+g.day+"｜"+g.file)+'</div>'
      +   '<div class="bar">'+barHTML(d, list.length)+'</div>'
      + '</div>'
      + '<div class="gacts">'
      +   '<span class="count">コンボ <b>'+d[3]+'</b> / '+list.length+'</span>'
      +   '<button class="btn" data-scope="'+g.id+'" data-mode="all">全て</button>'
      +   '<button class="btn primary" data-scope="'+g.id+'" data-mode="noncombo">コンボを除く</button>'
      + '</div></div>';
  }).join("");

  const t = state.totals;
  el("subhead").textContent = "14ジャンル・" + QUESTIONS.length + "問　累計 " + t.answered + "回答／正答率 "
    + (t.answered ? Math.round(t.correct / t.answered * 100) : 0) + "%";
}

/* ── セッション ───────────────────── */
let S = null;

function startSession(scope, mode){
  const pool = scopeQs(scope);
  let queue;
  if(mode === "all"){
    queue = shuffle(pool).map(q => q.id);
  }else{
    queue = shuffle(pool.filter(q => rankIdx(q.id) < 3)).map(q => q.id);
    if(queue.length === 0){
      S = { scope, mode, asked:0, correct:0 };
      finishSession(true);
      return;
    }
  }
  S = { scope, mode, queue, asked:0, correct:0, startedAt:new Date().toISOString(), answered:false, cur:null };
  show("quiz");
  nextQuestion();
}

function nextQuestion(){
  if(S.mode === "noncombo"){
    // コンボ済みになったものは取り除く
    S.queue = S.queue.filter(id => rankIdx(id) < 3);
  }
  if(S.queue.length === 0){ finishSession(S.mode === "noncombo"); return; }

  const id = S.queue.shift();
  const q = QUESTIONS.find(x => x.id === id);
  const order = shuffle(q.c.map((text, i) => ({ text, i })));
  S.cur = { q, order };
  S.answered = false;

  el("qid").textContent = q.id + "　" + scopeName(q.g).replace(/^\d\d /, "");
  el("qprog").textContent = S.mode === "noncombo"
    ? "残り " + (S.queue.length + 1) + " 問（未コンボ）"
    : (S.asked + 1) + " / " + (S.asked + 1 + S.queue.length) + " 問";
  el("qtext").innerHTML = fmt(q.q);
  el("choices").innerHTML = order.map((o, n) =>
    '<button class="ch" data-n="'+n+'"><span class="k">'+(n+1)+'</span><span>'+fmt(o.text)+'</span></button>'
  ).join("");
  el("verdict").classList.add("hide");
  el("nextBtn").classList.add("hide");
  el("kbdHint").classList.remove("hide");
  [...document.querySelectorAll(".ch")].forEach(b => b.addEventListener("click", () => answer(+b.dataset.n)));
}

function answer(n){
  if(S.answered) return;
  S.answered = true;
  const { q, order } = S.cur;
  const correct = order[n].i === q.a;
  const r = rec(q.id);

  r.n++;
  if(correct){ r.s++; } else { r.s = 0; r.w++; }
  S.asked++; if(correct) S.correct++;
  state.totals.answered++; if(correct) state.totals.correct++;
  if(S.mode === "noncombo" && r.s < 3) S.queue.push(q.id);
  save();

  const btns = [...document.querySelectorAll(".ch")];
  btns.forEach((b, i) => {
    b.disabled = true;
    if(order[i].i === q.a) b.classList.add(i === n ? "pick-ok" : "reveal");
    else if(i === n) b.classList.add("pick-ng");
  });

  el("vtag").textContent = correct ? "正解" : "不正解";
  el("vtag").className = "vtag " + (correct ? "ok" : "ng");
  el("vrank").textContent = "この問題のランク：" + RANKS[rankIdx(q.id)];
  el("vexp").innerHTML = fmt(q.e);
  el("vref").innerHTML = "参照：" + fmt(q.r);

  const s = Math.min(r.s, 3);
  el("pips").innerHTML = [0,1,2].map(i =>
    '<i class="'+(i < s ? (s >= 3 ? "full" : "on") : "")+'"></i>').join("");
  el("pipstext").textContent = r.s >= 3 ? "コンボ達成" : (3 - r.s) + " 回連続で正解するとコンボ";

  el("verdict").classList.remove("hide");
  el("nextBtn").classList.remove("hide");
  el("kbdHint").classList.add("hide");
  el("nextBtn").focus();
}

function finishSession(complete){
  const list = scopeQs(S.scope), d = dist(list);
  if(S.startedAt){
    state.sessions.unshift({
      at:S.startedAt, scope:S.scope, mode:S.mode,
      asked:S.asked, correct:S.correct, complete: !!complete
    });
    state.sessions = state.sessions.slice(0, 40);
    save();
  }
  el("rTitle").textContent = complete
    ? "コンプリート — " + scopeName(S.scope)
    : "1周終了 — " + scopeName(S.scope);
  const rate = S.asked ? Math.round(S.correct / S.asked * 100) : 0;
  el("rBody").innerHTML = complete
    ? fmt(scopeName(S.scope) + " の " + list.length + "問がすべてコンボになりました。\nこのセッション：" + S.asked + "問出題／正答 " + S.correct + "（" + rate + "%）")
    : fmt("このセッション：" + S.asked + "問出題／正答 " + S.correct + "（" + rate + "%）\n現在のランク：ミス " + d[0] + "・ジャブ " + d[1] + "・ヒット " + d[2] + "・コンボ " + d[3]);
  el("rAgain").textContent = complete ? "もう一度「全て」で回す" : "「コンボを除く」で潰す";
  el("rAgain").dataset.mode = complete ? "all" : "noncombo";
  el("rAgain").dataset.scope = S.scope;
  show("result");
}

/* ── 学習成績 ─────────────────────── */
function renderStats(){
  let tot = [0,0,0,0], totW = 0, totN = 0;
  el("statBody").innerHTML = GENRES.map(g => {
    const list = byGenre(g.id), d = dist(list);
    let w = 0, n = 0;
    list.forEach(q => { const r = state.q[q.id]; if(r){ w += r.w; n += r.n; } });
    tot = tot.map((v, i) => v + d[i]); totW += w; totN += n;
    return "<tr><td>" + esc(g.id + ". " + g.name) + "</td><td>" + list.length + "</td>"
      + "<td>" + d[0] + "</td><td>" + d[1] + "</td><td>" + d[2] + "</td><td>" + d[3] + "</td>"
      + "<td>" + w + "</td><td>" + (n ? Math.round((n - w) / n * 100) + "%" : "—") + "</td></tr>";
  }).join("");
  el("statFoot").innerHTML = "<tr><td>合計</td><td>" + QUESTIONS.length + "</td>"
    + "<td>" + tot[0] + "</td><td>" + tot[1] + "</td><td>" + tot[2] + "</td><td>" + tot[3] + "</td>"
    + "<td>" + totW + "</td><td>" + (totN ? Math.round((totN - totW) / totN * 100) + "%" : "—") + "</td></tr>";

  el("sessBody").innerHTML = state.sessions.length
    ? state.sessions.slice(0, 20).map(s => {
        const dt = new Date(s.at);
        const label = dt.getFullYear() + "/" + (dt.getMonth() + 1) + "/" + dt.getDate() + " "
          + String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0");
        return "<tr><td>" + label + "</td><td>" + esc(scopeName(s.scope)) + "（" + (s.mode === "all" ? "全て" : "コンボを除く") + "）</td>"
          + "<td>" + s.asked + "</td><td>" + s.correct + "</td><td>" + (s.complete ? "コンプリート" : "—") + "</td></tr>";
      }).join("")
    : '<tr><td colspan="5" style="text-align:left;color:var(--muted)">まだ記録がありません。ジャンル一覧から始めてください。</td></tr>';
}

/* ── 書き出し・読み込み ───────────── */
function exportJSON(){
  const payload = { app:"【SRE】Lambda演習", exportedAt:new Date().toISOString(), data:state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const name = "lambda-drill-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
    + "-" + p(d.getHours()) + p(d.getMinutes()) + ".json";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importJSON(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const o = JSON.parse(fr.result);
      const d = o && o.data ? o.data : o;
      if(!d || typeof d !== "object" || !d.q) throw new Error("形式が違います");
      if(!confirm("読み込むと現在の履歴は置き換わります。続けますか。")) return;
      state = Object.assign(blank(), d);
      save(); renderHome(); renderStats();
      alert("読み込みました。");
    }catch(e){
      alert("読み込めませんでした：" + e.message);
    }
  };
  fr.readAsText(file);
}

/* ── イベント ─────────────────────── */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-scope][data-mode]");
  if(b){ startSession(b.dataset.scope, b.dataset.mode); }
});
el("navHome").addEventListener("click", () => { renderHome(); show("home"); });
el("navStats").addEventListener("click", () => { renderStats(); show("stats"); });
el("rHome").addEventListener("click", () => { renderHome(); show("home"); });
el("rStats").addEventListener("click", () => { renderStats(); show("stats"); });
el("nextBtn").addEventListener("click", nextQuestion);
el("quitBtn").addEventListener("click", () => {
  if(S && S.asked > 0) finishSession(false);
  else { renderHome(); show("home"); }
});
el("expBtn").addEventListener("click", exportJSON);
el("impBtn").addEventListener("click", () => el("impFile").click());
el("impFile").addEventListener("change", e => { if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; });
el("resetBtn").addEventListener("click", () => {
  if(!confirm("すべての履歴を消します。書き出しは済んでいますか。")) return;
  state = blank(); save(); renderHome(); renderStats();
});
document.addEventListener("keydown", e => {
  if(V.quiz.classList.contains("hide")) return;
  if(!S || !S.cur) return;
  if(!S.answered && e.key >= "1" && e.key <= "4"){
    const n = +e.key - 1;
    if(n < S.cur.order.length){ e.preventDefault(); answer(n); }
  }else if(S.answered && (e.key === "Enter" || e.key === " ")){
    e.preventDefault(); nextQuestion();
  }
});

renderHome();
show("home");
</script>
